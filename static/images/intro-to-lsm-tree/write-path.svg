    .w28 { animation-name: w28; }  /* 0.5s to 3.2s */
    @keyframes w28 { 0.00%, 1.59% { opacity: 0 } 1.88%, 16.21% { opacity: 1 } 16.51%, 100.00% { opacity: 0 } }
    .w29 { animation-name: w29; }  /* 4.2s to 6.9s */
    @keyframes w29 { 0.00%, 22.54% { opacity: 0 } 23.12%, 37.76% { opacity: 1 } 38.06%, 100.00% { opacity: 0 } }
    .w30 { animation-name: w30; }  /* 7.9s to 10.6s */
    @keyframes w30 { 0.00%, 44.10% { opacity: 0 } 44.66%, 59.29% { opacity: 1 } 59.60%, 100.00% { opacity: 0 } }
    .w31 { animation-name: w31; }  /* 10.6s to 12s */
    @keyframes w31 { 0.00%, 58.98% { opacity: 0 } 59.29%, 67.41% { opacity: 1 } 67.71%, 100.00% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .w { animation: none; opacity: 0; }
      .w.fin { opacity: 1; }
    }
