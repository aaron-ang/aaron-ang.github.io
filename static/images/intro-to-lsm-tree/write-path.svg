    .w15 { animation-name: w15; }  /* 9.1s to 10.6s */
    @keyframes w15 { 0.00%, 51.09% { opacity: 0 } 51.57%, 59.29% { opacity: 1 } 59.60%, 100.00% { opacity: 0 } }
