  <g class="w w24 fin"><path d="M 614 244 L 638 244" class="arrow"/><polygon points="636,238 647,244 636,250" class="arrowhead"/></g>
  <text x="629" y="202" text-anchor="middle" class="num w w24 fin">merge</text>
  <line x1="356" y1="229" x2="416" y2="229" class="strike w w25 fin"/>
  <line x1="356" y1="259" x2="416" y2="259" class="strike w w25 fin"/>
  <text x="345" y="340" class="num w w25 fin">older a=2 and b=1 dropped (newest wins)</text>
  <text x="345" y="358" class="muted w w26 fin">input SSTables are deleted after the merge</text>
  <rect x="645" y="211" width="96" height="126" rx="5" class="okbox w w27 fin"/>
  <text x="693" y="354" text-anchor="middle" class="muted w w27 fin">compacted SSTable</text>
  <rect x="340" y="206" width="272" height="76" class="veil w w26 fin"/>
  <g class="w w27 fin"><rect x="650" y="216" width="86" height="26" rx="3" class="chip"/><text x="693" y="234" text-anchor="middle" class="code">a=6</text></g>
