<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated LSM tree write path: writes are appended to the commit log and inserted into a sorted Memtable, the full Memtable is flushed to disk as an immutable SSTable, and three SSTables are compacted into one where older values are dropped">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --chip: #f4f4f4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --chip: #2a2a2a; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .code { font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .cap { font-size: 14px; }
    .full { fill: var(--full); stroke: var(--edge); }
    .empty { fill: var(--empty); stroke: var(--edge); }
    .chip { fill: var(--chip); stroke: var(--edge); }
    .box { fill: none; stroke: var(--edge); }
    .dashbox { stroke-dasharray: 4 3; }
    .okbox { fill: none; stroke: var(--ok); stroke-width: 2.5; }
    .ring { fill: none; stroke: var(--probe); stroke-width: 3; }
    .num { fill: var(--probe); font-weight: 600; font-size: 12px; }
    .oktext { fill: var(--ok); font-weight: 600; }
    .gauge { fill: var(--full); }
    .gaugefull { fill: var(--probe); }
    .arrow { fill: none; stroke: var(--probe); stroke-width: 2; }
    .arrowhead { fill: var(--probe); }
    .sarrow { fill: none; stroke: var(--edge); stroke-width: 1.5; }
    .sarrowhead { fill: var(--edge); }
    .veil { fill: var(--empty); fill-opacity: 0.5; }
    .strike { stroke: var(--probe); stroke-width: 2.5; }
    /* 20s loop. Each wN shows its element during one time window; ALL timing is in keyframes. */
    .w { opacity: 0; animation: 26.5s linear infinite; }
    .w1 { animation-name: w1; }  /* 0.5s to 1.7s */
    @keyframes w1 { 0.00%, 1.59% { opacity: 0 } 1.88%, 8.49% { opacity: 1 } 8.78%, 100.00% { opacity: 0 } }
    .w2 { animation-name: w2; }  /* 1.7s to 2.9s */
