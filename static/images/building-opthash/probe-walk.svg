<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 313"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
  role="img"
  aria-label="Animated probe walk: uniform probing inserts into the first empty slot, Elastic stops after its probe budget and inserts into the next array"
  width="720"
  height="313"
  data-diagram-width="720"
>
  <style>
    :root {
      --fg: #222;
      --full: #cfcfcf;
      --empty: #ffffff;
      --edge: #999;
      --probe: #d9480f;
      --ok: #2b8a3e;
      --skip: #999;
      --muted: #707071;
      --label-load: #8a2c0a;
      --label-compute: #237a36;
      --type-heading: 21.11110929px;
      --type-subheading: 16.888887px;
      --type-label: 14.77777651px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --full: #555;
        --empty: #1e1e1e;
        --edge: #777;
        --probe: #ff8a4c;
        --ok: #69db7c;
        --skip: #888;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .muted {
      fill: var(--muted);
    }
    .full {
      fill: var(--full);
      stroke: var(--edge);
    }
    .empty {
      fill: var(--empty);
      stroke: var(--edge);
    }
    .ring {
      fill: none;
      stroke: var(--probe);
      stroke-width: 3;
    }
    .num {
      font-weight: 600;
      fill: var(--label-load);
    }
    .skip {
      fill: none;
      stroke: var(--skip);
      stroke-width: 2;
      stroke-dasharray: 5 4;
    }
    .new {
      fill: var(--ok);
    }
    .oktext {
      font-weight: 600;
      fill: var(--label-compute);
    }
    .arrow {
      fill: none;
      stroke: var(--probe);
      stroke-width: 2;
    }
    .arrowhead {
      fill: var(--probe);
    }

    /* 13.7s loop. Each class shows its element during one time window. */
    .s1 {
      opacity: 0;
      animation: 13.7s linear infinite;
      animation-name: s1;
    }
    .s2 {
      opacity: 0;
      animation: 13.7s linear infinite;
      animation-name: s2;
    }
    .s3 {
      opacity: 0;
      animation: 13.7s linear infinite;
      animation-name: s3;
    }
    .s4 {
      opacity: 0;
      animation: 13.7s linear infinite;
      animation-name: s4;
    }
    .s5 {
      opacity: 0;
      animation: 13.7s linear infinite;
      animation-name: s5;
    }
    .s6 {
      opacity: 0;
      animation: 13.7s linear infinite;
      animation-name: s6;
    } /* probe 1: 0.5s to 2.2s */ /* probe 2: 2.2s to 3.9s */ /* from 3.9s: probe 3 / budget used up */ /* from 6.5s: insert (uniform), jump arrow (elastic) */ /* from 9.1s: insert in next array (elastic); fades at 13.1s */ /* probe labels that stay: 0.5s onward */
    @keyframes s1 {
      0.00%, 3.65% { opacity: 0; }
      4.74%, 16.06% { opacity: 1; }
      17.15%, 100.00% { opacity: 0; }
    }
    @keyframes s2 {
      0.00%, 16.06% { opacity: 0; }
      17.15%, 28.47% { opacity: 1; }
      29.56%, 100.00% { opacity: 0; }
    }
    @keyframes s3 {
      0.00%, 28.47% { opacity: 0; }
      29.56%, 95.62% { opacity: 1; }
      97.81%, 100.00% { opacity: 0; }
    }
    @keyframes s4 {
      0.00%, 47.45% { opacity: 0; }
      48.54%, 95.62% { opacity: 1; }
      97.81%, 100.00% { opacity: 0; }
    }
    @keyframes s5 {
      0.00%, 66.42% { opacity: 0; }
      67.52%, 95.62% { opacity: 1; }
      97.81%, 100.00% { opacity: 0; }
    }
    @keyframes s6 {
      0.00%, 3.65% { opacity: 0; }
      4.74%, 95.62% { opacity: 1; }
      97.81%, 100.00% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .s1 {
        animation: none;
        opacity: 0;
      }
      .s2 {
        animation: none;
        opacity: 0;
      }
      .s3 {
        animation: none;
        opacity: 1;
      }
      .s4 {
        animation: none;
        opacity: 1;
      }
      .s5 {
        animation: none;
        opacity: 1;
      }
      .s6 {
        animation: none;
        opacity: 1;
      }
    }
    .title {
      font-weight: 700;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --muted: #aaa;
        --label-load: #ff9a64;
        --label-compute: #82df92;
      }
    }
    /* Typography adapted from ONS chart guidance:
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography
    20px headings, 16px subheadings, 14px labels at native display width.
    Variables compensate for the original graphics coordinate scale. */
    .type-heading {
      font-size: var(--type-heading);
    }
    .type-subheading {
      font-size: var(--type-subheading);
    }
    tspan[baseline-shift="sub"],
    tspan[baseline-shift="super"] {
      font-size: 0.7em;
    }

  </style>
  <g transform="scale(0.9473684210526315)">
    <text x="20" y="28" class="title type-heading">Uniform probing (greedy)</text>
    <text x="130" y="56" class="muted">crowded array A<tspan baseline-shift="sub">i</tspan></text>
    <rect x="130" y="66" width="44" height="44" rx="4" class="full" />
    <rect x="182" y="66" width="44" height="44" rx="4" class="full" />
    <rect x="234" y="66" width="44" height="44" rx="4" class="full" />
    <rect x="286" y="66" width="44" height="44" rx="4" class="full" />
    <rect x="338" y="66" width="44" height="44" rx="4" class="full" />
    <rect x="390" y="66" width="44" height="44" rx="4" class="empty" />
    <rect x="442" y="66" width="44" height="44" rx="4" class="full" />
    <rect x="494" y="66" width="44" height="44" rx="4" class="full" />
    <rect x="283" y="63" width="50" height="50" rx="6" class="ring s1" />
    <rect x="127" y="63" width="50" height="50" rx="6" class="ring s2" />
    <rect x="387" y="63" width="50" height="50" rx="6" class="ring s3" />
    <text x="308" y="130" text-anchor="middle" class="num s6">1 full</text>
    <text x="152" y="130" text-anchor="middle" class="num s2">2 full</text>
    <text x="152" y="130" text-anchor="middle" class="num s3">2 full</text>
    <text x="412" y="130" text-anchor="middle" class="num s3">3 empty</text>
    <rect x="396" y="72" width="32" height="32" rx="3" class="new s4" />
    <text x="560" y="93" class="oktext s4">insert at probe 3</text>
    <text x="20" y="178" class="title type-heading">Elastic, budget of 2 probes in A<tspan baseline-shift="sub">i</tspan></text>
    <text x="130" y="206" class="muted">crowded array A<tspan baseline-shift="sub">i</tspan></text>
    <rect x="130" y="216" width="44" height="44" rx="4" class="full" />
    <rect x="182" y="216" width="44" height="44" rx="4" class="full" />
    <rect x="234" y="216" width="44" height="44" rx="4" class="full" />
    <rect x="286" y="216" width="44" height="44" rx="4" class="full" />
    <rect x="338" y="216" width="44" height="44" rx="4" class="full" />
    <rect x="390" y="216" width="44" height="44" rx="4" class="empty" />
    <rect x="442" y="216" width="44" height="44" rx="4" class="full" />
    <rect x="494" y="216" width="44" height="44" rx="4" class="full" />
    <rect x="283" y="213" width="50" height="50" rx="6" class="ring s1" />
    <rect x="127" y="213" width="50" height="50" rx="6" class="ring s2" />
    <rect x="387" y="213" width="50" height="50" rx="6" class="skip s3" />
    <text x="308" y="280" text-anchor="middle" class="num s6">1 full</text>
    <text x="152" y="280" text-anchor="middle" class="num s2">2 full</text>
    <text x="152" y="280" text-anchor="middle" class="num s3">2 full</text>
    <text x="412" y="280" text-anchor="middle" class="muted s3">never tried</text>
    <text x="130" y="306" class="num s3">budget used up</text>
    <text x="590" y="206" class="muted">emptier array A<tspan baseline-shift="sub">i+1</tspan></text>
    <rect x="590" y="216" width="36" height="44" rx="4" class="full" />
    <rect x="632" y="216" width="36" height="44" rx="4" class="empty" />
    <rect x="674" y="216" width="36" height="44" rx="4" class="empty" />
    <rect x="716" y="216" width="36" height="44" rx="4" class="full" />
    <path d="M 544 238 L 578 238" class="arrow s4" />
    <polygon points="576,232 587,238 576,244" class="arrowhead s4" />
    <rect x="629" y="213" width="42" height="50" rx="6" class="ring s5" />
    <rect x="637" y="222" width="26" height="32" rx="3" class="new s5" />
    <text x="650" y="280" text-anchor="middle" class="oktext s5">insert</text>
  </g>
</svg>
