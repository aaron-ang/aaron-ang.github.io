<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated probe walk: uniform probing inserts into the first empty slot, Elastic stops after its probe budget and inserts into the next array">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --skip: #999; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --skip: #888; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .full { fill: var(--full); stroke: var(--edge); }
    .empty { fill: var(--empty); stroke: var(--edge); }
    .ring { fill: none; stroke: var(--probe); stroke-width: 3; }
    .num { fill: var(--probe); font-weight: 600; font-size: 13px; }
    .skip { fill: none; stroke: var(--skip); stroke-width: 2; stroke-dasharray: 5 4; }
    .new { fill: var(--ok); }
    .oktext { fill: var(--ok); font-weight: 600; font-size: 13px; }
    .arrow { fill: none; stroke: var(--probe); stroke-width: 2; }
    .arrowhead { fill: var(--probe); }

    /* 13.7s loop. Each class shows its element during one time window. */
    .s1, .s2, .s3, .s4, .s5, .s6 { opacity: 0; animation: 13.7s linear infinite; }
    .s1 { animation-name: s1; }  /* probe 1: 0.5s to 2.2s */
    .s2 { animation-name: s2; }  /* probe 2: 2.2s to 3.9s */
    .s3 { animation-name: s3; }  /* from 3.9s: probe 3 / budget used up */
    .s4 { animation-name: s4; }  /* from 6.5s: insert (uniform), jump arrow (elastic) */
    .s5 { animation-name: s5; }  /* from 9.1s: insert in next array (elastic); fades at 13.1s */
    .s6 { animation-name: s6; }  /* probe labels that stay: 0.5s onward */
    @keyframes s1 { 0.00%, 3.65% { opacity: 0 } 4.74%, 16.06% { opacity: 1 } 17.15%, 100.00% { opacity: 0 } }
    @keyframes s2 { 0.00%, 16.06% { opacity: 0 } 17.15%, 28.47% { opacity: 1 } 29.56%, 100.00% { opacity: 0 } }
    @keyframes s3 { 0.00%, 28.47% { opacity: 0 } 29.56%, 95.62% { opacity: 1 } 97.81%, 100.00% { opacity: 0 } }
    @keyframes s4 { 0.00%, 47.45% { opacity: 0 } 48.54%, 95.62% { opacity: 1 } 97.81%, 100.00% { opacity: 0 } }
    @keyframes s5 { 0.00%, 66.42% { opacity: 0 } 67.52%, 95.62% { opacity: 1 } 97.81%, 100.00% { opacity: 0 } }
    @keyframes s6 { 0.00%, 3.65% { opacity: 0 } 4.74%, 95.62% { opacity: 1 } 97.81%, 100.00% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .s1, .s2 { animation: none; opacity: 0; }
      .s3, .s4, .s5, .s6 { animation: none; opacity: 1; }
    }
  </style>

  <!-- ===== Uniform probing ===== -->
  <text x="20" y="28" class="title">Uniform probing (greedy)</text>
  <text x="130" y="56" class="muted">crowded array A<tspan baseline-shift="sub" font-size="9">i</tspan></text>
  <!-- 8 slots, slot 6 (index 5) empty. x = 130 + 52k -->
  <rect x="130" y="66" width="44" height="44" rx="4" class="full"/>
  <rect x="182" y="66" width="44" height="44" rx="4" class="full"/>
  <rect x="234" y="66" width="44" height="44" rx="4" class="full"/>
  <rect x="286" y="66" width="44" height="44" rx="4" class="full"/>
  <rect x="338" y="66" width="44" height="44" rx="4" class="full"/>
  <rect x="390" y="66" width="44" height="44" rx="4" class="empty"/>
  <rect x="442" y="66" width="44" height="44" rx="4" class="full"/>
  <rect x="494" y="66" width="44" height="44" rx="4" class="full"/>
  <!-- probe order: slot 4, slot 1, slot 6 -->
  <rect x="283" y="63" width="50" height="50" rx="6" class="ring s1"/>
  <rect x="127" y="63" width="50" height="50" rx="6" class="ring s2"/>
  <rect x="387" y="63" width="50" height="50" rx="6" class="ring s3"/>
  <text x="308" y="130" text-anchor="middle" class="num s6">1 full</text>
  <text x="152" y="130" text-anchor="middle" class="num s2">2 full</text>
  <text x="152" y="130" text-anchor="middle" class="num s3">2 full</text>
  <text x="412" y="130" text-anchor="middle" class="num s3">3 empty</text>
  <rect x="396" y="72" width="32" height="32" rx="3" class="new s4"/>
  <text x="560" y="93" class="oktext s4">insert at probe 3</text>

  <!-- ===== Elastic ===== -->
  <text x="20" y="178" class="title">Elastic, budget of 2 probes in A<tspan baseline-shift="sub" font-size="10">i</tspan></text>
  <text x="130" y="206" class="muted">crowded array A<tspan baseline-shift="sub" font-size="9">i</tspan></text>
  <rect x="130" y="216" width="44" height="44" rx="4" class="full"/>
  <rect x="182" y="216" width="44" height="44" rx="4" class="full"/>
  <rect x="234" y="216" width="44" height="44" rx="4" class="full"/>
  <rect x="286" y="216" width="44" height="44" rx="4" class="full"/>
  <rect x="338" y="216" width="44" height="44" rx="4" class="full"/>
  <rect x="390" y="216" width="44" height="44" rx="4" class="empty"/>
  <rect x="442" y="216" width="44" height="44" rx="4" class="full"/>
  <rect x="494" y="216" width="44" height="44" rx="4" class="full"/>
  <rect x="283" y="213" width="50" height="50" rx="6" class="ring s1"/>
  <rect x="127" y="213" width="50" height="50" rx="6" class="ring s2"/>
  <rect x="387" y="213" width="50" height="50" rx="6" class="skip s3"/>
  <text x="308" y="280" text-anchor="middle" class="num s6">1 full</text>
  <text x="152" y="280" text-anchor="middle" class="num s2">2 full</text>
  <text x="152" y="280" text-anchor="middle" class="num s3">2 full</text>
  <text x="412" y="280" text-anchor="middle" class="muted s3">never tried</text>
  <text x="130" y="306" class="num s3">budget used up</text>

  <!-- next, emptier array A_{i+1}: 4 slots -->
  <text x="590" y="206" class="muted">emptier array A<tspan baseline-shift="sub" font-size="9">i+1</tspan></text>
  <rect x="590" y="216" width="36" height="44" rx="4" class="full"/>
  <rect x="632" y="216" width="36" height="44" rx="4" class="empty"/>
  <rect x="674" y="216" width="36" height="44" rx="4" class="empty"/>
  <rect x="716" y="216" width="36" height="44" rx="4" class="full"/>
  <path d="M 544 238 L 578 238" class="arrow s4"/>
  <polygon points="576,232 587,238 576,244" class="arrowhead s4"/>
  <rect x="629" y="213" width="42" height="50" rx="6" class="ring s5"/>
  <rect x="637" y="222" width="26" height="32" rx="3" class="new s5"/>
  <text x="650" y="280" text-anchor="middle" class="oktext s5">insert</text>
</svg>
