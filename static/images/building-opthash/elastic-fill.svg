<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated Elastic fill: the largest array fills to 75 percent, then each batch tops up one array and fills the next, smaller one to 75 percent">
  <style>
    :root { --fg: #222; --muted: #777; --bar: #f1f1f1; --edge: #999; --fill: #4c8bf5; --hl: #d9480f; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --bar: #262626; --edge: #666; --fill: #5c9cff; --hl: #ff8a4c; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .status { font-weight: 600; font-size: 15px; }
    .bar { fill: var(--bar); stroke: var(--edge); }
    .fill { fill: var(--fill); transform-box: fill-box; transform-origin: left center; animation: 12s linear infinite; }
    .tick { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 3; }
    .hl { fill: none; stroke: var(--hl); stroke-width: 3; opacity: 0; animation: 12s linear infinite; }
    .b { opacity: 0; animation: 12s linear infinite; }

    /* Final state, used when motion is reduced. */
    .f1, .f2, .f3 { transform: scaleX(0.94); }
    .f4 { transform: scaleX(0.75); }

    /* Timeline: batch 0 0-2s, batch 1 2-5s, batch 2 5-7.5s, batch 3 7.5-9.5s, hold, reset. */
    .f1 { animation-name: f1; } .f2 { animation-name: f2; } .f3 { animation-name: f3; } .f4 { animation-name: f4; }
    @keyframes f1 { 0% { transform: scaleX(0) } 16.7% { transform: scaleX(0.75) } 41.7%, 94% { transform: scaleX(0.94) } 98%, 100% { transform: scaleX(0) } }
    @keyframes f2 { 0%, 16.7% { transform: scaleX(0) } 41.7% { transform: scaleX(0.75) } 62.5%, 94% { transform: scaleX(0.94) } 98%, 100% { transform: scaleX(0) } }
    @keyframes f3 { 0%, 41.7% { transform: scaleX(0) } 62.5% { transform: scaleX(0.75) } 79.2%, 94% { transform: scaleX(0.94) } 98%, 100% { transform: scaleX(0) } }
    @keyframes f4 { 0%, 62.5% { transform: scaleX(0) } 79.2%, 94% { transform: scaleX(0.75) } 98%, 100% { transform: scaleX(0) } }

    .h1 { animation-name: h1; } .h2 { animation-name: h2; } .h3 { animation-name: h3; } .h4 { animation-name: h4; }
    @keyframes h1 { 0%, 41% { opacity: 1 } 42%, 100% { opacity: 0 } }
    @keyframes h2 { 0%, 16% { opacity: 0 } 17%, 62% { opacity: 1 } 63%, 100% { opacity: 0 } }
    @keyframes h3 { 0%, 41% { opacity: 0 } 42%, 79% { opacity: 1 } 80%, 100% { opacity: 0 } }
    @keyframes h4 { 0%, 62% { opacity: 0 } 63%, 79% { opacity: 1 } 80%, 100% { opacity: 0 } }

    .b0 { animation-name: b0; } .b1 { animation-name: b1; } .b2 { animation-name: b2; } .b3 { animation-name: b3; } .b4 { animation-name: b4; }
    @keyframes b0 { 0%, 16% { opacity: 1 } 17%, 100% { opacity: 0 } }
    @keyframes b1 { 0%, 16% { opacity: 0 } 17%, 41% { opacity: 1 } 42%, 100% { opacity: 0 } }
    @keyframes b2 { 0%, 41% { opacity: 0 } 42%, 62% { opacity: 1 } 63%, 100% { opacity: 0 } }
    @keyframes b3 { 0%, 62% { opacity: 0 } 63%, 79% { opacity: 1 } 80%, 100% { opacity: 0 } }
    @keyframes b4 { 0%, 79% { opacity: 0 } 80%, 94% { opacity: 1 } 97%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .fill, .hl, .b { animation: none; }
      .b4 { opacity: 1; }
    }
  </style>

  <!-- status line, one per batch -->
  <text x="20" y="30" class="status b b0">Batch 0: fill A<tspan baseline-shift="sub" font-size="10">1</tspan> to 75%</text>
  <text x="20" y="30" class="status b b1">Batch 1: top up A<tspan baseline-shift="sub" font-size="10">1</tspan>, fill A<tspan baseline-shift="sub" font-size="10">2</tspan> to 75%</text>
  <text x="20" y="30" class="status b b2">Batch 2: top up A<tspan baseline-shift="sub" font-size="10">2</tspan>, fill A<tspan baseline-shift="sub" font-size="10">3</tspan> to 75%</text>
  <text x="20" y="30" class="status b b3">Batch 3: top up A<tspan baseline-shift="sub" font-size="10">3</tspan>, fill A<tspan baseline-shift="sub" font-size="10">4</tspan> to 75%</text>
  <text x="20" y="30" class="status b b4">…and so on: each batch works on two neighboring arrays</text>

  <text x="430" y="62" class="muted" text-anchor="middle">75%</text>

  <!-- A1: width 480 -->
  <text x="20" y="89">A<tspan baseline-shift="sub" font-size="10">1</tspan></text>
  <rect x="70" y="70" width="480" height="28" rx="3" class="bar"/>
  <rect x="70" y="70" width="480" height="28" rx="3" class="fill f1"/>
  <line x1="430" y1="66" x2="430" y2="102" class="tick"/>
  <rect x="67" y="67" width="486" height="34" rx="5" class="hl h1"/>

  <!-- A2: width 240 -->
  <text x="20" y="139">A<tspan baseline-shift="sub" font-size="10">2</tspan></text>
  <rect x="70" y="120" width="240" height="28" rx="3" class="bar"/>
  <rect x="70" y="120" width="240" height="28" rx="3" class="fill f2"/>
  <line x1="250" y1="116" x2="250" y2="152" class="tick"/>
  <rect x="67" y="117" width="246" height="34" rx="5" class="hl h2"/>

  <!-- A3: width 120 -->
  <text x="20" y="189">A<tspan baseline-shift="sub" font-size="10">3</tspan></text>
  <rect x="70" y="170" width="120" height="28" rx="3" class="bar"/>
  <rect x="70" y="170" width="120" height="28" rx="3" class="fill f3"/>
  <line x1="160" y1="166" x2="160" y2="202" class="tick"/>
  <rect x="67" y="167" width="126" height="34" rx="5" class="hl h3"/>

  <!-- A4: width 60 -->
  <text x="20" y="239">A<tspan baseline-shift="sub" font-size="10">4</tspan></text>
  <rect x="70" y="220" width="60" height="28" rx="3" class="bar"/>
  <rect x="70" y="220" width="60" height="28" rx="3" class="fill f4"/>
  <line x1="115" y1="216" x2="115" y2="252" class="tick"/>
  <rect x="67" y="217" width="66" height="34" rx="5" class="hl h4"/>

  <text x="600" y="139" class="muted" text-anchor="end">each array is</text>
  <text x="600" y="156" class="muted" text-anchor="end">half the last</text>
</svg>
