<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 260"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
  role="img"
  aria-label="Animated Elastic fill: the largest array fills to 75 percent, then each batch tops up one array to nearly full and fills the next, smaller one to 75 percent"
  width="640"
  height="260"
  data-diagram-width="640"
>
  <style>
    :root {
      --fg: #222;
      --bar: #f1f1f1;
      --edge: #999;
      --fill: #4c8bf5;
      --hl: #d9480f;
      --muted: #707071;
      --type-heading: 20px;
      --type-subheading: 16px;
      --type-label: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --bar: #262626;
        --edge: #666;
        --fill: #5c9cff;
        --hl: #ff8a4c;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .muted {
      fill: var(--muted);
    }
    .status {
      font-weight: 600;
    }
    .bar {
      fill: var(--bar);
      stroke: var(--edge);
    }
    .fill {
      fill: var(--fill);
      transform-box: fill-box;
      transform-origin: left center;
      animation: 19s linear infinite;
    }
    .tick {
      stroke: var(--muted);
      stroke-width: 1.5;
      stroke-dasharray: 3 3;
    }
    .tick2 {
      stroke: var(--hl);
      stroke-width: 1.5;
      stroke-dasharray: 6 3;
    }
    .hlt {
      fill: var(--hl);
    }
    .hl {
      fill: none;
      stroke: var(--hl);
      stroke-width: 3;
      opacity: 0;
      animation: 19s linear infinite;
    }
    .b {
      opacity: 0;
      animation: 19s linear infinite;
      font-weight: 600;
    }

    /* Final state, used when motion is reduced. */
    .f1 {
      transform: scaleX(0.94);
      animation-name: f1;
    }
    .f2 {
      transform: scaleX(0.94);
      animation-name: f2;
    }
    .f3 {
      transform: scaleX(0.94);
      animation-name: f3;
    }
    .f4 {
      transform: scaleX(0.75);
      animation-name: f4;
    }

    /* 19s timeline: batch 0 0-2.5s, batch 1 2.5-6.5s, batch 2 6.5-9.5s, batch 3 9.5-12.5s, final hold to 18.3s, reset. */
    @keyframes f1 {
      0% { transform: scaleX(0); }
      13.16% { transform: scaleX(0.75); }
      34.21%, 96.32% { transform: scaleX(0.94); }
      98.95%, 100% { transform: scaleX(0); }
    }
    @keyframes f2 {
      0%, 13.16% { transform: scaleX(0); }
      34.21% { transform: scaleX(0.75); }
      50%, 96.32% { transform: scaleX(0.94); }
      98.95%, 100% { transform: scaleX(0); }
    }
    @keyframes f3 {
      0%, 34.21% { transform: scaleX(0); }
      50% { transform: scaleX(0.75); }
      65.79%, 96.32% { transform: scaleX(0.94); }
      98.95%, 100% { transform: scaleX(0); }
    }
    @keyframes f4 {
      0%, 50% { transform: scaleX(0); }
      65.79%, 96.32% { transform: scaleX(0.75); }
      98.95%, 100% { transform: scaleX(0); }
    }

    .h1 {
      animation-name: h1;
    }
    .h2 {
      animation-name: h2;
    }
    .h3 {
      animation-name: h3;
    }
    .h4 {
      animation-name: h4;
    }
    @keyframes h1 {
      0% { opacity: 0; }
      0.79%, 34.21% { opacity: 1; }
      35%, 100% { opacity: 0; }
    }
    @keyframes h2 {
      0%, 13.16% { opacity: 0; }
      13.95%, 50% { opacity: 1; }
      50.79%, 100% { opacity: 0; }
    }
    @keyframes h3 {
      0%, 34.21% { opacity: 0; }
      35%, 65.79% { opacity: 1; }
      66.58%, 100% { opacity: 0; }
    }
    @keyframes h4 {
      0%, 50% { opacity: 0; }
      50.79%, 65.79% { opacity: 1; }
      66.58%, 100% { opacity: 0; }
    }

    .b0 {
      animation-name: b0;
    }
    .b1 {
      animation-name: b1;
    }
    .b2 {
      animation-name: b2;
    }
    .b3 {
      animation-name: b3;
    }
    .b4 {
      animation-name: b4;
    }
    @keyframes b0 {
      0% { opacity: 0; }
      0.79%, 13.16% { opacity: 1; }
      13.95%, 100% { opacity: 0; }
    }
    @keyframes b1 {
      0%, 13.16% { opacity: 0; }
      13.95%, 34.21% { opacity: 1; }
      35%, 100% { opacity: 0; }
    }
    @keyframes b2 {
      0%, 34.21% { opacity: 0; }
      35%, 50% { opacity: 1; }
      50.79%, 100% { opacity: 0; }
    }
    @keyframes b3 {
      0%, 50% { opacity: 0; }
      50.79%, 65.79% { opacity: 1; }
      66.58%, 100% { opacity: 0; }
    }
    @keyframes b4 {
      0%, 65.79% { opacity: 0; }
      66.58%, 96.32% { opacity: 1; }
      97.89%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fill {
        animation: none;
      }
      .hl {
        animation: none;
      }
      .b {
        animation: none;
      }
      .b4 {
        opacity: 1;
      }
    }
    .mvar {
      font-family: "Times New Roman", Times, "STIX Two Text", serif;
      font-style: italic;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --muted: #aaa;
      }
    }
    /* Typography adapted from ONS chart guidance:
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography
    20px headings, 16px subheadings, 14px labels at native display width.
    Variables compensate for the original graphics coordinate scale. */
    .type-heading {
      font-size: var(--type-heading);
    }
    .type-subheading {
      font-size: var(--type-subheading);
    }
    tspan[baseline-shift="sub"],
    tspan[baseline-shift="super"] {
      font-size: 0.7em;
    }

  </style>
  <g transform="scale(1.0)">
    <text x="20" y="30" class="status b b0 type-subheading">Batch 0: fill <tspan class="mvar">A</tspan><tspan baseline-shift="sub">1</tspan> to 75%</text>
    <text x="20" y="30" class="status b b1 type-subheading">Batch 1: top up <tspan class="mvar">A</tspan><tspan baseline-shift="sub">1</tspan> to nearly full, fill <tspan class="mvar">A</tspan><tspan baseline-shift="sub">2</tspan> to 75%</text>
    <text x="20" y="30" class="status b b2 type-subheading">Batch 2: top up <tspan class="mvar">A</tspan><tspan baseline-shift="sub">2</tspan> to nearly full, fill <tspan class="mvar">A</tspan><tspan baseline-shift="sub">3</tspan> to 75%</text>
    <text x="20" y="30" class="status b b3 type-subheading">Batch 3: top up <tspan class="mvar">A</tspan><tspan baseline-shift="sub">3</tspan> to nearly full, fill <tspan class="mvar">A</tspan><tspan baseline-shift="sub">4</tspan> to 75%</text>
    <text x="20" y="30" class="status b b4 type-subheading">…and so on: each batch works on two neighboring arrays</text>
    <text x="430" y="62" class="muted" text-anchor="middle">75%</text>
    <text x="521" y="62" class="hlt" text-anchor="middle">nearly full</text>
    <text x="20" y="89"><tspan class="mvar">A</tspan><tspan baseline-shift="sub">1</tspan></text>
    <rect x="70" y="70" width="480" height="28" rx="3" class="bar" />
    <rect x="70" y="70" width="480" height="28" rx="3" class="fill f1" />
    <line x1="430" y1="66" x2="430" y2="102" class="tick" />
    <line x1="521" y1="66" x2="521" y2="102" class="tick2" />
    <rect x="67" y="67" width="486" height="34" rx="5" class="hl h1" />
    <text x="20" y="139"><tspan class="mvar">A</tspan><tspan baseline-shift="sub">2</tspan></text>
    <rect x="70" y="120" width="240" height="28" rx="3" class="bar" />
    <rect x="70" y="120" width="240" height="28" rx="3" class="fill f2" />
    <line x1="250" y1="116" x2="250" y2="152" class="tick" />
    <line x1="296" y1="116" x2="296" y2="152" class="tick2" />
    <rect x="67" y="117" width="246" height="34" rx="5" class="hl h2" />
    <text x="20" y="189"><tspan class="mvar">A</tspan><tspan baseline-shift="sub">3</tspan></text>
    <rect x="70" y="170" width="120" height="28" rx="3" class="bar" />
    <rect x="70" y="170" width="120" height="28" rx="3" class="fill f3" />
    <line x1="160" y1="166" x2="160" y2="202" class="tick" />
    <line x1="183" y1="166" x2="183" y2="202" class="tick2" />
    <rect x="67" y="167" width="126" height="34" rx="5" class="hl h3" />
    <text x="20" y="239"><tspan class="mvar">A</tspan><tspan baseline-shift="sub">4</tspan></text>
    <rect x="70" y="220" width="60" height="28" rx="3" class="bar" />
    <rect x="70" y="220" width="60" height="28" rx="3" class="fill f4" />
    <line x1="115" y1="216" x2="115" y2="252" class="tick" />
    <line x1="126" y1="216" x2="126" y2="252" class="tick2" />
    <rect x="67" y="217" width="66" height="34" rx="5" class="hl h4" />
    <text x="600" y="139" class="muted" text-anchor="end">each array is</text>
    <text x="600" y="156" class="muted" text-anchor="end">half the last</text>
  </g>
</svg>
