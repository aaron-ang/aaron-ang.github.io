<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 389"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
  role="img"
  aria-label="Animated Spark on YARN in cluster mode: spark-submit submits the application, the ApplicationsManager launches the ApplicationMaster which also runs the Spark Driver, the Scheduler grants containers, the ApplicationMaster has NodeManagers start Spark Executors in them, and the driver sends tasks to the executors, while NodeManagers report node status to the ResourceManager."
  width="720"
  height="389"
  data-diagram-width="720"
>
  <style>
    :root {
      --fg: #222;
      --empty: #ffffff;
      --edge: #999;
      --probe: #d9480f;
      --ok: #2b8a3e;
      --chip: #f4f4f4;
      --accent: #1971c2;
      --muted: #707071;
      --type-heading: 21.111109px;
      --type-subheading: 16.88888743px;
      --type-label: 14.77777651px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --empty: #1e1e1e;
        --edge: #777;
        --probe: #ff8a4c;
        --ok: #69db7c;
        --chip: #2a2a2a;
        --accent: #74c0fc;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .muted {
      fill: var(--muted);
    }
    .box {
      fill: none;
      stroke: var(--edge);
      stroke-width: 1.5;
    }
    .chip {
      fill: var(--chip);
      stroke: var(--edge);
    }
    .note {
      fill: none;
      stroke-dasharray: 3 3;
      stroke: var(--accent);
    }
    .cont {
      fill: var(--empty);
      stroke: var(--edge);
    }
    .task {
      fill: var(--ok);
    }
    .tasktext {
      fill: var(--empty);
      font-weight: 600;
    }
    .k {
      fill: var(--probe);
      font-weight: 700;
    }
    .cur path {
      fill: none;
      stroke: var(--probe);
      stroke-width: 2.5;
    }
    .cur polygon {
      fill: var(--probe);
    }
    .done path {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.5;
    }
    .done polygon {
      fill: var(--muted);
    }
    .dash path {
      stroke-dasharray: 5 4;
    }
    .acctext {
      fill: var(--accent);
      font-weight: 600;
    }
    .acccont {
      fill: var(--empty);
      stroke: var(--accent);
      stroke-width: 2;
    }
    .accline path {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.5;
    }
    .accline polygon {
      fill: var(--accent);
    }

    /* 34.42s loop; steps at 0.72, 4.12, 9.42, 13.02, 16.62, 21.92, 27.72 s (variable holds); all fade out 33.22s to 33.72s. */
    .a {
      opacity: 0;
      animation: 34.42s linear infinite;
    }
    .n1 {
      animation-name: n1;
    } /* narration 1: 0.72s to 4.12s */
    @keyframes n1 {
      0.00%, 2.09% { opacity: 0; }
      2.53%, 11.97% { opacity: 1; }
      12.41%, 100.00% { opacity: 0; }
    }
    .n2 {
      animation-name: n2;
    } /* narration 2: 4.12s to 9.42s */
    @keyframes n2 {
      0.00%, 11.97% { opacity: 0; }
      12.41%, 27.36% { opacity: 1; }
      27.81%, 100.00% { opacity: 0; }
    }
