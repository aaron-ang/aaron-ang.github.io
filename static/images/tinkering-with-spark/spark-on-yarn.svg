    <text x="618" y="68" class="acctext" xml:space="preserve">Same as YARN,</text>
    <text x="618" y="83" class="acctext" xml:space="preserve">except …</text>
    <text x="618" y="98" class="muted" xml:space="preserve">• the AM also runs</text>
    <text x="618" y="113" class="muted" xml:space="preserve">  the Spark Driver</text>
    <text x="618" y="128" class="muted" xml:space="preserve">• containers host</text>
    <text x="618" y="143" class="muted" xml:space="preserve">  Spark Executors</text>
    <text x="618" y="158" class="muted" xml:space="preserve">• executors run</text>
    <text x="618" y="173" class="muted" xml:space="preserve">  driver’s tasks</text>
    <rect x="20" y="262" width="230" height="136" rx="8" class="box" />
    <text x="32" y="280" class="title type-subheading">NodeManager</text>
    <rect x="265" y="262" width="230" height="136" rx="8" class="box" />
    <text x="277" y="280" class="title type-subheading">NodeManager</text>
    <rect x="510" y="262" width="230" height="136" rx="8" class="box" />
    <text x="522" y="280" class="title type-subheading">NodeManager</text>
    <text x="20" y="28" class="a n1 narr">1. spark-submit submits the application to the ApplicationsManager.</text>
    <text x="20" y="28" class="a n2 narr">2. The ApplicationsManager launches the ApplicationMaster, which also runs the Spark Driver.</text>
    <text x="20" y="28" class="a n3 narr">3. The ApplicationMaster asks the Scheduler for executor containers.</text>
    <text x="20" y="28" class="a n4 narr">4. The Scheduler grants containers on NodeManagers.</text>
    <text x="20" y="28" class="a n5 narr">5. The ApplicationMaster has each NodeManager start a Spark Executor in its container.</text>
    <text x="20" y="28" class="a n6 narr">6. The driver sends tasks to the executors, and they report back.</text>
    <text x="20" y="28" class="a n7 narr fin">NodeManagers report node status to the ResourceManager throughout.</text>
