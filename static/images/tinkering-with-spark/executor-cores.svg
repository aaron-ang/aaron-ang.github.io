<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated comparison of --executor-cores 1 and --executor-cores 4: the same 8 tasks run one at a time in 8 waves on a single-core executor, but four at a time in 2 waves on a four-core executor whose 16 GiB heap is shared by the concurrent tasks">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --chip: #f4f4f4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --chip: #2a2a2a; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .status { font-size: 13px; }
    .oktext { fill: var(--ok); font-weight: 600; font-size: 13px; }
    .empty { fill: var(--empty); stroke: var(--edge); }
    .exec { fill: var(--chip); stroke: var(--edge); }
    .slotbg { fill: none; stroke: var(--edge); stroke-dasharray: 3 3; }
    .mem { fill: var(--full); stroke: var(--edge); }
    .memt { font-size: 12px; }
    .div { stroke: var(--fg); stroke-width: 1.5; stroke-dasharray: 3 2; }
    .sep { stroke: var(--edge); stroke-dasharray: 4 4; }
    .q { fill: var(--full); stroke: var(--edge); }
    .qt { text-anchor: middle; font-size: 12px; }
    .run { fill: var(--empty); stroke: var(--probe); stroke-width: 3; }
    .runt { text-anchor: middle; fill: var(--probe); font-weight: 600; font-size: 12px; }
    .done { fill: var(--ok); }
    .donet { text-anchor: middle; fill: var(--empty); font-weight: 600; font-size: 12px; }
    .cur { fill: var(--probe); }
    .el { fill: var(--edge); }

    /* 23.8s loop, both rows on one shared clock (side-by-side comparison, so they advance together).
       Wave k starts at 3.0 + 1.8(k-1) s and lasts 1.8 s (equal waves: duration is the point). Top row done at 17.4 s.
       Bottom row: waves 1-2, done at 6.6 s. Final frame holds to 22.4s, fades out to 23.0s, restart. */
    .w { opacity: 0; animation: 23.8s linear infinite; }
    .a1 { animation-name: a1; }  /* 0.00s to 3.00s */
    .a2 { animation-name: a2; }  /* 2.92s to 4.80s */
    .a3 { animation-name: a3; }  /* 4.72s onward */
    .a4 { animation-name: a4; }  /* 0.00s to 4.80s */
    .a5 { animation-name: a5; }  /* 4.72s to 6.60s */
    .a6 { animation-name: a6; }  /* 6.52s onward */
    .a7 { animation-name: a7; }  /* 0.00s to 6.60s */
    .a8 { animation-name: a8; }  /* 6.52s to 8.40s */
    .a9 { animation-name: a9; }  /* 8.32s onward */
    .a10 { animation-name: a10; }  /* 0.00s to 8.40s */
    .a11 { animation-name: a11; }  /* 8.32s to 10.20s */
    .a12 { animation-name: a12; }  /* 10.12s onward */
    .a13 { animation-name: a13; }  /* 0.00s to 10.20s */
    .a14 { animation-name: a14; }  /* 10.12s to 12.00s */
    .a15 { animation-name: a15; }  /* 11.92s onward */
    .a16 { animation-name: a16; }  /* 0.00s to 12.00s */
    .a17 { animation-name: a17; }  /* 11.92s to 13.80s */
    .a18 { animation-name: a18; }  /* 13.72s onward */
    .a19 { animation-name: a19; }  /* 0.00s to 13.80s */
    .a20 { animation-name: a20; }  /* 13.72s to 15.60s */
    .a21 { animation-name: a21; }  /* 15.52s onward */
    .a22 { animation-name: a22; }  /* 0.00s to 15.60s */
    .a23 { animation-name: a23; }  /* 15.52s to 17.40s */
    .a24 { animation-name: a24; }  /* 17.32s onward */
    .a25 { animation-name: a25; }  /* 6.52s to 8.40s */
    .a26 { animation-name: a26; }  /* 8.32s to 10.20s */
    .a27 { animation-name: a27; }  /* 10.12s to 12.00s */
    .a28 { animation-name: a28; }  /* 11.92s to 13.80s */
