<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated comparison of --executor-cores 1 and --executor-cores 4: the same 8 tasks run one at a time in 8 waves on a single-core executor, but four at a time in 2 waves on a four-core executor whose 16 GiB heap is shared by the concurrent tasks">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --chip: #f4f4f4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --chip: #2a2a2a; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .status { font-size: 13px; }
    .oktext { fill: var(--ok); font-weight: 600; font-size: 13px; }
    .empty { fill: var(--empty); stroke: var(--edge); }
    .exec { fill: var(--chip); stroke: var(--edge); }
    .slotbg { fill: none; stroke: var(--edge); stroke-dasharray: 3 3; }
    .mem { fill: var(--full); stroke: var(--edge); }
    .memt { font-size: 12px; }
    .div { stroke: var(--fg); stroke-width: 1.5; stroke-dasharray: 3 2; }
    .sep { stroke: var(--edge); stroke-dasharray: 4 4; }
    .q { fill: var(--full); stroke: var(--edge); }
    .qt { text-anchor: middle; font-size: 12px; }
    .run { fill: var(--empty); stroke: var(--probe); stroke-width: 3; }
    .runt { text-anchor: middle; fill: var(--probe); font-weight: 600; font-size: 12px; }
    .done { fill: var(--ok); }
    .donet { text-anchor: middle; fill: var(--empty); font-weight: 600; font-size: 12px; }
    .cur { fill: var(--probe); }
    .el { fill: var(--edge); }

    /* 16s loop, both rows on one shared clock. Wave k runs from 0.8 + 1.4(k-1) s for 1.4 s.
       Top row: waves 1-8 (0.8s to 12.0s). Bottom row: waves 1-2 (0.8s to 3.6s), then idle.
       Hold final frame until 92%, fade out 92% to 96%, restart. */
    .w { opacity: 0; animation: 19.7s linear infinite; }
    .a1 { animation-name: a1; }  /* 0s to 0.8s */
    .a2 { animation-name: a2; }  /* 0.8s to 2.2s */
    .a3 { animation-name: a3; }  /* 2.2s to end */
    .a4 { animation-name: a4; }  /* 0s to 2.2s */
    .a5 { animation-name: a5; }  /* 2.2s to 3.6s */
    .a6 { animation-name: a6; }  /* 3.6s to end */
    .a7 { animation-name: a7; }  /* 0s to 3.6s */
    .a8 { animation-name: a8; }  /* 3.6s to 5.0s */
    .a9 { animation-name: a9; }  /* 5.0s to end */
    .a10 { animation-name: a10; }  /* 0s to 5.0s */
    .a11 { animation-name: a11; }  /* 5.0s to 6.4s */
    .a12 { animation-name: a12; }  /* 6.4s to end */
    .a13 { animation-name: a13; }  /* 0s to 6.4s */
    .a14 { animation-name: a14; }  /* 6.4s to 7.8s */
    .a15 { animation-name: a15; }  /* 7.8s to end */
    .a16 { animation-name: a16; }  /* 0s to 7.8s */
    .a17 { animation-name: a17; }  /* 7.8s to 9.2s */
    .a18 { animation-name: a18; }  /* 9.2s to end */
    .a19 { animation-name: a19; }  /* 0s to 9.2s */
    .a20 { animation-name: a20; }  /* 9.2s to 10.6s */
    .a21 { animation-name: a21; }  /* 10.6s to end */
    .a22 { animation-name: a22; }  /* 0s to 10.6s */
    .a23 { animation-name: a23; }  /* 10.6s to 12.0s */
    .a24 { animation-name: a24; }  /* 12.0s to end */
    .a25 { animation-name: a25; }  /* 3.6s to 5.0s */
    .a26 { animation-name: a26; }  /* 5.0s to 6.4s */
    .a27 { animation-name: a27; }  /* 6.4s to 7.8s */
    .a28 { animation-name: a28; }  /* 7.8s to 9.2s */
