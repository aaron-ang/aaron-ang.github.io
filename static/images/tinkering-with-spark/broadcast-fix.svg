  <g class="w w29 fin"><path d="M 298 295 L 162.5 342.0" class="okarrow"/><polygon points="161.8,337.0 154,345 165.1,346.4" class="okhead"/></g>
  <rect x="322" y="287" width="16" height="16" rx="2" class="new mv m30"/>
