  <rect x="353.50" y="282" width="18.75" height="22" class="seg w w17 fin"/>
  <rect x="372.25" y="282" width="18.75" height="22" class="seg w w18 fin"/>
  <text x="535" y="288" class="w w19 fin">collected data fits in memory</text>
