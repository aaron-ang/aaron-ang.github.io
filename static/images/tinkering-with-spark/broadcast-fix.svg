<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated broadcast join with 16 GiB of driver memory: collection finishes, and the driver broadcasts the table to every executor.">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --chip: #f4f4f4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --chip: #2a2a2a; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .label { font-weight: 600; }
    .box { fill: var(--chip); stroke: var(--edge); }
    .empty { fill: var(--empty); stroke: var(--edge); }
    .chunk, .seg { fill: var(--full); stroke: var(--edge); }
    .over { fill: var(--probe); stroke: var(--probe); }
    .limit { fill: none; stroke: var(--fg); stroke-width: 1.5; }
    .limitline { stroke: var(--fg); stroke-width: 2; }
    .new { fill: var(--ok); }
    .num { fill: var(--probe); font-weight: 600; font-size: 12px; }
    .bad { fill: var(--probe); font-weight: 600; font-size: 15px; }
    .oktext { fill: var(--ok); font-weight: 600; }
    .garrow { fill: none; stroke: var(--edge); stroke-width: 1.5; }
    .ghead { fill: var(--edge); }
    .okarrow { fill: none; stroke: var(--ok); stroke-width: 2; }
    .okhead { fill: var(--ok); }

    /* 16.5s loop. Steps: chunks land 1.1, 2.7, 4.3, 5.9s (+ fits text); broadcast 8.2s (copies land 9.05s); done text 10.6s; hold to 15.2s, fade out to 15.8s, reset by loop end. */
    .w { opacity: 0; animation: 16.5s linear infinite; }
    .mv { animation: 16.5s linear infinite; }
    .w10 { animation-name: w10; }  /* B collect arrows: 0s to 8.2s, back in from 15.8s */
    @keyframes w10 { 0.00%, 49.70% { opacity: 1 } 50.61%, 95.76% { opacity: 0 } 100.00% { opacity: 1 } }
    .m11 { animation-name: m11; }  /* B chunk 1: 0.5s to 1.1s */
    @keyframes m11 { 0.00% { opacity: 1; transform: translate(0px, 0px) } 3.03% { opacity: 1; transform: translate(0px, 0px) } 6.67% { opacity: 1; transform: translate(194px, 46px) } 7.03% { opacity: 0; transform: translate(194px, 46px) } 95.76% { opacity: 0; transform: translate(194px, 46px) } 95.79% { opacity: 0; transform: translate(0px, 0px) } 100.00% { opacity: 1; transform: translate(0px, 0px) } }
    .m12 { animation-name: m12; }  /* B chunk 2: 2.1s to 2.7s */
    @keyframes m12 { 0.00% { opacity: 1; transform: translate(0px, 0px) } 12.73% { opacity: 1; transform: translate(0px, 0px) } 16.36% { opacity: 1; transform: translate(194px, 14px) } 16.73% { opacity: 0; transform: translate(194px, 14px) } 95.76% { opacity: 0; transform: translate(194px, 14px) } 95.79% { opacity: 0; transform: translate(0px, 0px) } 100.00% { opacity: 1; transform: translate(0px, 0px) } }
    .m13 { animation-name: m13; }  /* B chunk 3: 3.7s to 4.3s */
    @keyframes m13 { 0.00% { opacity: 1; transform: translate(0px, 0px) } 22.42% { opacity: 1; transform: translate(0px, 0px) } 26.06% { opacity: 1; transform: translate(194px, -18px) } 26.42% { opacity: 0; transform: translate(194px, -18px) } 95.76% { opacity: 0; transform: translate(194px, -18px) } 95.79% { opacity: 0; transform: translate(0px, 0px) } 100.00% { opacity: 1; transform: translate(0px, 0px) } }
    .m14 { animation-name: m14; }  /* B chunk 4: 5.3s to 5.9s */
    @keyframes m14 { 0.00% { opacity: 1; transform: translate(0px, 0px) } 32.12% { opacity: 1; transform: translate(0px, 0px) } 35.76% { opacity: 1; transform: translate(194px, -50px) } 36.12% { opacity: 0; transform: translate(194px, -50px) } 95.76% { opacity: 0; transform: translate(194px, -50px) } 95.79% { opacity: 0; transform: translate(0px, 0px) } 100.00% { opacity: 1; transform: translate(0px, 0px) } }
    .w15 { animation-name: w15; }  /* B bar segment 1: 1.1s to 15.2s */
    @keyframes w15 { 0.00%, 6.36% { opacity: 0 } 6.67%, 92.12% { opacity: 1 } 95.76%, 100.00% { opacity: 0 } }
    .w16 { animation-name: w16; }  /* B bar segment 2: 2.7s to 15.2s */
    @keyframes w16 { 0.00%, 16.06% { opacity: 0 } 16.36%, 92.12% { opacity: 1 } 95.76%, 100.00% { opacity: 0 } }
    .w17 { animation-name: w17; }  /* B bar segment 3: 4.3s to 15.2s */
    @keyframes w17 { 0.00%, 25.76% { opacity: 0 } 26.06%, 92.12% { opacity: 1 } 95.76%, 100.00% { opacity: 0 } }
    .w18 { animation-name: w18; }  /* B bar segment 4: 5.9s to 15.2s */
    @keyframes w18 { 0.00%, 35.45% { opacity: 0 } 35.76%, 92.12% { opacity: 1 } 95.76%, 100.00% { opacity: 0 } }
    .w19 { animation-name: w19; }  /* B collected text: 5.9s to 15.2s */
    @keyframes w19 { 0.00%, 35.76% { opacity: 0 } 36.67%, 92.12% { opacity: 1 } 95.76%, 100.00% { opacity: 0 } }
    .w20 { animation-name: w20; }  /* B broadcast arrow: 8.2s to 15.2s */
    @keyframes w20 { 0.00%, 50.00% { opacity: 0 } 50.91%, 92.12% { opacity: 1 } 95.76%, 100.00% { opacity: 0 } }
    .m21 { animation-name: m21; }  /* B broadcast block: 8.35s to 9.1s */
    @keyframes m21 { 0.00% { opacity: 0; transform: translate(0px, 0px) } 50.61% { opacity: 0; transform: translate(0px, 0px) } 51.21% { opacity: 1; transform: translate(0px, 0px) } 54.85% { opacity: 1; transform: translate(-194px, -46px) } 55.21% { opacity: 0; transform: translate(-194px, -46px) } 100.00% { opacity: 0; transform: translate(-194px, -46px) } }
    .w22 { animation-name: w22; }  /* B broadcast copy: 9.05s to 15.2s */
    @keyframes w22 { 0.00%, 54.55% { opacity: 0 } 54.85%, 92.12% { opacity: 1 } 95.76%, 100.00% { opacity: 0 } }
    .w23 { animation-name: w23; }  /* B broadcast arrow: 8.2s to 15.2s */
    @keyframes w23 { 0.00%, 50.00% { opacity: 0 } 50.91%, 92.12% { opacity: 1 } 95.76%, 100.00% { opacity: 0 } }
    .m24 { animation-name: m24; }  /* B broadcast block: 8.35s to 9.1s */
    @keyframes m24 { 0.00% { opacity: 0; transform: translate(0px, 0px) } 50.61% { opacity: 0; transform: translate(0px, 0px) } 51.21% { opacity: 1; transform: translate(0px, 0px) } 54.85% { opacity: 1; transform: translate(-194px, -14px) } 55.21% { opacity: 0; transform: translate(-194px, -14px) } 100.00% { opacity: 0; transform: translate(-194px, -14px) } }
    .w25 { animation-name: w25; }  /* B broadcast copy: 9.05s to 15.2s */
    @keyframes w25 { 0.00%, 54.55% { opacity: 0 } 54.85%, 92.12% { opacity: 1 } 95.76%, 100.00% { opacity: 0 } }
    .w26 { animation-name: w26; }  /* B broadcast arrow: 8.2s to 15.2s */
    @keyframes w26 { 0.00%, 50.00% { opacity: 0 } 50.91%, 92.12% { opacity: 1 } 95.76%, 100.00% { opacity: 0 } }
    .m27 { animation-name: m27; }  /* B broadcast block: 8.35s to 9.1s */
    @keyframes m27 { 0.00% { opacity: 0; transform: translate(0px, 0px) } 50.61% { opacity: 0; transform: translate(0px, 0px) } 51.21% { opacity: 1; transform: translate(0px, 0px) } 54.85% { opacity: 1; transform: translate(-194px, 18px) } 55.21% { opacity: 0; transform: translate(-194px, 18px) } 100.00% { opacity: 0; transform: translate(-194px, 18px) } }
    .w28 { animation-name: w28; }  /* B broadcast copy: 9.05s to 15.2s */
    @keyframes w28 { 0.00%, 54.55% { opacity: 0 } 54.85%, 92.12% { opacity: 1 } 95.76%, 100.00% { opacity: 0 } }
    .w29 { animation-name: w29; }  /* B broadcast arrow: 8.2s to 15.2s */
    @keyframes w29 { 0.00%, 50.00% { opacity: 0 } 50.91%, 92.12% { opacity: 1 } 95.76%, 100.00% { opacity: 0 } }
    .m30 { animation-name: m30; }  /* B broadcast block: 8.35s to 9.1s */
    @keyframes m30 { 0.00% { opacity: 0; transform: translate(0px, 0px) } 50.61% { opacity: 0; transform: translate(0px, 0px) } 51.21% { opacity: 1; transform: translate(0px, 0px) } 54.85% { opacity: 1; transform: translate(-194px, 50px) } 55.21% { opacity: 0; transform: translate(-194px, 50px) } 100.00% { opacity: 0; transform: translate(-194px, 50px) } }
    .w31 { animation-name: w31; }  /* B broadcast copy: 9.05s to 15.2s */
    @keyframes w31 { 0.00%, 54.55% { opacity: 0 } 54.85%, 92.12% { opacity: 1 } 95.76%, 100.00% { opacity: 0 } }
    .w32 { animation-name: w32; }  /* B done text: 10.6s to 15.2s */
    @keyframes w32 { 0.00%, 64.24% { opacity: 0 } 65.15%, 92.12% { opacity: 1 } 95.76%, 100.00% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .w, .mv { animation: none; opacity: 0; }
      .w.fin { opacity: 1; }
    }
  </style>
  <g transform="translate(0,-190)">
  <text x="20" y="216" class="title">--driver-memory 16g</text>
  <rect x="300" y="245" width="210" height="100" rx="6" class="box"/>
  <text x="316" y="270" class="label">Driver</text>
  <rect x="316" y="282" width="150" height="22" rx="3" class="empty"/>
  <text x="316" y="326" class="muted">driver memory: 16 GiB</text>
  <g class="w w10"><path d="M 154 249 L 289.4 292.3" class="garrow"/><polygon points="287.0,296.7 298,295 290.0,287.2" class="ghead"/></g>
  <g class="w w10"><path d="M 154 281 L 289.0 294.1" class="garrow"/><polygon points="287.6,299.0 298,295 288.5,289.1" class="ghead"/></g>
  <g class="w w10"><path d="M 154 313 L 289.1 296.1" class="garrow"/><polygon points="288.7,301.2 298,295 287.5,291.3" class="ghead"/></g>
  <g class="w w10"><path d="M 154 345 L 289.5 298.0" class="garrow"/><polygon points="290.2,303.0 298,295 286.9,293.6" class="ghead"/></g>
  <rect x="30" y="236" width="120" height="26" rx="4" class="box"/>
  <text x="40" y="254" style="font-size:13px">Executor 1</text>
  <rect x="30" y="268" width="120" height="26" rx="4" class="box"/>
  <text x="40" y="286" style="font-size:13px">Executor 2</text>
