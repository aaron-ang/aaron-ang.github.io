<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 371"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
  role="img"
  aria-label="Animated memory budget: the driver starts with the default 5g memory plus 2g memoryOverhead, then --driver-memory 16g grows it to 16g plus 2g, still well under the 48 GiB safety cap of a 102 GiB container. The executor keeps 16g plus 4g while its cores go from 1 to 4."
  width="720"
  height="371"
  data-diagram-width="720"
>
  <style>
    :root {
      --fg: #222;
      --full: #cfcfcf;
      --empty: #ffffff;
      --edge: #999;
      --probe: #d9480f;
      --chip: #f4f4f4;
      --accent: #1971c2;
      --muted: #707071;
      --label-compute: #237a36;
      --type-heading: 21.11110929px;
      --type-subheading: 16.888887px;
      --type-label: 14.77777651px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --full: #555;
        --empty: #1e1e1e;
        --edge: #777;
        --probe: #ff8a4c;
        --chip: #2a2a2a;
        --accent: #74c0fc;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .muted {
      fill: var(--muted);
    }
    .row {
      font-weight: 600;
    }
    .heap {
      fill: var(--accent);
      stroke: var(--edge);
    }
    .ovh {
      fill: var(--full);
      stroke: var(--edge);
    }
    .usable {
      fill: var(--empty);
      stroke: var(--edge);
    }
    .reserved {
      fill: var(--chip);
      stroke: var(--edge);
      stroke-dasharray: 4 3;
    }
    .cap {
      stroke: var(--probe);
      stroke-width: 2;
      stroke-dasharray: 6 4;
    }
    .captext {
      fill: var(--probe);
      font-weight: 600;
    }
    .axis {
      stroke: var(--edge);
    }
    .chip {
      fill: var(--chip);
      stroke: var(--probe);
      stroke-width: 1.5;
    }
    .cmd {
      fill: var(--probe);
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .oktext {
      font-weight: 600;
      fill: var(--label-compute);
    }
    .hot {
      fill: var(--probe);
      font-weight: 600;
    }

    /* 22.7s loop; steps at 0, 6.0, 9.0, 14.0 s (variable holds); final frame holds to 21.6s, then fades. */
    .a1 {
      opacity: 0;
      animation: 22.7s linear infinite;
      animation-name: a1;
    }
    .a2 {
      opacity: 0;
      animation: 22.7s linear infinite;
      animation-name: a2;
    }
    .a3 {
      opacity: 0;
      animation: 22.7s linear infinite;
      animation-name: a3;
    }
    .a4 {
      opacity: 0;
      animation: 22.7s linear infinite;
      animation-name: a4;
    }
    .a6 {
      opacity: 0;
      animation: 22.7s linear infinite;
      animation-name: a6;
    }
    .a7 {
      opacity: 0;
      animation: 22.7s linear infinite;
      animation-name: a7;
    } /* defaults (driver 5g + 2g, 1 core): 0s to 9.0s, back in from 22.05s */ /* caption "Defaults": 0s to 6.0s */ /* override flags appear: from 6.0s */ /* driver grows to 16g, executor 4 cores: from 9.0s */ /* caption "Override": 6.0s to 14.0s */ /* check + result caption: from 14.0s */
    @keyframes a1 {
      0.00%, 39.65% { opacity: 1; }
      40.31%, 95.15% { opacity: 0; }
      97.14%, 100.00% { opacity: 1; }
    }
    @keyframes a2 {
      0.00%, 26.43% { opacity: 1; }
      27.09%, 100.00% { opacity: 0; }
    }
    @keyframes a3 {
      0.00%, 26.43% { opacity: 0; }
      27.09%, 95.15% { opacity: 1; }
      97.14%, 100.00% { opacity: 0; }
    }
    @keyframes a4 {
      0.00%, 39.65% { opacity: 0; }
      40.31%, 95.15% { opacity: 1; }
      97.14%, 100.00% { opacity: 0; }
    }
    @keyframes a6 {
      0.00%, 26.43% { opacity: 0; }
      27.09%, 61.67% { opacity: 1; }
      62.33%, 100.00% { opacity: 0; }
    }
    @keyframes a7 {
      0.00%, 61.67% { opacity: 0; }
      62.33%, 95.15% { opacity: 1; }
      97.14%, 100.00% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .a1 {
        animation: none;
        opacity: 0;
      }
      .a2 {
        animation: none;
        opacity: 0;
      }
      .a6 {
        animation: none;
        opacity: 0;
      }
      .a3 {
        animation: none;
        opacity: 1;
      }
      .a4 {
        animation: none;
        opacity: 1;
      }
      .a7 {
        animation: none;
        opacity: 1;
      }
    }
    .title {
      font-weight: 700;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --muted: #aaa;
        --label-compute: #82df92;
      }
    }
    /* Typography adapted from ONS chart guidance:
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography
    20px headings, 16px subheadings, 14px labels at native display width.
    Variables compensate for the original graphics coordinate scale. */
    .type-heading {
      font-size: var(--type-heading);
    }
    .type-subheading {
      font-size: var(--type-subheading);
    }

  </style>
  <g transform="scale(0.9473684210526315)">
    <text x="20" y="28" class="title type-heading">Memory (GiB)</text>
    <text x="20" y="52" class="a2">Defaults: driver 5g memory + 2g memoryOverhead, 1 core per executor.</text>
    <text x="20" y="52" class="a6">Override: <tspan class="hot">--driver-memory 16g</tspan> and <tspan class="hot">--executor-cores 4</tspan>.</text>
    <text x="20" y="52" class="oktext a7">Driver gets 16g, well under the 48 GiB cap. The OOM errors disappeared.</text>
    <g transform="translate(0 30)">
      <text x="20" y="84" class="row">Container</text>
    </g>
    <g transform="translate(0 30)">
      <rect x="130" y="64" width="552" height="30" class="usable" />
    </g>
    <g transform="translate(0 30)">
      <rect x="682" y="64" width="60" height="30" class="reserved" />
    </g>
    <g transform="translate(0 30)">
      <text x="138" y="84" class="muted">up to ~92 GiB memory</text>
    </g>
    <g transform="translate(0 30)">
      <text x="712" y="84" text-anchor="middle" class="muted">10%</text>
    </g>
    <g transform="translate(0 30)">
      <text x="742" y="112" text-anchor="end" class="muted">container memory 102 GiB = memory + ~10% overhead</text>
    </g>
    <g transform="translate(0 30)">
      <line x1="418" y1="58" x2="418" y2="200" class="cap" />
    </g>
    <g transform="translate(0 30)">
      <text x="426" y="84" class="captext">safety cap ~48 GiB</text>
    </g>
    <g transform="translate(0 30)">
      <text x="20" y="159" class="row">Driver</text>
    </g>
    <g transform="translate(0 30)">
      <g class="a1">
        <rect x="130" y="140" width="30" height="28" class="heap" />
        <rect x="160" y="140" width="12" height="28" class="ovh" />
        <text x="180" y="159" class="val">5g + 2g = 7 GiB</text>
      </g>
    </g>
    <g transform="translate(0 30)">
      <g class="a4">
        <rect x="130" y="140" width="96" height="28" class="heap" />
        <rect x="226" y="140" width="12" height="28" class="ovh" />
        <text x="246" y="159" class="val">16g + 2g = 18 GiB</text>
        <text x="130" y="188" class="muted">memoryOverhead stays 2g (unchanged default)</text>
      </g>
    </g>
    <g transform="translate(0 30)">
      <g class="a3">
        <rect x="440" y="140" width="170" height="28" rx="4" class="chip" />
        <text x="525" y="159" text-anchor="middle" class="cmd">--driver-memory 16g</text>
      </g>
    </g>
    <g transform="translate(0 30)">
      <text x="440" y="190" class="oktext a7">✓ well under the cap</text>
    </g>
    <g transform="translate(0 30)">
      <text x="20" y="245" class="row">Executor</text>
    </g>
    <g transform="translate(0 30)">
      <text x="20" y="262" class="muted">×10 instances</text>
    </g>
    <g transform="translate(0 30)">
      <rect x="130" y="226" width="96" height="28" class="heap" />
    </g>
    <g transform="translate(0 30)">
      <rect x="226" y="226" width="24" height="28" class="ovh" />
    </g>
    <g transform="translate(0 30)">
      <text x="258" y="245" class="val">16g + 4g = 20 GiB</text>
    </g>
    <g transform="translate(0 30)">
      <text x="130" y="274" class="muted a1">1 core</text>
    </g>
    <g transform="translate(0 30)">
      <text x="130" y="274" class="muted a4">4 cores, memory unchanged</text>
    </g>
    <g transform="translate(0 30)">
      <g class="a3">
        <rect x="440" y="226" width="170" height="28" rx="4" class="chip" />
        <text x="525" y="245" text-anchor="middle" class="cmd">--executor-cores 4</text>
      </g>
    </g>
    <g transform="translate(0 30)">
      <line x1="130" y1="292" x2="742" y2="292" class="axis" />
    </g>
    <g transform="translate(0 30)">
      <g class="axis">
        <line x1="130" y1="292" x2="130" y2="297" />
        <line x1="250" y1="292" x2="250" y2="297" />
        <line x1="370" y1="292" x2="370" y2="297" />
        <line x1="490" y1="292" x2="490" y2="297" />
        <line x1="610" y1="292" x2="610" y2="297" />
        <line x1="730" y1="292" x2="730" y2="297" />
      </g>
    </g>
    <g transform="translate(0 30)">
      <text x="130" y="311" text-anchor="middle" class="muted">0</text>
    </g>
    <g transform="translate(0 30)">
      <text x="250" y="311" text-anchor="middle" class="muted">20</text>
    </g>
    <g transform="translate(0 30)">
      <text x="370" y="311" text-anchor="middle" class="muted">40</text>
    </g>
    <g transform="translate(0 30)">
      <text x="490" y="311" text-anchor="middle" class="muted">60</text>
    </g>
    <g transform="translate(0 30)">
      <text x="610" y="311" text-anchor="middle" class="muted">80</text>
    </g>
    <g transform="translate(0 30)">
      <text x="730" y="311" text-anchor="middle" class="muted">100 GiB</text>
    </g>
    <g transform="translate(0 30)">
      <rect x="130" y="332" width="14" height="14" class="heap" />
    </g>
    <g transform="translate(0 30)">
      <text x="150" y="344" class="muted">memory (on-heap)</text>
    </g>
    <g transform="translate(0 30)">
      <rect x="270" y="332" width="14" height="14" class="ovh" />
    </g>
    <g transform="translate(0 30)">
      <text x="290" y="344" class="muted">memoryOverhead (non-heap)</text>
    </g>
    <g transform="translate(0 30)">
      <text x="742" y="344" text-anchor="end" class="val">total = memory + memoryOverhead</text>
    </g>
  </g>
</svg>
