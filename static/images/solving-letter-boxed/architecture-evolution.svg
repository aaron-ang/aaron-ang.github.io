      font-size: var(--type-label);
    }
    .muted {
      fill: var(--muted);
    }
    .strip {
      fill: var(--chip);
      stroke: var(--edge);
    }
    .yr {
      font-weight: 700;
    }
    .ring {
      fill: none;
      stroke: var(--probe);
      stroke-width: 3;
    }
    .ringok {
      fill: none;
      stroke: var(--ok);
      stroke-width: 3;
    }
    .win {
      fill: none;
      stroke: var(--edge);
      stroke-width: 1.5;
    }
    .net {
      fill: var(--chip);
      stroke: var(--edge);
      stroke-dasharray: 5 4;
    }
    .lane {
      font-weight: 600;
    }
    .lanebg {
      fill: var(--chip);
      stroke: var(--edge);
    }
    .uichip {
      fill: var(--full);
      stroke: var(--edge);
    }
    .okchip {
      fill: var(--empty);
      stroke: var(--ok);
      stroke-width: 1.5;
    }
    .wait {
      fill: var(--empty);
      stroke: var(--probe);
      stroke-dasharray: 4 3;
    }
    .work {
      fill: var(--probe);
    }
    .workt {
      fill: var(--empty);
      font-weight: 600;
    }
    .gpu {
      fill: var(--empty);
      stroke: var(--accent);
      stroke-width: 2;
    }
    .gput {
      fill: var(--accent);
      font-weight: 600;
    }
    .fb {
      fill: var(--empty);
      stroke: var(--edge);
      stroke-dasharray: 4 3;
    }
    .btn {
      fill: var(--chip);
      stroke: var(--edge);
    }
    .btnt {
      font-weight: 600;
    }
    .warn {
      fill: var(--probe);
      font-weight: 600;
    }
    .okt {
      fill: var(--ok);
      font-weight: 600;
    }
    .spinbg {
      fill: none;
      stroke: var(--full);
      stroke-width: 2.5;
    }
    .spin {
      fill: none;
      stroke: var(--probe);
      stroke-width: 2.5;
    }
    .arr {
      stroke: var(--fg);
      stroke-width: 2;
    }
    .arrh {
      fill: var(--fg);
    }
    .arrok {
      stroke: var(--ok);
      stroke-width: 2;
    }
    .arrhok {
      fill: var(--ok);
    }
    .rtt {
      stroke: var(--probe);
      stroke-width: 2;
    }
    /* 68.32s loop, 13 steps starting at 0.5, 6.72, 10.69, 15.85, 21.82, 25.12, 29.34, 33.1, 39.32, 43.34, 47.9, 51.7, 60.14 s; final frame holds 7.43s, then fades. */
