<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 368"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
  role="img"
  aria-label="Animated architecture history: in v1 the solver froze the browser main thread, in v2 a Cloud Function solved puzzles over a network round trip, and in v3 a Web Worker answers Solve with backtracking and a separate Find Best request with WebGPU, falling back to the CPU, while the UI stays responsive"
  width="720"
  height="368"
  data-diagram-width="720"
>
  <style>
    :root {
      --fg: #222;
      --full: #cfcfcf;
      --empty: #ffffff;
      --edge: #999;
      --probe: #d9480f;
      --ok: #2b8a3e;
      --chip: #f4f4f4;
      --accent: #1971c2;
      --muted: #707071;
      --type-heading: 21.11110929px;
      --type-subheading: 16.888887px;
      --type-label: 14.77777651px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --full: #555;
        --empty: #1e1e1e;
        --edge: #777;
        --probe: #ff8a4c;
        --ok: #69db7c;
        --chip: #2a2a2a;
        --accent: #74c0fc;
      }
    }
    text {
      fill: var(--fg);
