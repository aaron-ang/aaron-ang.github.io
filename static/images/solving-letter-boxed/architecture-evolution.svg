<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated architecture history: in 2022 the solver froze the browser main thread, in 2023 a Cloud Function solved puzzles over a network round trip, and in 2026 a Web Worker answers Solve with backtracking and a separate Find Best request with WebGPU, falling back to the CPU, while the UI stays responsive">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --chip: #f4f4f4; --accent: #1971c2; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --chip: #2a2a2a; --accent: #74c0fc; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .strip { fill: var(--chip); stroke: var(--edge); }
    .yr { font-weight: 700; }
    .ring { fill: none; stroke: var(--probe); stroke-width: 3; }
    .ringok { fill: none; stroke: var(--ok); stroke-width: 3; }
    .win { fill: none; stroke: var(--edge); stroke-width: 1.5; }
    .net { fill: var(--chip); stroke: var(--edge); stroke-dasharray: 5 4; }
    .lane { font-weight: 600; }
    .lanebg { fill: var(--chip); stroke: var(--edge); }
    .uichip { fill: var(--full); stroke: var(--edge); }
    .okchip { fill: var(--empty); stroke: var(--ok); stroke-width: 1.5; }
    .wait { fill: var(--empty); stroke: var(--probe); stroke-dasharray: 4 3; }
    .work { fill: var(--probe); }
    .workt { fill: var(--empty); font-weight: 600; font-size: 13px; }
    .gpu { fill: var(--empty); stroke: var(--accent); stroke-width: 2; }
    .gput { fill: var(--accent); font-weight: 600; font-size: 13px; }
    .fb { fill: var(--empty); stroke: var(--edge); stroke-dasharray: 4 3; }
    .btn { fill: var(--chip); stroke: var(--edge); }
    .btnt { font-weight: 600; font-size: 13px; }
    .small { font-size: 12px; }
    .warn { fill: var(--probe); font-weight: 600; font-size: 13px; }
    .okt { fill: var(--ok); font-weight: 600; font-size: 13px; }
    .spinbg { fill: none; stroke: var(--full); stroke-width: 2.5; }
    .spin { fill: none; stroke: var(--probe); stroke-width: 2.5; }
    .arr { stroke: var(--fg); stroke-width: 2; }
    .arrh { fill: var(--fg); }
    .arrok { stroke: var(--ok); stroke-width: 2; }
    .arrhok { fill: var(--ok); }
    .rtt { stroke: var(--probe); stroke-width: 2; }
    /* 64.92s loop, 13 steps starting at 0.5, 6.72, 10.69, 15.85, 21.82, 23.52, 27.74, 31.5, 37.72, 41.74, 46.3, 48.3, 56.74 s; final frame holds 7.43s, then fades. */
    .a { opacity: 0; animation: 64.92s linear infinite; }
    .w1 { animation-name: w1; }  /* 0.50s to 15.85s */
    @keyframes w1 { 0.00%, 24.41% { opacity: 1 } 24.65%, 98.84% { opacity: 0 } 99.08%, 100.00% { opacity: 1 } }
    .w2 { animation-name: w2; }  /* 15.85s to 31.50s */
    @keyframes w2 { 0.00%, 24.41% { opacity: 0 } 24.65%, 48.52% { opacity: 1 } 48.75%, 100.00% { opacity: 0 } }
    .w3 { animation-name: w3; }  /* 31.50s to end */
    @keyframes w3 { 0.00%, 48.52% { opacity: 0 } 48.75%, 98.84% { opacity: 1 } 99.08%, 100.00% { opacity: 0 } }
    .w4 { animation-name: w4; }  /* 6.72s to 15.85s */
    @keyframes w4 { 0.00%, 10.35% { opacity: 0 } 10.58%, 24.41% { opacity: 1 } 24.65%, 100.00% { opacity: 0 } }
    .w5 { animation-name: w5; }  /* 10.69s to 15.85s */
    @keyframes w5 { 0.00%, 16.47% { opacity: 0 } 16.70%, 24.41% { opacity: 1 } 24.65%, 100.00% { opacity: 0 } }
    .w6 { animation-name: w6; }  /* 21.82s to 31.50s */
    @keyframes w6 { 0.00%, 33.61% { opacity: 0 } 33.84%, 48.52% { opacity: 1 } 48.75%, 100.00% { opacity: 0 } }
    .w7 { animation-name: w7; }  /* 23.52s to 31.50s */
    @keyframes w7 { 0.00%, 36.23% { opacity: 0 } 36.46%, 48.52% { opacity: 1 } 48.75%, 100.00% { opacity: 0 } }
    .w8 { animation-name: w8; }  /* 27.74s to 31.50s */
    @keyframes w8 { 0.00%, 42.73% { opacity: 0 } 42.96%, 48.52% { opacity: 1 } 48.75%, 100.00% { opacity: 0 } }
    .w9 { animation-name: w9; }  /* 41.74s to end */
    @keyframes w9 { 0.00%, 64.29% { opacity: 0 } 64.53%, 98.84% { opacity: 1 } 99.08%, 100.00% { opacity: 0 } }
    .w10 { animation-name: w10; }  /* 46.30s to end */
    @keyframes w10 { 0.00%, 71.32% { opacity: 0 } 71.55%, 98.84% { opacity: 1 } 99.08%, 100.00% { opacity: 0 } }
    .w11 { animation-name: w11; }  /* 48.30s to end */
    @keyframes w11 { 0.00%, 74.40% { opacity: 0 } 74.63%, 98.84% { opacity: 1 } 99.08%, 100.00% { opacity: 0 } }
    .w12 { animation-name: w12; }  /* 56.74s to end */
    @keyframes w12 { 0.00%, 87.40% { opacity: 0 } 87.63%, 98.84% { opacity: 1 } 99.08%, 100.00% { opacity: 0 } }
    .w13 { animation-name: w13; }  /* 37.72s to end */
    @keyframes w13 { 0.00%, 58.10% { opacity: 0 } 58.33%, 98.84% { opacity: 1 } 99.08%, 100.00% { opacity: 0 } }
    .w14 { animation-name: w14; }  /* 0.50s to 6.72s */
    @keyframes w14 { 0.00%, 10.35% { opacity: 1 } 10.58%, 98.84% { opacity: 0 } 99.08%, 100.00% { opacity: 1 } }
    .w15 { animation-name: w15; }  /* 6.72s to 10.69s */
    @keyframes w15 { 0.00%, 10.35% { opacity: 0 } 10.58%, 16.47% { opacity: 1 } 16.70%, 100.00% { opacity: 0 } }
    .w16 { animation-name: w16; }  /* 15.85s to 21.82s */
    @keyframes w16 { 0.00%, 24.41% { opacity: 0 } 24.65%, 33.61% { opacity: 1 } 33.84%, 100.00% { opacity: 0 } }
    .w17 { animation-name: w17; }  /* 23.52s to 27.74s */
    @keyframes w17 { 0.00%, 36.23% { opacity: 0 } 36.46%, 42.73% { opacity: 1 } 42.96%, 100.00% { opacity: 0 } }
    .w18 { animation-name: w18; }  /* 31.50s to 37.72s */
    @keyframes w18 { 0.00%, 48.52% { opacity: 0 } 48.75%, 58.10% { opacity: 1 } 58.33%, 100.00% { opacity: 0 } }
    .w19 { animation-name: w19; }  /* 37.72s to 41.74s */
    @keyframes w19 { 0.00%, 58.10% { opacity: 0 } 58.33%, 64.29% { opacity: 1 } 64.53%, 100.00% { opacity: 0 } }
    .w20 { animation-name: w20; }  /* 41.74s to 46.30s */
    @keyframes w20 { 0.00%, 64.29% { opacity: 0 } 64.53%, 71.32% { opacity: 1 } 71.55%, 100.00% { opacity: 0 } }
    .w21 { animation-name: w21; }  /* 48.30s to 56.74s */
    @keyframes w21 { 0.00%, 74.40% { opacity: 0 } 74.63%, 87.40% { opacity: 1 } 87.63%, 100.00% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; opacity: 0; }
      .a.fin { opacity: 1; }
    }
  </style>
  <text x="20" y="26" class="title">Where the solver runs</text>
  <rect x="20" y="40" width="230" height="30" rx="15" class="strip"/>
  <text x="135" y="60" text-anchor="middle"><tspan class="yr">2022</tspan> · main thread</text>
  <rect x="265" y="40" width="230" height="30" rx="15" class="strip"/>
  <text x="380" y="60" text-anchor="middle"><tspan class="yr">2023</tspan> · Cloud Function</text>
  <rect x="510" y="40" width="230" height="30" rx="15" class="strip"/>
  <text x="625" y="60" text-anchor="middle"><tspan class="yr">2026</tspan> · Web Worker + WebGPU</text>
  <rect x="18" y="38" width="234" height="34" rx="17" class="ring a w1"/>
  <rect x="263" y="38" width="234" height="34" rx="17" class="ring a w2"/>
  <rect x="508" y="38" width="234" height="34" rx="17" class="ringok a w3 fin"/>
  <g class="a w1">
    <rect x="30" y="92" width="700" height="220" rx="8" class="win"/>
    <text x="46" y="114" class="muted">browser tab</text>
    <text x="50" y="163" class="lane">main thread</text>
    <rect x="160" y="140" width="550" height="36" rx="4" class="lanebg"/>
    <rect x="168" y="146" width="60" height="24" rx="4" class="uichip"/>
    <text x="198" y="162.5" text-anchor="middle" class="small">render</text>
    <rect x="236" y="146" width="50" height="24" rx="4" class="uichip"/>
    <text x="261" y="162.5" text-anchor="middle" class="small">click</text>
    <rect x="600" y="100" width="110" height="30" rx="4" class="btn"/>
    <text x="655" y="119.5" text-anchor="middle" class="btnt">Solve</text>
  </g>
  <g class="a w4">
    <rect x="296" y="146" width="406" height="24" rx="4" class="work"/>
    <text x="499" y="163" text-anchor="middle" class="workt">Solve: backtracking search</text>
    <circle cx="691" cy="115" r="7" class="spinbg"/>
    <path d="M 691 108 A 7 7 0 0 1 698 115" class="spin"/>
  </g>
  <g class="a w5">
    <rect x="300" y="196" width="56" height="24" rx="4" class="wait"/>
    <text x="328" y="212.5" text-anchor="middle" class="small">click</text>
    <rect x="364" y="196" width="56" height="24" rx="4" class="wait"/>
    <text x="392" y="212.5" text-anchor="middle" class="small">scroll</text>
    <rect x="428" y="196" width="60" height="24" rx="4" class="wait"/>
    <text x="458" y="212.5" text-anchor="middle" class="small">render</text>
    <text x="300" y="242" class="warn">UI events queue up behind the solver</text>
    <text x="592" y="119" text-anchor="end" class="warn">spinner stuck</text>
  </g>
  <g class="a w2">
    <rect x="30" y="110" width="200" height="170" rx="8" class="win"/>
    <text x="46" y="132" class="muted">browser tab</text>
    <text x="130" y="200" text-anchor="middle" class="lane">UI</text>
    <rect x="530" y="110" width="200" height="170" rx="8" class="win"/>
    <text x="546" y="132" class="muted">Cloud Function</text>
    <text x="630" y="152" text-anchor="middle" class="muted">Node, then Go</text>
    <rect x="258" y="120" width="244" height="150" rx="30" class="net"/>
    <text x="380" y="262" text-anchor="middle" class="muted">network</text>
  </g>
  <g class="a w6">
    <line x1="232" y1="165" x2="518" y2="165" class="arr"/>
    <polygon points="528,165 518,171 518,159" class="arrh"/>
    <text x="380" y="157" text-anchor="middle" class="small">request: 12 letters</text>
  </g>
  <g class="a w7">
    <rect x="548" y="180" width="164" height="30" rx="4" class="work"/>
    <text x="630" y="199.5" text-anchor="middle" class="workt">solver</text>
  </g>
  <g class="a w8">
    <line x1="528" y1="232" x2="242" y2="232" class="arr"/>
    <polygon points="232,232 242,226 242,238" class="arrh"/>
    <text x="380" y="224" text-anchor="middle" class="small">gzipped response</text>
    <line x1="244" y1="296" x2="516" y2="296" class="rtt"/>
    <line x1="244" y1="290" x2="244" y2="302" class="rtt"/>
    <line x1="516" y1="290" x2="516" y2="302" class="rtt"/>
    <text x="380" y="318" text-anchor="middle" class="warn">network round trip</text>
  </g>
  <g class="a w3 fin">
    <rect x="30" y="92" width="700" height="236" rx="8" class="win"/>
    <text x="46" y="114" class="muted">browser tab</text>
    <text x="50" y="148" class="lane">main thread</text>
    <rect x="160" y="125" width="550" height="36" rx="4" class="lanebg"/>
    <text x="50" y="210" class="lane">Web Worker</text>
    <rect x="160" y="187" width="550" height="36" rx="4" class="lanebg"/>
  </g>
  <g class="a w3 fin">
    <rect x="168" y="131" width="68" height="24" rx="4" class="okchip"/>
    <text x="202" y="147.5" text-anchor="middle" class="small">render</text>
  </g>
  <g class="a w3 fin">
    <rect x="244" y="131" width="68" height="24" rx="4" class="okchip"/>
    <text x="278" y="147.5" text-anchor="middle" class="small">click</text>
  </g>
  <g class="a w9 fin">
    <rect x="320" y="131" width="68" height="24" rx="4" class="okchip"/>
    <text x="354" y="147.5" text-anchor="middle" class="small">render</text>
  </g>
  <g class="a w9 fin">
    <rect x="396" y="131" width="68" height="24" rx="4" class="okchip"/>
    <text x="430" y="147.5" text-anchor="middle" class="small">scroll</text>
  </g>
  <g class="a w10 fin">
    <rect x="472" y="131" width="68" height="24" rx="4" class="okchip"/>
    <text x="506" y="147.5" text-anchor="middle" class="small">render</text>
  </g>
  <g class="a w11 fin">
    <rect x="548" y="131" width="68" height="24" rx="4" class="okchip"/>
    <text x="582" y="147.5" text-anchor="middle" class="small">click</text>
  </g>
  <g class="a w12 fin">
    <rect x="624" y="131" width="68" height="24" rx="4" class="okchip"/>
    <text x="658" y="147.5" text-anchor="middle" class="small">render</text>
  </g>
  <g class="a w13 fin">
    <line x1="200" y1="161" x2="200" y2="177" class="arr"/>
    <polygon points="200,187 194,177 206,177" class="arrh"/>
    <text x="208" y="180" class="small">Solve</text>
    <rect x="222" y="193" width="90" height="24" rx="4" class="uichip"/>
    <text x="267" y="209.5" text-anchor="middle" class="small">filter words</text>
  </g>
  <g class="a w9 fin">
    <rect x="320" y="193" width="150" height="24" rx="4" class="work"/>
    <text x="395" y="209.5" text-anchor="middle" class="workt">backtracking</text>
  </g>
  <g class="a w10 fin">
    <line x1="460" y1="187" x2="460" y2="171" class="arrok"/>
    <polygon points="460,161 466,171 454,171" class="arrhok"/>
    <text x="454" y="180" text-anchor="end" class="okt">solution</text>
  </g>
  <g class="a w11 fin">
    <line x1="520" y1="161" x2="520" y2="177" class="arr"/>
    <polygon points="520,187 514,177 526,177" class="arrh"/>
    <text x="528" y="180" class="small">Find Best</text>
    <rect x="500" y="193" width="200" height="24" rx="4" class="gpu"/>
    <text x="600" y="209.5" text-anchor="middle" class="gput">word-chain search</text>
    <line x1="520" y1="217" x2="520" y2="240" class="arr"/>
    <polygon points="520,250 514,240 526,240" class="arrh"/>
    <rect x="440" y="250" width="160" height="30" rx="4" class="gpu"/>
    <text x="520" y="269.5" text-anchor="middle" class="gput">WebGPU passes</text>
    <rect x="610" y="250" width="110" height="30" rx="4" class="fb"/>
    <text x="665" y="269.5" text-anchor="middle" class="small">CPU fallback</text>
    <text x="720" y="298" text-anchor="end" class="muted">if WebGPU is missing, fails, or overflows</text>
  </g>
  <g class="a w12 fin">
    <line x1="690" y1="187" x2="690" y2="171" class="arrok"/>
    <polygon points="690,161 696,171 684,171" class="arrhok"/>
    <text x="684" y="180" text-anchor="end" class="okt">best</text>
    <text x="160" y="118" class="okt">UI stays responsive the whole time</text>
  </g>
  <text x="20" y="352" class="a w14">A tab's JavaScript, renders, and clicks all share one thread.</text>
  <text x="20" y="352" class="a w15">The search runs to completion before anything else can.</text>
  <text x="20" y="352" class="a w16">Moving the work off the device stops the freezing.</text>
  <text x="20" y="352" class="a w17">Cold starts add delay when the function has been idle.</text>
  <text x="20" y="352" class="a w8">Every solve pays for this round trip.</text>
  <text x="20" y="352" class="a w18">A worker gets its own thread, beside the main thread.</text>
  <text x="20" y="352" class="a w19">The worker filters the dictionary once per puzzle.</text>
  <text x="20" y="352" class="a w20">The main thread keeps handling events meanwhile.</text>
  <text x="20" y="352" class="a w21">Find Best, a separate request, reuses the filtered words.</text>
  <text x="20" y="352" class="title a w12 fin">Same Solve algorithm; the search moved off the main thread.</text>
  <text x="20" y="376" class="muted a w12 fin"><tspan class="yr">2022</tspan>: UI blocked · <tspan class="yr">2023</tspan>: network round trip · <tspan class="yr">2026</tspan>: neither</text>
</svg>
