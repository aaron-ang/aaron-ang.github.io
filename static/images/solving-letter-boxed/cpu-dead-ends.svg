  <text x="20" y="370" class="a w20">Level 3 builds chains one word at a time.</text>
  <text x="20" y="370" class="a w21">ARC sets its letters in the covered mask.</text>
  <text x="20" y="370" class="a w22">CAME adds M and E.</text>
  <text x="20" y="370" class="a w23">Only a word starting with E can come next.</text>
  <text x="20" y="370" class="a w24">The first-letter index lists them directly.</text>
  <text x="20" y="370" class="a w25">OR in each word in turn; 12 of 12 would finish the puzzle.</text>
