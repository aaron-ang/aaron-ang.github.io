    <text x="514" y="280" class="word a w26 fin">CHAMBER REFUND DRAW</text>
    <text x="514" y="300" class="word a w26 fin">CHAMBER REFUND DREW</text>
    <text x="514" y="320" class="muted a w26 fin">Top 3 of 8; all 17 letters.</text>
    <text x="514" y="340" class="muted a w27 fin">fewest letters, ties alphabetical</text>
    <rect x="508" y="245" width="226" height="21" rx="4" class="pick a w27 fin" />
    <text x="20" y="384" class="a w1">The CPU checks for 1-word solutions first, then allocates GPU buffers.</text>
    <text x="20" y="384" class="a w8">Uploading once means later passes pay no transfer for their input.</text>
    <text x="20" y="384" class="a w28">Two chain buffers let a pass read one while writing the other.</text>
    <text x="20" y="384" class="a w29">Counters restart at 0, so each pass counts only its own output.</text>
    <text x="20" y="384" class="a w30">Chains stay on the GPU; only counts and solutions cross over.</text>
    <text x="20" y="384" class="a w31">The word limit of 3 still leaves room for a third word.</text>
    <text x="20" y="384" class="a w32">Swapping roles avoids copying chains between buffers.</text>
    <text x="20" y="384" class="a w33">The first level with any solution has the fewest words.</text>
    <text x="20" y="384" class="a w34">Every linked pair from pass 1 becomes a two-word chain in chains B.</text>
    <text x="20" y="384" class="a w35">Pass 2 extends each two-word chain by one more word.</text>
    <text x="20" y="384" class="a w36">Eight chains cover all 12 letters and claim solution slots.</text>
    <text x="20" y="384" class="a w37">At the word limit of three, pass 2 writes no next chains.</text>
    <text x="20" y="384" class="a w38">One readback returns the counters and all eight solutions.</text>
    <text x="20" y="384" class="a w39">The CPU sorts all eight solutions by their total letter count.</text>
    <text x="20" y="384" class="title a w27 fin type-heading">Each extra word costs one more pass and one more readback.</text>
  </g>
</svg>
