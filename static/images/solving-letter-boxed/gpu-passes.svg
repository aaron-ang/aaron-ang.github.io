<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 379"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
  role="img"
  aria-label="Animated GPU passes: after finding no 1-word solution, the CPU allocates empty buffers, then uploads the words and one-word chains once. Each pass is one dispatch that reads one chains buffer and writes new chains to the other, plus solutions and two counters. After each pass the CPU reads back the counters and solutions in one copy. Pass 1 finds no solution, so the buffers swap and pass 2 runs; it finds 8, and the CPU ranks them and picks CHAMBER REFUND DAWN."
  width="720"
  height="379"
  data-diagram-width="720"
