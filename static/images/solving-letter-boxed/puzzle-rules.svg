  viewBox="0 0 720 349"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
  role="img"
  aria-label="Animated Letter Boxed solution: FORMED is traced across the square one letter at a time, each letter on a different side from the one before, then DASHING starts from its last letter D and uses the remaining six letters, until all 12 letters are used in 2 words"
