<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated bitmask check: FORMED and DASHING each light the bits of the letters they use, sharing D, and OR-ing the two masks lights all 12 bits, so (a | b) === 0xFFF">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --chip: #f4f4f4; --accent: #1971c2; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --chip: #2a2a2a; --accent: #74c0fc; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .let { font-weight: 600; font-size: 15px; }
    .rowlab { font-weight: 600; }
    .empty { fill: var(--empty); stroke: var(--edge); }
    .chip { fill: var(--chip); stroke: var(--edge); }
    .zero { fill: var(--muted); font-size: 13px; }
    .one { fill: var(--empty); font-size: 13px; font-weight: 700; }
    .c1 { fill: var(--probe); stroke: var(--probe); }
    .c2 { fill: var(--accent); stroke: var(--accent); }
    .c3 { fill: var(--ok); stroke: var(--ok); }
    .rule { stroke: var(--fg); stroke-width: 1.5; }
    .okb { fill: var(--ok); font-weight: 600; }
    .hl { fill: none; stroke: var(--fg); stroke-width: 2.5; stroke-dasharray: 5 3; }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; font-weight: 600; }
    /* 33.87s loop, 6 steps starting at 0.5, 5.33, 11.5, 15.2, 19.52, 26.99 s; final frame holds 6.13s, then fades. */
    .a { opacity: 0; animation: 33.87s linear infinite; }
    .w1 { animation-name: w1; }  /* 5.33s to end */
    @keyframes w1 { 0.00%, 15.74% { opacity: 0 } 16.18%, 97.79% { opacity: 1 } 98.23%, 100.00% { opacity: 0 } }
    .w2 { animation-name: w2; }  /* 11.50s to end */
    @keyframes w2 { 0.00%, 33.95% { opacity: 0 } 34.40%, 97.79% { opacity: 1 } 98.23%, 100.00% { opacity: 0 } }
    .w3 { animation-name: w3; }  /* 15.20s to end */
    @keyframes w3 { 0.00%, 44.88% { opacity: 0 } 45.32%, 97.79% { opacity: 1 } 98.23%, 100.00% { opacity: 0 } }
    .w4 { animation-name: w4; }  /* 19.52s to end */
    @keyframes w4 { 0.00%, 57.63% { opacity: 0 } 58.07%, 97.79% { opacity: 1 } 98.23%, 100.00% { opacity: 0 } }
    .w5 { animation-name: w5; }  /* 26.99s to end */
    @keyframes w5 { 0.00%, 79.69% { opacity: 0 } 80.13%, 97.79% { opacity: 1 } 98.23%, 100.00% { opacity: 0 } }
    .w6 { animation-name: w6; }  /* 0.50s to 5.33s */
    @keyframes w6 { 0.00%, 15.74% { opacity: 1 } 16.18%, 97.79% { opacity: 0 } 98.23%, 100.00% { opacity: 1 } }
    .w7 { animation-name: w7; }  /* 5.33s to 11.50s */
    @keyframes w7 { 0.00%, 15.74% { opacity: 0 } 16.18%, 33.95% { opacity: 1 } 34.40%, 100.00% { opacity: 0 } }
    .w8 { animation-name: w8; }  /* 15.20s to 19.52s */
    @keyframes w8 { 0.00%, 44.88% { opacity: 0 } 45.32%, 57.63% { opacity: 1 } 58.07%, 100.00% { opacity: 0 } }
    .w9 { animation-name: w9; }  /* 19.52s to 26.99s */
    @keyframes w9 { 0.00%, 57.63% { opacity: 0 } 58.07%, 79.69% { opacity: 1 } 80.13%, 100.00% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; opacity: 0; }
      .a.fin { opacity: 1; }
    }
    .mvar { font-family: 'Times New Roman', Times, 'STIX Two Text', serif; font-style: italic; font-size: 1.1em; }
