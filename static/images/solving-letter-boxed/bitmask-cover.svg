  <text x="20" y="334" class="a w6">Each of the puzzle's 12 letters gets one bit. Every bit starts at 0.</text>
  <text x="20" y="334" class="a w7">A word sets one bit per distinct letter, in any order.</text>
  <text x="20" y="334" class="a w8">Both words use D, so both set the D bit.</text>
  <text x="20" y="334" class="a w9">OR keeps a bit if either word sets it.</text>
