<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 234"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
  role="img"
  aria-label="Animated FIFO eviction: shadow page P is still in use but sits near the tail of active_mmu_pages. When free slots run low, FIFO zaps the two oldest pages, G and P. The next access to P faults and P is rebuilt at the head."
  width="720"
  height="234"
  data-diagram-width="720"
>
  <style>
    :root {
      --fg: #222;
      --full: #cfcfcf;
      --empty: #ffffff;
      --edge: #999;
      --probe: #d9480f;
      --ok: #2b8a3e;
      --muted: #707071;
      --label-load: #8a2c0a;
      --label-compute: #237a36;
      --type-heading: 21.11110929px;
      --type-subheading: 16.88888743px;
      --type-label: 14.77777651px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --full: #555;
        --empty: #1e1e1e;
        --edge: #777;
        --probe: #ff8a4c;
        --ok: #69db7c;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .muted {
      fill: var(--muted);
    }
    .full {
      fill: var(--full);
      stroke: var(--edge);
    }
    .slot {
      fill: none;
      stroke: var(--edge);
      stroke-dasharray: 4 3;
    }
    .ring {
      fill: none;
      stroke: var(--probe);
      stroke-width: 3;
    }
    .new {
      fill: var(--ok);
    }
    .zapped {
      fill: var(--empty);
      stroke: var(--edge);
      stroke-dasharray: 5 3;
    }
    .num {
      font-weight: 600;
      fill: var(--label-load);
    }
    .oktext {
      font-weight: 600;
      fill: var(--label-compute);
    }
    .ghost {
      fill: var(--muted);
      font-weight: 600;
    }
    .tag {
      font-weight: 600;
    }
    .onhot {
      fill: var(--empty);
      font-weight: 600;
    }
    /* 35.68s loop, 9 steps starting at 0.5, 3.8, 6.4, 12.2, 15.3, 18.6, 22.4, 25.5, 28.3 s; final frame holds 6.63s, then fades. */
    .a {
      opacity: 0;
      animation: 35.68s linear infinite;
    }
    .w1 {
      animation-name: w1;
    } /* 6.40s to 25.50s */
    @keyframes w1 {
      0.00%, 17.94% { opacity: 0; }
      18.36%, 71.47% { opacity: 1; }
      71.89%, 100.00% { opacity: 0; }
    }
    .w2 {
      animation-name: w2;
    } /* 25.50s to end */
    @keyframes w2 {
      0.00%, 71.47% { opacity: 0; }
      71.89%, 97.90% { opacity: 1; }
      98.32%, 100.00% { opacity: 0; }
    }
    .w3 {
      animation-name: w3;
    } /* 3.80s to 22.40s */
    @keyframes w3 {
      0.00%, 10.65% { opacity: 0; }
      11.07%, 62.78% { opacity: 1; }
      63.20%, 100.00% { opacity: 0; }
    }
    .w4 {
      animation-name: w4;
    } /* 15.30s to end */
    @keyframes w4 {
      0.00%, 42.88% { opacity: 0; }
      43.30%, 97.90% { opacity: 1; }
      98.32%, 100.00% { opacity: 0; }
    }
    .w5 {
      animation-name: w5;
    } /* 12.20s to end */
    @keyframes w5 {
      0.00%, 34.19% { opacity: 0; }
      34.61%, 97.90% { opacity: 1; }
      98.32%, 100.00% { opacity: 0; }
    }
    .w6 {
      animation-name: w6;
    } /* 22.40s to end */
    @keyframes w6 {
      0.00%, 62.78% { opacity: 0; }
      63.20%, 97.90% { opacity: 1; }
      98.32%, 100.00% { opacity: 0; }
    }
    .w7 {
      animation-name: w7;
    } /* 18.60s to end */
    @keyframes w7 {
      0.00%, 52.13% { opacity: 0; }
      52.55%, 97.90% { opacity: 1; }
      98.32%, 100.00% { opacity: 0; }
    }
    .w8 {
      animation-name: w8;
    } /* 28.30s to end */
    @keyframes w8 {
      0.00%, 79.32% { opacity: 0; }
      79.74%, 97.90% { opacity: 1; }
      98.32%, 100.00% { opacity: 0; }
    }
    .w9 {
      animation-name: w9;
    } /* 0.50s to 3.80s */
    @keyframes w9 {
      0.00%, 10.65% { opacity: 1; }
      11.07%, 97.90% { opacity: 0; }
      98.32%, 100.00% { opacity: 1; }
    }
    .w10 {
      animation-name: w10;
    } /* 3.80s to 6.40s */
    @keyframes w10 {
      0.00%, 10.65% { opacity: 0; }
      11.07%, 17.94% { opacity: 1; }
      18.36%, 100.00% { opacity: 0; }
    }
    .w11 {
      animation-name: w11;
    } /* 6.40s to 12.20s */
    @keyframes w11 {
      0.00%, 17.94% { opacity: 0; }
      18.36%, 34.19% { opacity: 1; }
      34.61%, 100.00% { opacity: 0; }
    }
    .w12 {
      animation-name: w12;
    } /* 12.20s to 15.30s */
    @keyframes w12 {
      0.00%, 34.19% { opacity: 0; }
      34.61%, 42.88% { opacity: 1; }
      43.30%, 100.00% { opacity: 0; }
    }
    .w13 {
      animation-name: w13;
    } /* 15.30s to 18.60s */
    @keyframes w13 {
      0.00%, 42.88% { opacity: 0; }
      43.30%, 52.13% { opacity: 1; }
      52.55%, 100.00% { opacity: 0; }
    }
    .w14 {
      animation-name: w14;
    } /* 18.60s to 22.40s */
    @keyframes w14 {
      0.00%, 52.13% { opacity: 0; }
      52.55%, 62.78% { opacity: 1; }
      63.20%, 100.00% { opacity: 0; }
    }
    .w15 {
      animation-name: w15;
    } /* 22.40s to 25.50s */
    @keyframes w15 {
      0.00%, 62.78% { opacity: 0; }
      63.20%, 71.47% { opacity: 1; }
      71.89%, 100.00% { opacity: 0; }
    }
    .w16 {
      animation-name: w16;
    } /* 25.50s to 28.30s */
    @keyframes w16 {
      0.00%, 71.47% { opacity: 0; }
      71.89%, 79.32% { opacity: 1; }
      79.74%, 100.00% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .a {
        animation: none;
        opacity: 0;
      }
      .a.fin {
        opacity: 1;
      }
    }
    .mvar {
      font-family: "Times New Roman", Times, "STIX Two Text", serif;
      font-style: italic;
    }
    .title {
      font-weight: 700;
    }
    .b {
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --muted: #aaa;
        --label-load: #ff9a64;
        --label-compute: #82df92;
      }
    }
    /* Typography adapted from ONS chart guidance:
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography
    20px headings, 16px subheadings, 14px labels at native display width.
    Variables compensate for the original graphics coordinate scale. */
    .type-heading {
      font-size: var(--type-heading);
    }
    .type-subheading {
      font-size: var(--type-subheading);
    }

  </style>
  <g transform="scale(0.9473684210526315)">
    <text x="20" y="28" class="title type-heading">Upstream KVM: FIFO eviction</text>
    <text x="20" y="50" class="muted">active_mmu_pages: new shadow pages join at the head; eviction walks from the tail (oldest).</text>
    <text x="30" y="92" class="muted">head (newest)</text>
    <text x="726" y="92" text-anchor="end" class="muted">tail (oldest)</text>
    <text x="380" y="88" text-anchor="middle" class="num a w1">cache nearly full: zap 2 pages</text>
    <rect x="30" y="104" width="60" height="48" rx="4" class="slot a w2 fin" />
    <rect x="130" y="104" width="64" height="48" rx="4" class="full" />
    <text x="162" y="133" text-anchor="middle" class="b type-subheading"><tspan class="mvar">A</tspan></text>
    <rect x="206" y="104" width="64" height="48" rx="4" class="full" />
    <text x="238" y="133" text-anchor="middle" class="b type-subheading"><tspan class="mvar">B</tspan></text>
    <rect x="282" y="104" width="64" height="48" rx="4" class="full" />
    <text x="314" y="133" text-anchor="middle" class="b type-subheading"><tspan class="mvar">C</tspan></text>
    <rect x="358" y="104" width="64" height="48" rx="4" class="full" />
    <text x="390" y="133" text-anchor="middle" class="b type-subheading"><tspan class="mvar">D</tspan></text>
    <rect x="434" y="104" width="64" height="48" rx="4" class="full" />
    <text x="466" y="133" text-anchor="middle" class="b type-subheading"><tspan class="mvar">E</tspan></text>
    <rect x="510" y="104" width="64" height="48" rx="4" class="full" />
    <text x="542" y="133" text-anchor="middle" class="b type-subheading"><tspan class="mvar">F</tspan></text>
    <rect x="586" y="104" width="64" height="48" rx="4" class="full" />
    <text x="618" y="133" text-anchor="middle" class="b type-subheading"><tspan class="mvar">P</tspan></text>
    <rect x="662" y="104" width="64" height="48" rx="4" class="full" />
    <text x="694" y="133" text-anchor="middle" class="b type-subheading"><tspan class="mvar">G</tspan></text>
    <text x="618" y="172" text-anchor="middle" class="tag a w3">in use</text>
    <rect x="662" y="104" width="64" height="48" rx="4" class="zapped a w4 fin" />
    <text x="694" y="133" text-anchor="middle" class="ghost a w4 fin"><tspan class="mvar">G</tspan></text>
    <rect x="658" y="100" width="72" height="56" rx="6" class="ring a w5 fin" />
    <text x="694" y="172" text-anchor="middle" class="num a w4 fin">zapped</text>
    <rect x="586" y="104" width="64" height="48" rx="4" class="zapped a w6 fin" />
    <text x="618" y="133" text-anchor="middle" class="ghost a w6 fin"><tspan class="mvar">P</tspan></text>
    <rect x="582" y="100" width="72" height="56" rx="6" class="ring a w7 fin" />
    <text x="618" y="172" text-anchor="middle" class="num a w6 fin">zapped</text>
    <text x="618" y="188" text-anchor="middle" class="num a w6 fin">while in use</text>
    <rect x="30" y="104" width="60" height="48" rx="4" class="new a w8 fin" />
    <rect x="28" y="102" width="64" height="52" rx="6" class="ring a w2 fin" />
    <text x="60" y="172" text-anchor="middle" class="num a w2 fin">page fault</text>
    <text x="60" y="133" text-anchor="middle" class="onhot a w8 fin"><tspan class="mvar">P</tspan></text>
    <text x="60" y="188" text-anchor="middle" class="oktext a w8 fin">rebuilt</text>
    <text x="20" y="228" class="a w9">Upstream KVM decides by age alone.</text>
    <text x="20" y="228" class="a w10">Old, but still hot.</text>
    <text x="20" y="228" class="a w11">Too few free slots are left, so KVM must make room.</text>
    <text x="20" y="228" class="a w12">The walk starts at the tail.</text>
    <text x="20" y="228" class="a w13">Nothing is lost: <tspan class="mvar">G</tspan> was cold.</text>
    <text x="20" y="228" class="a w14">Next oldest is <tspan class="mvar">P</tspan>. FIFO never looks at use.</text>
    <text x="20" y="228" class="a w15"><tspan class="mvar">P</tspan>'s translations are thrown away.</text>
    <text x="20" y="228" class="a w16">The guest touches <tspan class="mvar">P</tspan> again.</text>
    <text x="20" y="228" class="b a w8 fin type-subheading">FIFO pays an extra fault for every hot page that grows old.</text>
  </g>
</svg>
