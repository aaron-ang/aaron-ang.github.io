<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 266"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
  role="img"
  aria-label="Animated diagram of the same hot page H and cold page C with lru_age in leaf mode. Both lru_ref bits are 0. A hit on H causes no fault, but the CPU sets the accessed bit of the entry it used. When the clock hand reaches H, lru_ref is 0, so it checks the accessed bits, finds one set, clears it and keeps H. C has no accessed bit set, so C is zapped."
  width="720"
  height="266"
  data-diagram-width="720"
>
  <style>
    :root {
      --fg: #222;
      --full: #cfcfcf;
      --empty: #ffffff;
      --edge: #999;
      --probe: #d9480f;
      --ok: #2b8a3e;
      --muted: #707071;
      --label-load: #8a2c0a;
      --label-compute: #237a36;
      --type-heading: 21.11110929px;
      --type-subheading: 16.88888743px;
      --type-label: 14.77777651px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --full: #555;
        --empty: #1e1e1e;
        --edge: #777;
        --probe: #ff8a4c;
        --ok: #69db7c;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .muted {
      fill: var(--muted);
    }
    .full {
      fill: var(--full);
      stroke: var(--edge);
    }
    .empty {
      fill: var(--empty);
      stroke: var(--edge);
    }
    .ring {
      fill: none;
      stroke: var(--probe);
      stroke-width: 3;
    }
    .okring {
      fill: none;
      stroke: var(--ok);
      stroke-width: 3;
    }
    .cur {
      fill: none;
      stroke: var(--fg);
      stroke-width: 2.5;
    }
    .hot {
      fill: var(--probe);
    }
    .abit {
      fill: var(--ok);
      stroke: var(--ok);
    }
    .num {
      font-weight: 600;
      fill: var(--label-load);
    }
    .oktext {
      font-weight: 600;
      fill: var(--label-compute);
    }
    .onhot {
      fill: var(--empty);
      font-weight: 600;
    }
    .rule {
      stroke: var(--edge);
      stroke-dasharray: 3 4;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    /* 33.35s loop, 7 steps starting at 0.5, 5.2, 9.6, 13.0, 17.9, 21.9, 26.5 s; final frame holds 6.0s, then fades. */
    .a {
      opacity: 0;
      animation: 33.35s linear infinite;
    }
    .w1 {
      animation-name: w1;
    } /* 0.50s to 21.87s */
    @keyframes w1 {
      0.00%, 65.58% { opacity: 1; }
      66.03%, 97.75% { opacity: 0; }
      98.20%, 100.00% { opacity: 1; }
    }
    .w2 {
      animation-name: w2;
    } /* 5.18s to 9.60s */
    @keyframes w2 {
      0.00%, 15.52% { opacity: 0; }
      15.97%, 28.79% { opacity: 1; }
      29.24%, 100.00% { opacity: 0; }
    }
    .w3 {
      animation-name: w3;
    } /* 9.60s to 17.95s */
    @keyframes w3 {
      0.00%, 28.79% { opacity: 0; }
      29.24%, 53.82% { opacity: 1; }
      54.27%, 100.00% { opacity: 0; }
    }
    .w4 {
      animation-name: w4;
    } /* 9.60s to 13.02s */
    @keyframes w4 {
      0.00%, 28.79% { opacity: 0; }
      29.24%, 39.04% { opacity: 1; }
      39.49%, 100.00% { opacity: 0; }
    }
    .w5 {
      animation-name: w5;
    } /* 13.02s to 21.87s */
    @keyframes w5 {
      0.00%, 39.04% { opacity: 0; }
      39.49%, 65.58% { opacity: 1; }
      66.03%, 100.00% { opacity: 0; }
    }
    .w6 {
      animation-name: w6;
    } /* 13.02s to 17.95s */
    @keyframes w6 {
      0.00%, 39.04% { opacity: 0; }
      39.49%, 53.82% { opacity: 1; }
      54.27%, 100.00% { opacity: 0; }
    }
    .w7 {
      animation-name: w7;
    } /* 17.95s to end */
    @keyframes w7 {
      0.00%, 53.82% { opacity: 0; }
      54.27%, 97.75% { opacity: 1; }
      98.20%, 100.00% { opacity: 0; }
    }
    .w8 {
      animation-name: w8;
    } /* 21.87s to end */
    @keyframes w8 {
      0.00%, 65.58% { opacity: 0; }
      66.03%, 97.75% { opacity: 1; }
      98.20%, 100.00% { opacity: 0; }
    }
    .w9 {
      animation-name: w9;
    } /* 0.50s to 5.18s */
    @keyframes w9 {
      0.00%, 15.52% { opacity: 1; }
      15.97%, 97.75% { opacity: 0; }
      98.20%, 100.00% { opacity: 1; }
    }
    .w10 {
      animation-name: w10;
    } /* 17.95s to 21.87s */
    @keyframes w10 {
      0.00%, 53.82% { opacity: 0; }
      54.27%, 65.58% { opacity: 1; }
      66.03%, 100.00% { opacity: 0; }
    }
    .w11 {
      animation-name: w11;
    } /* 21.87s to 26.55s */
    @keyframes w11 {
      0.00%, 65.58% { opacity: 0; }
      66.03%, 79.60% { opacity: 1; }
      80.05%, 100.00% { opacity: 0; }
    }
    .w12 {
      animation-name: w12;
    } /* 26.55s to end */
    @keyframes w12 {
      0.00%, 79.60% { opacity: 0; }
      80.05%, 97.75% { opacity: 1; }
      98.20%, 100.00% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .a {
        animation: none;
        opacity: 0;
      }
      .a.fin {
        opacity: 1;
      }
    }
    .mvar {
      font-family: "Times New Roman", Times, "STIX Two Text", serif;
      font-style: italic;
    }
    .title {
      font-weight: 700;
    }
    .b {
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --muted: #aaa;
        --label-load: #ff9a64;
        --label-compute: #82df92;
      }
    }
    /* Typography adapted from ONS chart guidance:
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography
    20px headings, 16px subheadings, 14px labels at native display width.
    Variables compensate for the original graphics coordinate scale. */
    .type-heading {
      font-size: var(--type-heading);
    }
    .type-subheading {
      font-size: var(--type-subheading);
    }

  </style>
  <g transform="scale(0.9473684210526315)">
    <text x="20" y="28" class="title type-heading">What the accessed (A) bits add</text>
    <text x="20" y="48" class="muted">Each row of boxes is one last-level shadow page: 512 entries, not to scale. Gray: filled; white: not yet touched.</text>
    <text x="20" y="64" class="muted">Small box above an entry: its A bit, set by the CPU. ▶: clock hand.</text>
    <text x="24" y="116" class="b type-subheading">Hot page <tspan class="mvar">H</tspan></text>
    <text x="24" y="131" class="muted">created first</text>
    <rect x="140" y="104" width="14" height="26" rx="2" class="full" />
    <rect x="156" y="104" width="14" height="26" rx="2" class="full" />
    <rect x="172" y="104" width="14" height="26" rx="2" class="full" />
    <rect x="188" y="104" width="14" height="26" rx="2" class="full" />
    <rect x="204" y="104" width="14" height="26" rx="2" class="full" />
    <rect x="220" y="104" width="14" height="26" rx="2" class="full" />
    <rect x="236" y="104" width="14" height="26" rx="2" class="full" />
    <rect x="252" y="104" width="14" height="26" rx="2" class="full" />
    <rect x="268" y="104" width="14" height="26" rx="2" class="full" />
    <rect x="284" y="104" width="14" height="26" rx="2" class="full" />
    <rect x="300" y="104" width="14" height="26" rx="2" class="full" />
    <rect x="316" y="104" width="14" height="26" rx="2" class="empty" />
    <rect x="332" y="104" width="14" height="26" rx="2" class="empty" />
    <rect x="348" y="104" width="14" height="26" rx="2" class="empty" />
    <rect x="364" y="104" width="14" height="26" rx="2" class="empty" />
    <rect x="380" y="104" width="14" height="26" rx="2" class="empty" />
    <text x="466" y="122" text-anchor="end" class="muted mono">lru_ref</text>
    <rect x="476" y="104" width="26" height="26" rx="3" class="empty" />
    <text x="489" y="122" text-anchor="middle" class="b type-subheading">0</text>
    <rect x="142" y="93" width="10" height="7" rx="1" class="empty" />
    <rect x="158" y="93" width="10" height="7" rx="1" class="empty" />
    <rect x="174" y="93" width="10" height="7" rx="1" class="empty" />
    <rect x="190" y="93" width="10" height="7" rx="1" class="empty" />
    <rect x="206" y="93" width="10" height="7" rx="1" class="empty" />
    <rect x="222" y="93" width="10" height="7" rx="1" class="empty" />
    <rect x="238" y="93" width="10" height="7" rx="1" class="empty" />
    <rect x="254" y="93" width="10" height="7" rx="1" class="empty" />
    <rect x="270" y="93" width="10" height="7" rx="1" class="empty" />
    <rect x="286" y="93" width="10" height="7" rx="1" class="empty" />
    <rect x="302" y="93" width="10" height="7" rx="1" class="empty" />
    <text x="24" y="190" class="b type-subheading">Cold page <tspan class="mvar">C</tspan></text>
    <text x="24" y="205" class="muted">created second</text>
    <rect x="140" y="178" width="14" height="26" rx="2" class="full" />
    <rect x="156" y="178" width="14" height="26" rx="2" class="full" />
    <rect x="172" y="178" width="14" height="26" rx="2" class="full" />
    <rect x="188" y="178" width="14" height="26" rx="2" class="full" />
    <rect x="204" y="178" width="14" height="26" rx="2" class="empty" />
    <rect x="220" y="178" width="14" height="26" rx="2" class="empty" />
    <rect x="236" y="178" width="14" height="26" rx="2" class="empty" />
    <rect x="252" y="178" width="14" height="26" rx="2" class="empty" />
    <rect x="268" y="178" width="14" height="26" rx="2" class="empty" />
    <rect x="284" y="178" width="14" height="26" rx="2" class="empty" />
    <rect x="300" y="178" width="14" height="26" rx="2" class="empty" />
    <rect x="316" y="178" width="14" height="26" rx="2" class="empty" />
    <rect x="332" y="178" width="14" height="26" rx="2" class="empty" />
    <rect x="348" y="178" width="14" height="26" rx="2" class="empty" />
    <rect x="364" y="178" width="14" height="26" rx="2" class="empty" />
    <rect x="380" y="178" width="14" height="26" rx="2" class="empty" />
    <text x="466" y="196" text-anchor="end" class="muted mono">lru_ref</text>
    <rect x="476" y="178" width="26" height="26" rx="3" class="empty" />
    <text x="489" y="196" text-anchor="middle" class="b type-subheading">0</text>
    <g class="a w1">
      <rect x="142" y="167" width="10" height="7" rx="1" class="empty" />
      <rect x="158" y="167" width="10" height="7" rx="1" class="empty" />
      <rect x="174" y="167" width="10" height="7" rx="1" class="empty" />
      <rect x="190" y="167" width="10" height="7" rx="1" class="empty" />
    </g>
    <rect x="184" y="100" width="22" height="34" rx="4" class="cur a w2" />
    <text x="520" y="122" class="sm a w2">hit: no fault, KVM never sees it</text>
    <rect x="190" y="93" width="10" height="7" rx="1" class="abit a w3" />
    <rect x="186" y="89" width="18" height="15" rx="3" class="okring a w3" />
    <text x="520" y="122" class="oktext a w4">CPU sets the A bit</text>
    <polygon points="6,108 6,126 16,117" style="fill:var(--fg)" class="a w5" />
    <rect x="136" y="86" width="262" height="48" rx="5" class="ring a w6" />
    <text x="520" y="122" class="num a w6">lru_ref 0: check A bits</text>
    <rect x="186" y="89" width="18" height="15" rx="3" class="ring a w7 fin" />
    <rect x="136" y="86" width="262" height="48" rx="5" class="okring a w7 fin" />
    <text x="520" y="122" class="oktext a w7 fin">A bit set: cleared, kept</text>
    <polygon points="6,182 6,200 16,191" style="fill:var(--fg)" class="a w8 fin" />
    <rect x="136" y="160" width="262" height="48" rx="5" class="ring a w8 fin" />
    <g class="a w8 fin">
      <rect x="140" y="178" width="254" height="26" rx="3" class="hot" />
      <text x="267.0" y="196" text-anchor="middle" class="onhot">zapped</text>
    </g>
    <text x="520" y="196" class="num a w8 fin">no A bit set: zapped</text>
    <line x1="20" y1="234" x2="740" y2="234" class="rule" />
    <text x="20" y="262" class="a w9">Both pages have lru_ref 0: the hand cleared them on its last pass.</text>
    <text x="20" y="262" class="a w2">A hit on <tspan class="mvar">H</tspan> uses an existing entry and never reaches KVM.</text>
    <text x="20" y="262" class="a w4">The CPU sets that entry's A bit anyway.</text>
    <text x="20" y="262" class="a w6">The hand reaches <tspan class="mvar">H</tspan>. With lru_ref at 0, the hand checks the A bits.</text>
    <text x="20" y="262" class="a w10">One is set: the hand clears it and keeps <tspan class="mvar">H</tspan>.</text>
    <text x="20" y="262" class="a w11">The hand moves to <tspan class="mvar">C</tspan>. With no A bit set, <tspan class="mvar">C</tspan> is zapped.</text>
    <text x="20" y="262" class="b a w12 fin type-subheading">The A bits catch the hits KVM never sees, so the hot page survives.</text>
  </g>
</svg>
