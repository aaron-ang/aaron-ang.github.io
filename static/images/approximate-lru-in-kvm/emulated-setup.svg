<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 451"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
  role="img"
  aria-label="Animated test setup, built bottom-up: an Arm NVIDIA GB10 workstation runs QEMU in software emulation (TCG) as an x86 AMD EPYC CPU with SVM. The emulated L1 guest runs our modified KVM with KASAN, lockdep and lockup detectors, tdp_mmu=0 and kvm_amd.npt=0, and its L2 guests are KVM selftest VMs and a Redis guest whose page faults fill L1's shadow MMU cache. Fault counts are exact; timings are meaningless."
  width="720"
  height="451"
  data-diagram-width="720"
>
  <style>
    :root {
      --fg: #222;
      --full: #cfcfcf;
      --empty: #ffffff;
      --edge: #999;
      --probe: #d9480f;
      --chip: #f4f4f4;
      --muted: #707071;
      --label-load: #8a2c0a;
      --type-heading: 21.11110929px;
      --type-subheading: 16.88888743px;
      --type-label: 14.77777651px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --full: #555;
        --empty: #1e1e1e;
        --edge: #777;
        --probe: #ff8a4c;
        --chip: #2a2a2a;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .muted {
      fill: var(--muted);
    }
    .full {
      fill: var(--full);
      stroke: var(--edge);
    }
    .empty {
      fill: var(--empty);
      stroke: var(--edge);
    }
    .chip {
      fill: var(--chip);
      stroke: var(--edge);
    }
    .num {
      font-weight: 600;
      fill: var(--label-load);
    }
    .arrow {
      fill: none;
      stroke: var(--probe);
      stroke-width: 2.5;
    }
    .probehead {
      fill: var(--probe);
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    /* 41.98s loop, 7 steps starting at 0.5, 5.3, 11.9, 19.5, 25.4, 31.7, 34.1 s; final frame holds 7.13s, then fades. */
    .a {
      opacity: 0;
      animation: 41.98s linear infinite;
    }
    .w1 {
      animation-name: w1;
    } /* 0.50s to end */
    @keyframes w1 {
      0.00%, 100.00% { opacity: 1; }
    }
    .w2 {
      animation-name: w2;
    } /* 5.30s to end */
    @keyframes w2 {
      0.00%, 12.63% { opacity: 0; }
      12.98%, 98.21% { opacity: 1; }
      98.57%, 100.00% { opacity: 0; }
    }
    .w3 {
      animation-name: w3;
    } /* 11.90s to end */
    @keyframes w3 {
      0.00%, 28.35% { opacity: 0; }
      28.70%, 98.21% { opacity: 1; }
      98.57%, 100.00% { opacity: 0; }
    }
    .w4 {
      animation-name: w4;
    } /* 19.50s to end */
    @keyframes w4 {
      0.00%, 46.45% { opacity: 0; }
      46.81%, 98.21% { opacity: 1; }
      98.57%, 100.00% { opacity: 0; }
    }
    .w5 {
      animation-name: w5;
    } /* 25.40s to end */
    @keyframes w5 {
      0.00%, 60.51% { opacity: 0; }
      60.86%, 98.21% { opacity: 1; }
      98.57%, 100.00% { opacity: 0; }
    }
    .w6 {
      animation-name: w6;
    } /* 31.70s to end */
    @keyframes w6 {
      0.00%, 75.51% { opacity: 0; }
      75.87%, 98.21% { opacity: 1; }
      98.57%, 100.00% { opacity: 0; }
    }
    .w7 {
      animation-name: w7;
    } /* 34.10s to end */
    @keyframes w7 {
      0.00%, 81.23% { opacity: 0; }
      81.59%, 98.21% { opacity: 1; }
      98.57%, 100.00% { opacity: 0; }
    }
    .w8 {
      animation-name: w8;
    } /* 5.30s to 11.90s */
    @keyframes w8 {
      0.00%, 12.63% { opacity: 0; }
      12.98%, 28.35% { opacity: 1; }
      28.70%, 100.00% { opacity: 0; }
    }
    .w9 {
      animation-name: w9;
    } /* 11.90s to 19.50s */
    @keyframes w9 {
      0.00%, 28.35% { opacity: 0; }
      28.70%, 46.45% { opacity: 1; }
      46.81%, 100.00% { opacity: 0; }
    }
    .w10 {
      animation-name: w10;
    } /* 19.50s to 25.40s */
    @keyframes w10 {
      0.00%, 46.45% { opacity: 0; }
      46.81%, 60.51% { opacity: 1; }
      60.86%, 100.00% { opacity: 0; }
    }
    .w11 {
      animation-name: w11;
    } /* 25.40s to 31.70s */
    @keyframes w11 {
      0.00%, 60.51% { opacity: 0; }
      60.86%, 75.51% { opacity: 1; }
      75.87%, 100.00% { opacity: 0; }
    }
    .w12 {
      animation-name: w12;
    } /* 0.50s to 5.30s */
    @keyframes w12 {
      0.00%, 12.63% { opacity: 1; }
      12.98%, 98.21% { opacity: 0; }
      98.57%, 100.00% { opacity: 1; }
    }
    .w13 {
      animation-name: w13;
    } /* 31.70s to 34.10s */
    @keyframes w13 {
      0.00%, 75.51% { opacity: 0; }
      75.87%, 81.23% { opacity: 1; }
      81.59%, 100.00% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .a {
        animation: none;
        opacity: 0;
      }
      .a.fin {
        opacity: 1;
      }
    }
    .title {
      font-weight: 700;
    }
    .b {
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --muted: #aaa;
        --label-load: #ff9a64;
      }
    }
    /* Typography adapted from ONS chart guidance:
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography
    20px headings, 16px subheadings, 14px labels at native display width.
    Variables compensate for the original graphics coordinate scale. */
    .type-heading {
      font-size: var(--type-heading);
    }
    .type-subheading {
      font-size: var(--type-subheading);
    }

  </style>
  <g transform="scale(0.9473684210526315)">
    <text x="20" y="28" class="title type-heading">Test setup: emulated x86 with shadow paging</text>
    <g class="a w1 fin">
      <rect x="20" y="354" width="540" height="70" rx="6" class="chip" />
      <rect x="34" y="368" width="44" height="28" rx="4" class="full" />
      <text x="56" y="387" text-anchor="middle" class="b type-subheading">L0</text>
      <text x="96" y="379" class="b type-subheading">NVIDIA GB10 workstation (Arm CPU)</text>
      <text x="96" y="399" class="muted">no x86 CPU, so no hardware x86 virtualization</text>
    </g>
    <g class="a w2 fin">
      <rect x="20" y="272" width="540" height="70" rx="6" class="chip" />
      <rect x="34" y="286" width="44" height="28" rx="4" class="full" />
      <text x="56" y="305" text-anchor="middle" class="b type-subheading">TCG</text>
      <text x="96" y="297" class="b type-subheading">QEMU in software emulation (TCG)</text>
      <text x="96" y="317" class="muted">emulates an x86 AMD EPYC CPU with SVM</text>
    </g>
    <g class="a w3 fin">
      <rect x="20" y="142" width="540" height="118" rx="6" class="chip" />
      <rect x="34" y="156" width="44" height="28" rx="4" class="full" />
      <text x="56" y="175" text-anchor="middle" class="b type-subheading">L1</text>
      <text x="96" y="167" class="b type-subheading">Emulated x86 guest running our modified KVM</text>
      <text x="96" y="187" class="muted">debug checks on: KASAN, lockdep, lockup detectors</text>
    </g>
    <g class="a w4 fin">
      <rect x="96" y="200" width="360" height="28" rx="4" class="empty" style="stroke:var(--probe)" />
      <text x="106" y="219" class="mono num">tdp_mmu=0, kvm_amd.npt=0</text>
      <text x="96" y="248" class="muted">npt=0: every guest page table is shadowed</text>
    </g>
    <g class="a w5 fin">
      <rect x="20" y="60" width="540" height="70" rx="6" class="chip" />
      <rect x="34" y="74" width="44" height="28" rx="4" class="full" />
      <text x="56" y="93" text-anchor="middle" class="b type-subheading">L2</text>
      <text x="96" y="85" class="b type-subheading">KVM selftest VMs and a Redis guest</text>
      <text x="96" y="105" class="muted">lru_reuse_test, mmu_stress_test, ..., redis-server</text>
    </g>
    <g class="a w6 fin">
      <path d="M 582 100 L 582 176" class="arrow" />
      <polygon points="582.0,186.0 575.4,174.0 588.6,174.0" class="probehead" />
      <text x="596" y="124" class="num">L2's page faults</text>
      <text x="596" y="142" class="num">fill L1's shadow</text>
      <text x="596" y="160" class="num">MMU cache</text>
    </g>
    <g class="a w7 fin">
      <text x="582" y="300" class="b sm">Emulation is slow:</text>
      <text x="582" y="318" class="muted">fault counts are exact,</text>
      <text x="582" y="334" class="muted">timings are meaningless</text>
    </g>
    <text x="20" y="460" class="a w12">An Arm host cannot run x86 KVM directly.</text>
    <text x="20" y="460" class="a w8">SVM lets the emulated CPU run KVM.</text>
    <text x="20" y="460" class="a w9">Debug checks catch memory and locking bugs in our change.</text>
    <text x="20" y="460" class="a w10">This forces the shadow MMU, the code we changed.</text>
    <text x="20" y="460" class="a w11">Selftests check correctness; Redis adds a realistic load.</text>
    <text x="20" y="460" class="a w13">Every L2 fault exercises our change.</text>
    <text x="20" y="460" class="b a w7 fin type-subheading">Every result from this setup is a fault or eviction count.</text>
  </g>
</svg>
