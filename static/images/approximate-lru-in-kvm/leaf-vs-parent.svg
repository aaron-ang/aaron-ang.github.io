<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 345"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
  role="img"
  aria-label="Animated diagram of the two lru_age modes on the same page. A parent page entry points to last-level shadow page sp, and the CPU sets the accessed bit in each entry it walks, at both levels. Leaf mode (lru_age=1) reads and clears the accessed bits of all 512 entries in sp; host reclaim then reads the same leaf bits, finds them clear, and the pages look unused. Run instead, parent mode (lru_age=2) reads and clears only the entry that points to sp, usually one, and the leaf bits stay set; host reclaim finds them set, and the pages look recently used. Only leaf mode clears the bits host reclaim reads."
  width="720"
  height="345"
  data-diagram-width="720"
>
  <style>
    :root {
      --fg: #222;
      --full: #cfcfcf;
      --empty: #ffffff;
      --edge: #999;
      --probe: #d9480f;
      --ok: #2b8a3e;
      --chip: #f4f4f4;
      --muted: #707071;
      --label-load: #8a2c0a;
      --label-compute: #237a36;
      --type-heading: 21.11110929px;
      --type-subheading: 16.88888743px;
      --type-label: 14.77777651px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --full: #555;
        --empty: #1e1e1e;
        --edge: #777;
        --probe: #ff8a4c;
        --ok: #69db7c;
        --chip: #2a2a2a;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .muted {
      fill: var(--muted);
    }
    .full {
      fill: var(--full);
      stroke: var(--edge);
    }
    .empty {
      fill: var(--empty);
      stroke: var(--edge);
    }
    .chip {
      fill: var(--chip);
      stroke: var(--edge);
    }
    .ring {
      fill: none;
      stroke: var(--probe);
      stroke-width: 3;
    }
    .okring {
      fill: none;
      stroke: var(--ok);
      stroke-width: 3;
    }
    .abit {
      fill: var(--ok);
      stroke: var(--ok);
    }
    .num {
      font-weight: 600;
      fill: var(--label-load);
    }
    .oktext {
      font-weight: 600;
      fill: var(--label-compute);
    }
    .link {
      fill: none;
      stroke: var(--edge);
      stroke-width: 2;
    }
    .linkhead {
      fill: var(--edge);
    }
    .rule {
      stroke: var(--edge);
      stroke-dasharray: 3 4;
    }
    /* 36.91s loop, 6 steps starting at 0.5, 6.0, 11.6, 17.6, 24.4, 30.2 s; final frame holds 6.0s, then fades.
       Steps 1-3 follow leaf mode; steps 4-6 rerun the same page under parent mode. */
    .a {
      opacity: 0;
      animation: 36.91s linear infinite;
    }
    .leafbits {
      animation-name: leafbits;
    } /* steps 1,4,5,6 */
    @keyframes leafbits {
      0.00%, 16.34% { opacity: 1; }
      16.74%, 47.66% { opacity: 0; }
      48.06%, 100.00% { opacity: 1; }
    }
    .parentbit {
      animation-name: parentbit;
    } /* steps 1,2,3 */
    @keyframes parentbit {
      0.00%, 47.66% { opacity: 1; }
      48.06%, 97.97% { opacity: 0; }
      98.37%, 100.00% { opacity: 1; }
    }
    .leafmode {
      animation-name: leafmode;
    } /* steps 2,3 */
    @keyframes leafmode {
      0.00%, 16.34% { opacity: 0; }
      16.74%, 47.66% { opacity: 1; }
      48.06%, 100.00% { opacity: 0; }
    }
    .parentmode {
      animation-name: parentmode;
    } /* steps 4,5,6 */
    @keyframes parentmode {
      0.00%, 47.66% { opacity: 0; }
      48.06%, 97.97% { opacity: 1; }
      98.37%, 100.00% { opacity: 0; }
    }
    .reclaim {
      animation-name: reclaim;
    } /* steps 3,4,5,6 */
    @keyframes reclaim {
      0.00%, 31.32% { opacity: 0; }
      31.73%, 97.97% { opacity: 1; }
      98.37%, 100.00% { opacity: 0; }
    }
    .reclaimclear {
      animation-name: reclaimclear;
    } /* steps 3 */
    @keyframes reclaimclear {
      0.00%, 31.32% { opacity: 0; }
      31.73%, 47.66% { opacity: 1; }
      48.06%, 100.00% { opacity: 0; }
    }
    .reclaimset {
      animation-name: reclaimset;
    } /* steps 5,6 */
    @keyframes reclaimset {
      0.00%, 66.05% { opacity: 0; }
      66.46%, 97.97% { opacity: 1; }
      98.37%, 100.00% { opacity: 0; }
    }
    .cap1 {
      animation-name: cap1;
    } /* steps 1 */
    @keyframes cap1 {
      0.00%, 16.34% { opacity: 1; }
      16.74%, 97.97% { opacity: 0; }
      98.37%, 100.00% { opacity: 1; }
    }
    .cap2 {
      animation-name: cap2;
    } /* steps 2 */
    @keyframes cap2 {
      0.00%, 16.34% { opacity: 0; }
      16.74%, 31.32% { opacity: 1; }
      31.73%, 100.00% { opacity: 0; }
    }
    .cap3 {
      animation-name: cap3;
    } /* steps 3 */
    @keyframes cap3 {
      0.00%, 31.32% { opacity: 0; }
      31.73%, 47.66% { opacity: 1; }
      48.06%, 100.00% { opacity: 0; }
    }
    .cap4 {
      animation-name: cap4;
    } /* steps 4 */
    @keyframes cap4 {
      0.00%, 47.66% { opacity: 0; }
      48.06%, 66.05% { opacity: 1; }
      66.46%, 100.00% { opacity: 0; }
    }
    .cap5 {
      animation-name: cap5;
    } /* steps 5 */
    @keyframes cap5 {
      0.00%, 66.05% { opacity: 0; }
      66.46%, 81.71% { opacity: 1; }
      82.12%, 100.00% { opacity: 0; }
    }
    .cap6 {
      animation-name: cap6;
    } /* steps 6 */
    @keyframes cap6 {
      0.00%, 81.71% { opacity: 0; }
      82.12%, 97.97% { opacity: 1; }
      98.37%, 100.00% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .a {
        animation: none;
        opacity: 0;
      }
      .a.fin {
        opacity: 1;
      }
    }
    .title {
      font-weight: 700;
    }
    .b {
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --muted: #aaa;
        --label-load: #ff9a64;
        --label-compute: #82df92;
      }
    }
    /* Typography adapted from ONS chart guidance:
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography
    20px headings, 16px subheadings, 14px labels at native display width.
    Variables compensate for the original graphics coordinate scale. */
    .type-heading {
      font-size: var(--type-heading);
    }
    .type-subheading {
      font-size: var(--type-subheading);
    }

  </style>
  <g transform="scale(0.9473684210526315)">
    <text x="20" y="28" class="title type-heading">Which accessed (A) bits each lru_age mode reads</text>
    <text x="20" y="48" class="muted">Each row shows part of a shadow page (512 entries).</text>
    <g aria-label="Diagram key">
      <rect x="540" y="38" width="10" height="7" rx="1" class="empty" />
      <text x="558" y="48" class="muted">A bit</text>
    </g>
    <text x="24" y="108" class="b type-subheading">parent page</text>
    <text x="24" y="123" class="muted">points to sp</text>
    <rect x="140" y="96" width="14" height="26" rx="2" class="full" />
    <rect x="156" y="96" width="14" height="26" rx="2" class="full" />
    <rect x="172" y="96" width="14" height="26" rx="2" class="full" />
    <rect x="188" y="96" width="14" height="26" rx="2" class="full" />
    <rect x="204" y="96" width="14" height="26" rx="2" class="full" />
    <rect x="220" y="96" width="14" height="26" rx="2" class="full" />
    <rect x="236" y="96" width="14" height="26" rx="2" class="full" />
    <rect x="252" y="96" width="14" height="26" rx="2" class="empty" />
    <rect x="268" y="96" width="14" height="26" rx="2" class="empty" />
    <rect x="284" y="96" width="14" height="26" rx="2" class="empty" />
    <rect x="300" y="96" width="14" height="26" rx="2" class="empty" />
    <rect x="316" y="96" width="14" height="26" rx="2" class="empty" />
    <rect x="332" y="96" width="14" height="26" rx="2" class="empty" />
    <rect x="348" y="96" width="14" height="26" rx="2" class="empty" />
    <rect x="364" y="96" width="14" height="26" rx="2" class="empty" />
    <g class="muted" aria-label="Additional entries">
      <circle cx="382" cy="109" r="1.5" />
      <circle cx="387" cy="109" r="1.5" />
      <circle cx="392" cy="109" r="1.5" />
    </g>
    <rect x="142" y="85" width="10" height="7" rx="1" class="empty" />
    <rect x="158" y="85" width="10" height="7" rx="1" class="empty" />
    <rect x="174" y="85" width="10" height="7" rx="1" class="empty" />
    <rect x="190" y="85" width="10" height="7" rx="1" class="empty" />
    <rect x="206" y="85" width="10" height="7" rx="1" class="empty" />
    <rect x="222" y="85" width="10" height="7" rx="1" class="empty" />
    <rect x="238" y="85" width="10" height="7" rx="1" class="empty" />
    <text x="24" y="198" class="b type-subheading">page sp</text>
    <text x="24" y="213" class="muted">last level</text>
    <rect x="140" y="186" width="14" height="26" rx="2" class="full" />
    <rect x="156" y="186" width="14" height="26" rx="2" class="full" />
    <rect x="172" y="186" width="14" height="26" rx="2" class="full" />
    <rect x="188" y="186" width="14" height="26" rx="2" class="full" />
    <rect x="204" y="186" width="14" height="26" rx="2" class="full" />
    <rect x="220" y="186" width="14" height="26" rx="2" class="full" />
    <rect x="236" y="186" width="14" height="26" rx="2" class="full" />
    <rect x="252" y="186" width="14" height="26" rx="2" class="full" />
    <rect x="268" y="186" width="14" height="26" rx="2" class="full" />
    <rect x="284" y="186" width="14" height="26" rx="2" class="full" />
    <rect x="300" y="186" width="14" height="26" rx="2" class="full" />
    <rect x="316" y="186" width="14" height="26" rx="2" class="full" />
    <rect x="332" y="186" width="14" height="26" rx="2" class="empty" />
    <rect x="348" y="186" width="14" height="26" rx="2" class="empty" />
    <rect x="364" y="186" width="14" height="26" rx="2" class="empty" />
    <g class="muted" aria-label="Additional entries">
      <circle cx="382" cy="199" r="1.5" />
      <circle cx="387" cy="199" r="1.5" />
      <circle cx="392" cy="199" r="1.5" />
    </g>
    <rect x="142" y="175" width="10" height="7" rx="1" class="empty" />
    <rect x="158" y="175" width="10" height="7" rx="1" class="empty" />
    <rect x="174" y="175" width="10" height="7" rx="1" class="empty" />
    <rect x="190" y="175" width="10" height="7" rx="1" class="empty" />
    <rect x="206" y="175" width="10" height="7" rx="1" class="empty" />
    <rect x="222" y="175" width="10" height="7" rx="1" class="empty" />
    <rect x="238" y="175" width="10" height="7" rx="1" class="empty" />
    <rect x="254" y="175" width="10" height="7" rx="1" class="empty" />
    <rect x="270" y="175" width="10" height="7" rx="1" class="empty" />
    <rect x="286" y="175" width="10" height="7" rx="1" class="empty" />
    <rect x="302" y="175" width="10" height="7" rx="1" class="empty" />
    <rect x="318" y="175" width="10" height="7" rx="1" class="empty" />
    <!-- The parent entry holds sp's base address, so the link ends at the start of the whole page, not at one entry. -->
    <path d="M 227.0 122 L 227.0 146 L 122 146 L 122 199 L 127 199" class="link" />
    <polygon points="134,199 125,194 125,204" class="linkhead" />
    <rect x="222" y="85" width="10" height="7" rx="1" class="abit a parentbit" />
    <rect x="158" y="175" width="10" height="7" rx="1" class="abit a leafbits fin" />
    <rect x="206" y="175" width="10" height="7" rx="1" class="abit a leafbits fin" />
    <rect x="222" y="175" width="10" height="7" rx="1" class="abit a leafbits fin" />
    <rect x="270" y="175" width="10" height="7" rx="1" class="abit a leafbits fin" />
    <rect x="302" y="175" width="10" height="7" rx="1" class="abit a leafbits fin" />
    <rect x="136" y="168" width="262" height="48" rx="5" class="ring a leafmode" />
    <text x="520" y="198" class="num a leafmode">leaf mode (lru_age=1)</text>
    <text x="520" y="213" class="muted a leafmode">reads and clears all 512 A bits</text>
    <rect x="216" y="78" width="22" height="48" rx="5" class="okring a parentmode fin" />
    <text x="520" y="108" class="oktext a parentmode fin">parent mode (lru_age=2)</text>
    <text x="520" y="123" class="muted a parentmode fin">reads and clears 1 A bit, usually</text>
    <g class="a reclaim fin">
      <rect x="136" y="262" width="150" height="34" rx="6" class="chip" />
      <text x="211.0" y="284" text-anchor="middle" class="b sm">host reclaim</text>
      <path d="M 286 279.0 L 326 279.0 L 326 224" class="link" />
      <polygon points="326,218 321,227 331,227" class="linkhead" />
    </g>
    <text x="338" y="284" class="num a reclaimclear">finds them clear: pages look unused</text>
    <text x="338" y="284" class="oktext a reclaimset fin">finds them set: pages look recently used</text>
    <line x1="20" y1="318" x2="740" y2="318" class="rule" />
    <text x="20" y="346" class="a cap1">The CPU sets the A bit in each entry it walks, at both levels.</text>
    <text x="20" y="346" class="a cap2">Leaf mode reads and clears the A bits of all 512 entries in sp.</text>
    <text x="20" y="346" class="a cap3">Host reclaim reads the same leaf A bits, finds them clear, and the pages look unused.</text>
    <text x="20" y="346" class="a cap4">Run instead, parent mode reads and clears only the entry that points to sp; the leaf bits stay set.</text>
    <text x="20" y="346" class="a cap5">Host reclaim finds the leaf A bits still set, and the pages look recently used.</text>
    <text x="20" y="346" class="b a cap6 fin type-subheading">Only leaf mode clears the bits host reclaim reads; parent mode leaves them set.</text>
  </g>
</svg>
