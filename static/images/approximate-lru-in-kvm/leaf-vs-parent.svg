  <rect x="136" y="168" width="262" height="48" rx="5" class="ring a w2 fin"/>
  <text x="520" y="198" class="num a w2 fin">leaf mode (lru_age=1)</text>
  <text x="520" y="213" class="muted a w3">reads all 512 A bits</text>
  <rect x="216" y="78" width="22" height="48" rx="5" class="okring a w4 fin"/>
  <text x="520" y="108" class="oktext a w4 fin">parent mode (lru_age=2)</text>
  <text x="520" y="123" class="muted a w4 fin">reads 1 A bit, usually</text>
  <g class="a w5 fin">
  <rect x="136" y="262" width="150" height="34" rx="6" class="chip"/>
  <text x="211.0" y="284" text-anchor="middle" class="b sm">host reclaim</text>
  <path d="M 286 279.0 L 326 279.0 L 326 224" class="link"/>
  <polygon points="326,218 321,227 331,227" class="linkhead"/>
  </g>
  <text x="338" y="284" class="sm a w6">reads the same leaf A bits</text>
  <text x="520" y="213" class="muted a w7 fin">reads and clears all 512 A bits</text>
  <text x="338" y="284" class="num a w7 fin">finds them cleared: pages look unused</text>
  <line x1="20" y1="318" x2="740" y2="318" class="rule"/>
  <text x="20" y="346" class="a w8">The CPU sets the A bit in each entry it walks, at both levels.</text>
  <text x="20" y="346" class="a w9">Leaf mode reads the A bits of all 512 entries in sp.</text>
  <text x="20" y="346" class="a w10">Parent mode reads only the entry that points to sp, usually one.</text>
  <text x="20" y="346" class="a w6">Host reclaim reads the same leaf A bits to pick memory to free.</text>
  <text x="20" y="346" class="a w11">After leaf mode clears those bits, host reclaim sees the pages as unused.</text>
  <text x="20" y="346" class="b a w12 fin">Parent mode reads one bit per page and leaves the leaf bits to host reclaim.</text>
</svg>
