    <path d="M 227.0 122 L 227.0 164" class="link" />
    <polygon points="227.0,170 222.0,161 232.0,161" class="linkhead" />
    <rect x="222" y="85" width="10" height="7" rx="1" class="abit" />
    <rect x="158" y="175" width="10" height="7" rx="1" class="abit a w1" />
    <rect x="206" y="175" width="10" height="7" rx="1" class="abit a w1" />
