<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated diagram of the two lru_age modes. A parent page entry points to last-level shadow page sp, and the CPU sets the accessed bit in each entry it walks, at both levels. Leaf mode (lru_age=1) reads the accessed bits of all 512 entries in sp. Parent mode (lru_age=2) reads only the entry that points to sp, usually one. Host reclaim reads the same leaf accessed bits; after leaf mode clears them, host reclaim finds them cleared and the pages look unused. Parent mode leaves the leaf bits to host reclaim.">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --chip: #f4f4f4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --chip: #2a2a2a; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .b { font-weight: 600; }
    .sm { font-size: 13px; }
    .full { fill: var(--full); stroke: var(--edge); }
    .empty { fill: var(--empty); stroke: var(--edge); }
    .chip { fill: var(--chip); stroke: var(--edge); }
    .ring { fill: none; stroke: var(--probe); stroke-width: 3; }
    .okring { fill: none; stroke: var(--ok); stroke-width: 3; }
    .cur { fill: none; stroke: var(--fg); stroke-width: 2.5; }
    .hot { fill: var(--probe); }
    .abit { fill: var(--ok); stroke: var(--ok); }
    .num { fill: var(--probe); font-weight: 600; font-size: 13px; }
    .oktext { fill: var(--ok); font-weight: 600; font-size: 13px; }
    .onhot { fill: var(--empty); font-weight: 600; }
    .link { fill: none; stroke: var(--edge); stroke-width: 2; }
    .linkhead { fill: var(--edge); }
    .rule { stroke: var(--edge); stroke-dasharray: 3 4; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    /* 30.43s loop, 6 steps starting at 0.5, 5.4, 9.9, 14.3, 19.0, 23.6 s; final frame holds 6.0s, then fades. */
    .a { opacity: 0; animation: 30.43s linear infinite; }
    .w1 { animation-name: w1; }  /* 0.50s to 18.96s */
    @keyframes w1 { 0.00%, 62.30% { opacity: 1 } 62.79%, 97.54% { opacity: 0 } 98.03%, 100.00% { opacity: 1 } }
    .w2 { animation-name: w2; }  /* 5.43s to end */
    @keyframes w2 { 0.00%, 17.84% { opacity: 0 } 18.34%, 97.54% { opacity: 1 } 98.03%, 100.00% { opacity: 0 } }
    .w3 { animation-name: w3; }  /* 5.43s to 18.96s */
    @keyframes w3 { 0.00%, 17.84% { opacity: 0 } 18.34%, 62.30% { opacity: 1 } 62.79%, 100.00% { opacity: 0 } }
    .w4 { animation-name: w4; }  /* 9.85s to end */
    @keyframes w4 { 0.00%, 32.38% { opacity: 0 } 32.88%, 97.54% { opacity: 1 } 98.03%, 100.00% { opacity: 0 } }
    .w5 { animation-name: w5; }  /* 14.28s to end */
    @keyframes w5 { 0.00%, 46.93% { opacity: 0 } 47.42%, 97.54% { opacity: 1 } 98.03%, 100.00% { opacity: 0 } }
    .w6 { animation-name: w6; }  /* 14.28s to 18.96s */
    @keyframes w6 { 0.00%, 46.93% { opacity: 0 } 47.42%, 62.30% { opacity: 1 } 62.79%, 100.00% { opacity: 0 } }
    .w7 { animation-name: w7; }  /* 18.96s to end */
    @keyframes w7 { 0.00%, 62.30% { opacity: 0 } 62.79%, 97.54% { opacity: 1 } 98.03%, 100.00% { opacity: 0 } }
    .w8 { animation-name: w8; }  /* 0.50s to 5.43s */
    @keyframes w8 { 0.00%, 17.84% { opacity: 1 } 18.34%, 97.54% { opacity: 0 } 98.03%, 100.00% { opacity: 1 } }
    .w9 { animation-name: w9; }  /* 5.43s to 9.85s */
    @keyframes w9 { 0.00%, 17.84% { opacity: 0 } 18.34%, 32.38% { opacity: 1 } 32.88%, 100.00% { opacity: 0 } }
    .w10 { animation-name: w10; }  /* 9.85s to 14.28s */
    @keyframes w10 { 0.00%, 32.38% { opacity: 0 } 32.88%, 46.93% { opacity: 1 } 47.42%, 100.00% { opacity: 0 } }
    .w11 { animation-name: w11; }  /* 18.96s to 23.63s */
    @keyframes w11 { 0.00%, 62.30% { opacity: 0 } 62.79%, 77.67% { opacity: 1 } 78.16%, 100.00% { opacity: 0 } }
    .w12 { animation-name: w12; }  /* 23.63s to end */
    @keyframes w12 { 0.00%, 77.67% { opacity: 0 } 78.16%, 97.54% { opacity: 1 } 98.03%, 100.00% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; opacity: 0; }
      .a.fin { opacity: 1; }
    }
    .mvar { font-family: 'Times New Roman', Times, 'STIX Two Text', serif; font-style: italic; font-size: 1.1em; }
  </style>
  <text x="20" y="28" class="title">Which accessed (A) bits each lru_age mode reads</text>
  <text x="20" y="48" class="muted">Each row of boxes is one shadow page: 512 entries, not to scale. Small box above an entry: its A bit.</text>
  <text x="24" y="108" class="b">parent page</text>
  <text x="24" y="123" class="muted">points to sp</text>
