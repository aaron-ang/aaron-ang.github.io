<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated comparison of what sets lru_ref, shown as two panels that run in step. A hot page H, created first, and a cold page C each map one 2 MiB region. Creation sets both bits, and the clock hand clears them. H keeps being used, but most accesses are hits KVM never sees; a first touch faults and fills an entry. (a) Marked only on creation, H's bit stays 0, and when the hand returns it zaps the older H. (b) Marked on fill too, the fill sets H's bit again, so the hand keeps H and zaps cold C.">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --chip: #f4f4f4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --chip: #2a2a2a; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .b { font-weight: 600; }
    .sm { font-size: 13px; }
    .full { fill: var(--full); stroke: var(--edge); }
    .empty { fill: var(--empty); stroke: var(--edge); }
    .ring { fill: none; stroke: var(--probe); stroke-width: 3; }
    .okring { fill: none; stroke: var(--ok); stroke-width: 3; }
    .cur { fill: none; stroke: var(--fg); stroke-width: 2.5; }
    .hot { fill: var(--probe); }
    .new { fill: var(--ok); stroke: var(--edge); }
    .num { fill: var(--probe); font-weight: 600; font-size: 13px; }
    .oktext { fill: var(--ok); font-weight: 600; font-size: 13px; }
    .onhot { fill: var(--empty); font-weight: 600; }
    .rule { stroke: var(--edge); stroke-dasharray: 3 4; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    /* 43.6s loop, 10 steps starting at 0.5, 5.2, 8.6, 12.8, 15.9, 19.9, 24.8, 28.7, 32.6, 36.8 s; final frame holds 6.0s, then fades. */
    .a { opacity: 0; animation: 43.6s linear infinite; }
    .w1 { animation-name: w1; }  /* 5.18s to 8.59s */
    @keyframes w1 { 0.00%, 11.87% { opacity: 0 } 12.22%, 19.71% { opacity: 1 } 20.06%, 100.00% { opacity: 0 } }
    .w2 { animation-name: w2; }  /* 5.18s to 12.77s */
    @keyframes w2 { 0.00%, 11.87% { opacity: 0 } 12.22%, 29.28% { opacity: 1 } 29.63%, 100.00% { opacity: 0 } }
    .w3 { animation-name: w3; }  /* 8.59s to 15.93s */
