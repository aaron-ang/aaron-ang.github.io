  <text x="520" y="118" class="num a w14 fin">bit 0: zapped, though hot</text>
  <text x="300" y="86" class="num a w14 fin"><tspan class="mvar">H</tspan> and <tspan class="mvar">C</tspan> look alike: FIFO order</text>
  <text x="20" y="216" class="sm b">(b) marked on fill too</text>
  <text x="24" y="242" class="b">Hot page <tspan class="mvar">H</tspan></text>
  <text x="24" y="257" class="muted">created first</text>
  <rect x="140" y="230" width="14" height="26" rx="2" class="full"/>
