  <text x="300" y="216" class="oktext a w17 fin">cold <tspan class="mvar">C</tspan> zapped, hot <tspan class="mvar">H</tspan> kept</text>
  <line x1="20" y1="196" x2="740" y2="196" class="rule"/>
  <text x="20" y="346" class="a w18"><tspan class="mvar">H</tspan> and <tspan class="mvar">C</tspan> each map one 2 MiB region. <tspan class="mvar">H</tspan> was created first.</text>
  <text x="20" y="346" class="a w1">Creating a page sets its lru_ref to 1.</text>
  <text x="20" y="346" class="a w4">The hand clears <tspan class="mvar">H</tspan>'s bit and skips it: a second chance.</text>
  <text x="20" y="346" class="a w5">Then it does the same for <tspan class="mvar">C</tspan>.</text>
  <text x="20" y="346" class="a w8">Most of <tspan class="mvar">H</tspan>'s accesses are hits, which KVM never sees.</text>
  <text x="20" y="346" class="a w11">A first touch of a 4 KiB page faults, and KVM fills an entry.</text>
  <text x="20" y="346" class="a w12">Only (b) marks the page when it fills an entry.</text>
  <text x="20" y="346" class="a w13">The hand returns to <tspan class="mvar">H</tspan> first, since <tspan class="mvar">H</tspan> is older.</text>
  <text x="20" y="346" class="a w19">In (b), the hand moves on and zaps cold <tspan class="mvar">C</tspan> instead.</text>
  <text x="20" y="346" class="b a w20 fin">Marking on creation can't tell hot from cold; marking on fill can.</text>
</svg>
