    .w4 { animation-name: w4; }  /* 8.59s to 12.77s */
    @keyframes w4 { 0.00%, 19.71% { opacity: 0 } 20.06%, 29.28% { opacity: 1 } 29.63%, 100.00% { opacity: 0 } }
    .w5 { animation-name: w5; }  /* 12.77s to 15.93s */
    @keyframes w5 { 0.00%, 29.28% { opacity: 0 } 29.63%, 36.54% { opacity: 1 } 36.89%, 100.00% { opacity: 0 } }
    .w6 { animation-name: w6; }  /* 12.77s to end */
    @keyframes w6 { 0.00%, 29.28% { opacity: 0 } 29.63%, 98.28% { opacity: 1 } 98.62%, 100.00% { opacity: 0 } }
    .w7 { animation-name: w7; }  /* 8.59s to end */
    @keyframes w7 { 0.00%, 19.71% { opacity: 0 } 20.06%, 98.28% { opacity: 1 } 98.62%, 100.00% { opacity: 0 } }
    .w8 { animation-name: w8; }  /* 15.93s to 19.85s */
    @keyframes w8 { 0.00%, 36.54% { opacity: 0 } 36.89%, 45.53% { opacity: 1 } 45.88%, 100.00% { opacity: 0 } }
    .w9 { animation-name: w9; }  /* 19.85s to end */
    @keyframes w9 { 0.00%, 45.53% { opacity: 0 } 45.88%, 98.28% { opacity: 1 } 98.62%, 100.00% { opacity: 0 } }
    .w10 { animation-name: w10; }  /* 19.85s to 28.70s */
    @keyframes w10 { 0.00%, 45.53% { opacity: 0 } 45.88%, 65.83% { opacity: 1 } 66.18%, 100.00% { opacity: 0 } }
