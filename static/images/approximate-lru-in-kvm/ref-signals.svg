    .w18 { animation-name: w18; }  /* 0.50s to 5.18s */
    @keyframes w18 { 0.00%, 11.87% { opacity: 1 } 12.22%, 98.28% { opacity: 0 } 98.62%, 100.00% { opacity: 1 } }
    .w19 { animation-name: w19; }  /* 32.62s to 36.80s */
    @keyframes w19 { 0.00%, 74.83% { opacity: 0 } 75.17%, 84.40% { opacity: 1 } 84.74%, 100.00% { opacity: 0 } }
    .w20 { animation-name: w20; }  /* 36.80s to end */
    @keyframes w20 { 0.00%, 84.40% { opacity: 0 } 84.74%, 98.28% { opacity: 1 } 98.62%, 100.00% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; opacity: 0; }
      .a.fin { opacity: 1; }
    }
    .mvar { font-family: 'Times New Roman', Times, 'STIX Two Text', serif; font-style: italic; font-size: 1.1em; }
