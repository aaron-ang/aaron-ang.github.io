    .w14 { animation-name: w14; }  /* 28.70s to end */
    @keyframes w14 { 0.00%, 65.83% { opacity: 0 } 66.18%, 98.28% { opacity: 1 } 98.62%, 100.00% { opacity: 0 } }
    .w15 { animation-name: w15; }  /* 12.77s to 32.62s */
    @keyframes w15 { 0.00%, 29.28% { opacity: 0 } 29.63%, 74.83% { opacity: 1 } 75.17%, 100.00% { opacity: 0 } }
    .w16 { animation-name: w16; }  /* 8.59s to 24.78s */
    @keyframes w16 { 0.00%, 19.71% { opacity: 0 } 20.06%, 56.84% { opacity: 1 } 57.18%, 100.00% { opacity: 0 } }
    .w17 { animation-name: w17; }  /* 32.62s to end */
