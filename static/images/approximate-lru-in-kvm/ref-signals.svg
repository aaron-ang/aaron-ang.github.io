  <text x="20" y="28" class="title">What sets lru_ref, and when</text>
  <text x="20" y="48" class="muted">Each row of boxes is one last-level shadow page: 512 entries, not to scale. Gray: filled; white: not yet touched; ▶: clock hand.</text>
  <text x="20" y="86" class="sm b">(a) marked on creation only</text>
