    <text x="60" y="204" class="oktext a w16">every page marked since the last lap</text>
    <text x="60" y="204" class="num a w17 fin">lap 1: clear each bit, zap nothing</text>
    <text x="60" y="224" class="num a w28 fin">lap 2, same call: zap from the tail, oldest first</text>
    <text x="20" y="260" class="a w1">Pages are marked on creation and when KVM installs a mapping.</text>
    <text x="20" y="260" class="a w16">With so few pages, the guest touches all of them between evictions.</text>
    <text x="20" y="260" class="a w25">One eviction call: lap 1 clears, then it keeps going.</text>
    <text x="20" y="260" class="a w26">Faults wait for mmu_lock, so no install re-marks a page between laps.</text>
    <text x="20" y="260" class="b a w29 fin type-subheading">When every page looks recently used, CLOCK zaps in FIFO order.</text>
