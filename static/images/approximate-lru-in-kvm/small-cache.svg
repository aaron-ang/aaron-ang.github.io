      animation-name: w1;
    } /* 0.50s to 7.20s */
    @keyframes w1 {
      0.00%, 14.01% { opacity: 1; }
      14.31%, 98.54% { opacity: 0; }
      98.83%, 100.00% { opacity: 1; }
    }
    .w2 {
      animation-name: w2;
    } /* 7.20s to 33.30s */
