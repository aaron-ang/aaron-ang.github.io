<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 264"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
  role="img"
  aria-label="Animated CLOCK sweep with a 32-page cache, pages marked on creation or on install. Every page is marked again between evictions, so in one eviction call the hand clears every bit on the first lap without zapping, then keeps going and zaps from the tail in FIFO order."
  width="720"
  height="264"
  data-diagram-width="720"
>
  <style>
    :root {
      --fg: #222;
      --full: #cfcfcf;
      --empty: #ffffff;
      --edge: #999;
      --probe: #d9480f;
      --ok: #2b8a3e;
      --muted: #707071;
      --label-load: #8a2c0a;
      --label-compute: #237a36;
      --type-heading: 21.11110929px;
      --type-subheading: 16.88888743px;
      --type-label: 14.77777651px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --full: #555;
        --empty: #1e1e1e;
        --edge: #777;
        --probe: #ff8a4c;
        --ok: #69db7c;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .muted {
      fill: var(--muted);
    }
    .full {
      fill: var(--full);
      stroke: var(--edge);
    }
    .empty {
      fill: var(--empty);
      stroke: var(--edge);
    }
    .ring {
      fill: none;
      stroke: var(--probe);
      stroke-width: 3;
    }
    .okring {
      fill: none;
      stroke: var(--ok);
      stroke-width: 3;
    }
    .hot {
      fill: var(--probe);
    }
    .num {
      font-weight: 600;
      fill: var(--label-load);
    }
    .oktext {
      font-weight: 600;
      fill: var(--label-compute);
    }
    .onhot {
      fill: var(--empty);
      font-weight: 600;
    }
