<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 586"
  width="280"
  height="586"
  role="img"
  aria-labelledby="title desc"
  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
>
  <title id="title">Nested virtualization</title>
  <desc id="desc">L0 is AWS c5n.metal, a bare-metal host. L1 is a QEMU guest running modified KVM, with shadow paging and a small cache. L2 runs Redis; its faults reach the modified KVM in L1.</desc>
  <style>
    /* ONS chart typography: 20px title, 16px subheading, 14px labels/annotations.
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography */
    :root {
      --fg: #222;
      --muted: #707071;
      --edge: #999;
      --chip: #f5f5f5;
      --type-heading: 20px;
      --type-subheading: 16px;
      --type-label: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --muted: #aaa;
        --edge: #888;
        --chip: #292929;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .title {
      font-weight: 700;
    }
    .sub {
      font-weight: 600;
    }
    .note {
      fill: var(--muted);
    }
    .box {
      fill: var(--chip);
      stroke: var(--edge);
    }
    .arrow {
      stroke: var(--fg);
      fill: none;
      stroke-width: 1.5;
    }
    /* Typography adapted from ONS chart guidance:
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography
    20px headings, 16px subheadings, 14px labels at native display width.
    Variables compensate for the original graphics coordinate scale. */
    .type-heading {
      font-size: var(--type-heading);
    }
    .type-subheading {
      font-size: var(--type-subheading);
    }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="var(--fg)" />
    </marker>
  </defs>
  <text x="12" y="26" class="title type-heading">Nested virtualization</text>
  <rect x="12" y="60" width="256" height="81" rx="2" class="box" />
  <text x="24" y="85" class="sub type-subheading">L2: Redis guest</text>
  <text x="24" y="107" class="">redis-server driven by</text>
  <text x="24" y="127" class="">redis-benchmark</text>
  <line x1="250" y1="141" x2="250" y2="175" class="arrow" marker-end="url(#arrow)" />
  <text x="12" y="165" class="">Page faults reach L1’s KVM.</text>
  <rect x="12" y="185" width="256" height="220" rx="2" class="box" />
  <text x="24" y="210" class="sub type-subheading">L1: modified KVM</text>
  <text x="24" y="234" class="">QEMU guest; kselftests:</text>
  <text x="24" y="254" class="">mmu_stress_test</text>
  <text x="24" y="274" class="">demand_paging_test</text>
  <text x="24" y="294" class="">tdp_mmu=0</text>
  <text x="24" y="314" class="">min_alloc_pages=32</text>
  <text x="24" y="334" class="">lru_mmu=0: upstream FIFO</text>
  <text x="24" y="354" class="">lru_mmu=1: CLOCK</text>
  <line x1="140" y1="405" x2="140" y2="435" class="arrow" marker-end="url(#arrow)" />
  <rect x="12" y="445" width="256" height="80" rx="2" class="box" />
  <text x="24" y="470" class="sub type-subheading">L0: AWS c5n.metal</text>
  <text x="24" y="493" class="">Bare-metal host; hardware</text>
  <text x="24" y="513" class="">virtualization available to L1.</text>
  <text x="12" y="555" class="note">L2’s faults exercise the</text>
  <text x="12" y="575" class="note">KVM code we changed.</text>
</svg>
