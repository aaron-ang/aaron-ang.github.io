<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 284"
  role="img"
  aria-labelledby="title desc"
  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
  width="640"
  height="284"
  data-diagram-width="640"
>
  <title id="title">Wider loads move the same row with fewer instructions</title>
  <desc id="desc">A 32-float row uses 32 scalar global-load instructions or eight float4 instructions. Both transfer the same 128 bytes.</desc>
  <style>
    :root {
      --fg: #222;
      --muted: #656565;
      --edge: #999;
      --load: #b83c0b;
      --compute: #237a36;
      --type-heading: 20px;
      --type-subheading: 16px;
      --type-label: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --muted: #aaa;
        --edge: #888;
        --load: #ff9a64;
        --compute: #82df92;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .small {
      fill: var(--muted);
    }
    .outline {
      fill: none;
      stroke: var(--edge);
    }
    .loadbox {
      fill: var(--load);
      fill-opacity: 0.15;
      stroke: var(--load);
      stroke-width: 1.5;
    }
    .computebox {
      fill: var(--compute);
      fill-opacity: 0.16;
      stroke: var(--compute);
      stroke-width: 1.5;
    }
    .title {
      font-weight: 700;
    }
    .bold {
      font-weight: 600;
    }
    /* Typography adapted from ONS chart guidance:
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography
    20px headings, 16px subheadings, 14px labels at native display width.
    Variables compensate for the original graphics coordinate scale. */
    .type-heading {
      font-size: var(--type-heading);
    }
    .type-subheading {
      font-size: var(--type-subheading);
    }

  </style>
