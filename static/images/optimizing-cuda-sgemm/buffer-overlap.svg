<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 416"
  role="img"
  aria-labelledby="title desc"
  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
  width="640"
  height="416"
  data-diagram-width="640"
>
  <title id="title">Two ways to overlap loads with computation</title>
  <desc id="desc">Schematic timelines, not measured durations. A single block with one buffer alternates loads and compute. Two buffers let later loads overlap computation. Two resident blocks can also overlap a block’s loads with the other’s computation, but share execution resources and do twice the work in this example.</desc>
  <style>
    :root {
      --fg: #222;
      --muted: #656565;
      --load: #b83c0b;
      --compute: #237a36;
      --type-heading: 20px;
      --type-subheading: 16px;
      --type-label: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --muted: #aaa;
        --load: #ff9a64;
        --compute: #82df92;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .small {
      fill: var(--muted);
    }
    .loadbox {
      fill: var(--load);
      fill-opacity: 0.15;
      stroke: var(--load);
      stroke-width: 1.5;
    }
    .computebox {
      fill: var(--compute);
      fill-opacity: 0.16;
      stroke: var(--compute);
      stroke-width: 1.5;
    }
    .title {
      font-weight: 700;
    }
    .bold {
      font-weight: 600;
    }
    /* Typography adapted from ONS chart guidance:
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography
    20px headings, 16px subheadings, 14px labels at native display width.
    Variables compensate for the original graphics coordinate scale. */
    .type-heading {
      font-size: var(--type-heading);
    }
    .type-subheading {
      font-size: var(--type-subheading);
    }

  </style>
  <text x="20" y="30" class="title type-heading">Two ways to overlap loads with computation</text>
  <rect x="20" y="52" width="20" height="15" rx="0" class="loadbox" />
  <text x="46" y="65" class="small">load</text>
  <rect x="114" y="52" width="20" height="15" rx="0" class="computebox" />
  <text x="140" y="65" class="small">compute</text>
  <text x="20" y="96" class="bold type-subheading">One block, one buffer</text>
  <rect x="175" y="108" width="30" height="28" rx="4" class="loadbox" />
  <text x="190.0" y="128.0" text-anchor="middle">L1</text>
  <rect x="205" y="108" width="70" height="28" rx="4" class="computebox" />
  <text x="240.0" y="128.0" text-anchor="middle">C1</text>
  <rect x="275" y="108" width="30" height="28" rx="4" class="loadbox" />
  <text x="290.0" y="128.0" text-anchor="middle">L2</text>
  <rect x="305" y="108" width="70" height="28" rx="4" class="computebox" />
  <text x="340.0" y="128.0" text-anchor="middle">C2</text>
  <rect x="375" y="108" width="30" height="28" rx="4" class="loadbox" />
  <text x="390.0" y="128.0" text-anchor="middle">L3</text>
  <rect x="405" y="108" width="70" height="28" rx="4" class="computebox" />
  <text x="440.0" y="128.0" text-anchor="middle">C3</text>
  <text x="20" y="170" class="bold type-subheading">One block, two buffers</text>
  <rect x="175" y="182" width="30" height="28" rx="4" class="loadbox" />
  <text x="190.0" y="202.0" text-anchor="middle">L1</text>
  <rect x="205" y="182" width="70" height="28" rx="4" class="computebox" />
  <text x="240.0" y="202.0" text-anchor="middle">C1</text>
  <rect x="275" y="182" width="70" height="28" rx="4" class="computebox" />
  <text x="310.0" y="202.0" text-anchor="middle">C2</text>
  <rect x="345" y="182" width="70" height="28" rx="4" class="computebox" />
  <text x="380.0" y="202.0" text-anchor="middle">C3</text>
  <rect x="210" y="216" width="35" height="28" rx="4" class="loadbox" />
  <text x="227.5" y="236.0" text-anchor="middle">L2</text>
  <rect x="280" y="216" width="35" height="28" rx="4" class="loadbox" />
  <text x="297.5" y="236.0" text-anchor="middle">L3</text>
  <text x="20" y="278" class="bold type-subheading">Two resident blocks, one buffer each</text>
  <text x="20" y="310" class="small">block A</text>
  <text x="20" y="345" class="small">block B</text>
  <rect x="145" y="290" width="30" height="27" rx="4" class="loadbox" />
  <text x="160.0" y="309.5" text-anchor="middle">L1</text>
  <rect x="175" y="290" width="65" height="27" rx="4" class="computebox" />
  <text x="207.5" y="309.5" text-anchor="middle">C1</text>
  <rect x="240" y="325" width="65" height="27" rx="4" class="computebox" />
  <text x="272.5" y="344.5" text-anchor="middle">C1</text>
  <rect x="183" y="325" width="35" height="27" rx="4" class="loadbox" />
  <text x="200.5" y="344.5" text-anchor="middle">L1</text>
  <rect x="248" y="290" width="35" height="27" rx="4" class="loadbox" />
  <text x="265.5" y="309.5" text-anchor="middle">L2</text>
  <rect x="305" y="290" width="65" height="27" rx="4" class="computebox" />
  <text x="337.5" y="309.5" text-anchor="middle">C2</text>
  <rect x="370" y="325" width="65" height="27" rx="4" class="computebox" />
  <text x="402.5" y="344.5" text-anchor="middle">C2</text>
  <rect x="313" y="325" width="35" height="27" rx="4" class="loadbox" />
  <text x="330.5" y="344.5" text-anchor="middle">L2</text>
  <rect x="378" y="290" width="35" height="27" rx="4" class="loadbox" />
  <text x="395.5" y="309.5" text-anchor="middle">L3</text>
  <rect x="435" y="290" width="65" height="27" rx="4" class="computebox" />
  <text x="467.5" y="309.5" text-anchor="middle">C3</text>
  <rect x="500" y="325" width="65" height="27" rx="4" class="computebox" />
  <text x="532.5" y="344.5" text-anchor="middle">C3</text>
  <rect x="443" y="325" width="35" height="27" rx="4" class="loadbox" />
  <text x="460.5" y="344.5" text-anchor="middle">L3</text>
  <text x="20" y="382" class="small">The two-block case does twice the work on shared SM resources.</text>
  <text x="20" y="405" class="small">Timelines are schematic; barriers and other costs are omitted.</text>
</svg>
