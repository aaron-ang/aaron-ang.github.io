<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 290"
  role="img"
  aria-labelledby="title desc"
  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
  width="640"
  height="290"
  data-diagram-width="640"
>
  <title id="title">More outputs use more of the SM’s registers</title>
  <desc id="desc">An SM has 65,536 registers. At 128 registers per thread, each 256-thread block uses 32,768 registers and two blocks fit. At 237 registers per thread, a block uses 60,672 registers, leaving insufficient space for a second block.</desc>
  <style>
    :root {
      --fg: #222;
      --muted: #656565;
      --edge: #999;
      --compute: #237a36;
      --type-heading: 20px;
      --type-subheading: 16px;
      --type-label: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --muted: #aaa;
        --edge: #888;
        --compute: #82df92;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .small {
      fill: var(--muted);
    }
    .outline {
      fill: none;
      stroke: var(--edge);
    }
    .computebox {
      fill: var(--compute);
      fill-opacity: 0.16;
      stroke: var(--compute);
      stroke-width: 1.5;
    }
    .title {
      font-weight: 700;
    }
    .bold {
      font-weight: 600;
    }
    /* Typography adapted from ONS chart guidance:
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography
    20px headings, 16px subheadings, 14px labels at native display width.
    Variables compensate for the original graphics coordinate scale. */
    .type-heading {
      font-size: var(--type-heading);
    }
    .type-subheading {
      font-size: var(--type-subheading);
    }

  </style>
  <text x="20" y="30" class="title type-heading">More outputs use more of the SM’s registers</text>
  <text x="20" y="62" class="small">One SM: 65,536 registers; 256 threads per block.</text>
  <text x="20" y="100" class="bold type-subheading">8×8 patch: 128 registers per thread</text>
  <rect x="52" y="115" width="536" height="38" rx="0" class="outline" />
  <rect x="52" y="115" width="268.0" height="38" rx="0" class="computebox" />
  <rect x="320.0" y="115" width="268.0" height="38" rx="0" class="computebox" />
  <text x="186.0" y="141" text-anchor="middle">block 1: 32,768</text>
  <text x="454.0" y="141" text-anchor="middle">block 2: 32,768</text>
  <text x="20" y="194" class="bold type-subheading">16×8 patch: 237 registers per thread</text>
  <rect x="52" y="209" width="536" height="38" rx="0" class="outline" />
  <rect x="52" y="209" width="496.21875" height="38" rx="0" class="computebox" />
  <text x="300.109375" y="235" text-anchor="middle">block 1: 60,672</text>
  <text x="20" y="278" class="small">Only 4,864 registers remain — not enough for another block.</text>
</svg>
