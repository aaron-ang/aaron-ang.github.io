  <line x1="416" y1="164" x2="504" y2="164" class="grid" />
  <line x1="416" y1="175" x2="504" y2="175" class="grid" />
  <line x1="416" y1="186" x2="504" y2="186" class="grid" />
  <line x1="416" y1="197" x2="504" y2="197" class="grid" />
  <line x1="416" y1="208" x2="504" y2="208" class="grid" />
  <line x1="416" y1="219" x2="504" y2="219" class="grid" />
  <line x1="416" y1="230" x2="504" y2="230" class="grid" />
  <line x1="416" y1="241" x2="504" y2="241" class="grid" />
  <line x1="416" y1="252" x2="504" y2="252" class="grid" />
  <line x1="416" y1="263" x2="504" y2="263" class="grid" />
  <line x1="416" y1="274" x2="504" y2="274" class="grid" />
  <line x1="416" y1="285" x2="504" y2="285" class="grid" />
  <rect x="416" y="99" width="88" height="12" rx="0" class="loadbox" />
  <rect x="395" y="120" width="12" height="176" rx="0" class="loadbox" />
  <text x="460" y="91" class="small" text-anchor="middle">8 from B</text>
  <text x="381" y="208.0" class="load" text-anchor="middle">16</text>
  <text x="381" y="228.0" class="small" text-anchor="middle">A</text>
  <text x="460" y="330" text-anchor="middle">24 loads → 128 multiply-adds</text>
  <text x="320" y="370" class="bold type-subheading" text-anchor="middle">Loads per 16 multiply-adds: 4 → 3</text>
</svg>
