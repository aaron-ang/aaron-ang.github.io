<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated register tiling: one thread keeps an 8 by 8 patch of C in registers. At each k step it loads 8 values from a column of As and 8 from a row of Bs, then does all 64 multiply-adds between them, row by row. 16 loads for 64 multiply-adds is 0.25 loads each, 8 times fewer than the 2 a thread computing a single output needs.">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --chip: #f4f4f4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --chip: #2a2a2a; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .b { font-weight: 600; }
    .empty { fill: var(--empty); stroke: var(--edge); }
    .hot { fill: var(--probe); fill-opacity: 0.35; stroke: var(--probe); stroke-width: 2; }
    .num { fill: var(--probe); font-weight: 600; font-size: 13px; }
    .new { fill: var(--ok); }
    .okring { fill: none; stroke: var(--ok); stroke-width: 3; }
    .oktext { fill: var(--ok); font-weight: 600; }
    .arrow { fill: none; stroke: var(--probe); stroke-width: 2; }
    .arrowhead { fill: var(--probe); }
    /* 37.47s loop, 7 steps starting at 0.5, 5.22, 10.06, 13.48, 18.11, 24.15, 29.99 s; final frame holds 6.73s, then fades. */
    .a { opacity: 0; animation: 37.47s linear infinite; }
    .w1 { animation-name: w1; }  /* 5.22s to end */
    @keyframes w1 { 0.00%, 13.93% { opacity: 0 } 14.33%, 98.00% { opacity: 1 } 98.40%, 100.00% { opacity: 0 } }
    .w2 { animation-name: w2; }  /* 10.06s to end */
    @keyframes w2 { 0.00%, 26.85% { opacity: 0 } 27.25%, 98.00% { opacity: 1 } 98.40%, 100.00% { opacity: 0 } }
    .w3 { animation-name: w3; }  /* 5.22s to 10.06s */
    @keyframes w3 { 0.00%, 13.93% { opacity: 0 } 14.33%, 26.85% { opacity: 1 } 27.25%, 100.00% { opacity: 0 } }
    .w4 { animation-name: w4; }  /* 13.48s to end */
    @keyframes w4 { 0.00%, 35.98% { opacity: 0 } 36.38%, 98.00% { opacity: 1 } 98.40%, 100.00% { opacity: 0 } }
    .w5 { animation-name: w5; }  /* 13.48s to 18.11s */
    @keyframes w5 { 0.00%, 35.98% { opacity: 0 } 36.38%, 48.33% { opacity: 1 } 48.73%, 100.00% { opacity: 0 } }
    .w6 { animation-name: w6; }  /* 18.11s to end */
    @keyframes w6 { 0.00%, 48.33% { opacity: 0 } 48.73%, 98.00% { opacity: 1 } 98.40%, 100.00% { opacity: 0 } }
    .w7 { animation-name: w7; }  /* 24.15s to end */
    @keyframes w7 { 0.00%, 64.45% { opacity: 0 } 64.85%, 98.00% { opacity: 1 } 98.40%, 100.00% { opacity: 0 } }
    .w8 { animation-name: w8; }  /* 29.99s to end */
    @keyframes w8 { 0.00%, 80.04% { opacity: 0 } 80.44%, 98.00% { opacity: 1 } 98.40%, 100.00% { opacity: 0 } }
    .w9 { animation-name: w9; }  /* 0.50s to 5.22s */
    @keyframes w9 { 0.00%, 13.93% { opacity: 1 } 14.33%, 98.00% { opacity: 0 } 98.40%, 100.00% { opacity: 1 } }
    .w10 { animation-name: w10; }  /* 10.06s to 13.48s */
    @keyframes w10 { 0.00%, 26.85% { opacity: 0 } 27.25%, 35.98% { opacity: 1 } 36.38%, 100.00% { opacity: 0 } }
    .w11 { animation-name: w11; }  /* 18.11s to 24.15s */
    @keyframes w11 { 0.00%, 48.33% { opacity: 0 } 48.73%, 64.45% { opacity: 1 } 64.85%, 100.00% { opacity: 0 } }
    .w12 { animation-name: w12; }  /* 24.15s to 29.99s */
    @keyframes w12 { 0.00%, 64.45% { opacity: 0 } 64.85%, 80.04% { opacity: 1 } 80.44%, 100.00% { opacity: 0 } }
    .w13 { animation-name: w13; }  /* 0.50s to 18.11s (patch outline until all rows fill) */
    @keyframes w13 { 0.00%, 48.33% { opacity: 1 } 48.73%, 98.00% { opacity: 0 } 98.40%, 100.00% { opacity: 1 } }
    .patch { fill: none; stroke: var(--fg); stroke-width: 2.5; }
    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; opacity: 0; }
      .a.fin { opacity: 1; }
    }
    .mvar { font-family: 'Times New Roman', Times, 'STIX Two Text', serif; font-style: italic; font-size: 1.1em; }
  </style>
