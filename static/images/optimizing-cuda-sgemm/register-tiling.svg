  <text x="302" y="346" text-anchor="middle" class="muted">8×8 patch of <tspan class="mvar">C</tspan> (registers)</text>
  <text x="450" y="84" class="title">one <tspan class="mvar">k</tspan> step, one thread</text>
  <rect x="110" y="184" width="18" height="144" class="hot a w1 fin"/>
