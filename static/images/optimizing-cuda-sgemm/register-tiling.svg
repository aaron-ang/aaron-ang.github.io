  </g>
  <text x="20" y="356" class="a w9">Each thread computes 64 outputs instead of 1.</text>
  <text x="20" y="356" class="a w3">First, the 8 values of <tspan class="mvar">A</tspan> this patch needs at step <tspan class="mvar">k</tspan>.</text>
  <text x="20" y="356" class="a w10">Then the 8 values of <tspan class="mvar">B</tspan>.</text>
  <text x="20" y="356" class="a w5">One <tspan class="mvar">A</tspan> value times all 8 <tspan class="mvar">B</tspan> values fills a row.</text>
  <text x="20" y="356" class="a w11">The other rows reuse the same 8 <tspan class="mvar">B</tspan> values: <tspan class="mvar">C</tspan>[<tspan class="mvar">m</tspan>][<tspan class="mvar">n</tspan>] += regM[<tspan class="mvar">m</tspan>] × regN[<tspan class="mvar">n</tspan>].</text>
  <text x="20" y="356" class="a w12">With one output, each multiply-add needs its own <tspan class="mvar">A</tspan> and <tspan class="mvar">B</tspan> value.</text>
  <text x="20" y="356" class="b a w8 fin">Each loaded value now feeds 8 multiply-adds instead of 1.</text>
