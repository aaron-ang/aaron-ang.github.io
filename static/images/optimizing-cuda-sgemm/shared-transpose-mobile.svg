<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 322"
  width="280"
  height="322"
  role="img"
  aria-labelledby="title desc"
  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
>
  <title id="title">Transposing A</title>
  <desc id="desc">Thread 0 needs A rows 0–7 at one k step. Their float offsets at k = 0 change from 0, 32, …, 224 to adjacent offsets 0–7. Wide-read availability is an intended benefit, not a measured instruction saving.</desc>
  <style>
    /* ONS chart typography: 20px title, 16px subheading, 14px labels/annotations.
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography */
    :root {
      --fg: #222;
      --muted: #707071;
      --load: #b83c0b;
      --ok: #237a36;
      --type-heading: 20px;
      --type-subheading: 16px;
      --type-label: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --muted: #aaa;
        --load: #ff9a64;
        --ok: #82df92;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .title {
      font-weight: 700;
    }
    .sub {
      font-weight: 600;
    }
    .note {
      fill: var(--muted);
    }
    .load {
      fill: var(--load);
      fill-opacity: 0.15;
      stroke: var(--load);
    }
    .ok {
      fill: var(--ok);
      fill-opacity: 0.15;
      stroke: var(--ok);
    }
    /* Typography adapted from ONS chart guidance:
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography
    20px headings, 16px subheadings, 14px labels at native display width.
    Variables compensate for the original graphics coordinate scale. */
    .type-heading {
      font-size: var(--type-heading);
    }
    .type-subheading {
      font-size: var(--type-subheading);
    }

  </style>
  <text x="12" y="26" class="title type-heading">Transposing A</text>
  <text x="12" y="54" class="note">Thread 0 needs rows 0–7</text>
  <text x="12" y="74" class="note">at one k step.</text>
  <text x="12" y="104" class="sub type-subheading">Before: 32 floats apart</text>
  <rect x="12" y="118" width="28" height="26" rx="2" class="load" />
  <text x="26" y="136" class="" text-anchor="middle">r0</text>
  <text x="26" y="165" class="" text-anchor="middle">0</text>
  <rect x="44" y="118" width="28" height="26" rx="2" class="load" />
  <text x="58" y="136" class="" text-anchor="middle">r1</text>
  <text x="58" y="165" class="" text-anchor="middle">32</text>
  <rect x="76" y="118" width="28" height="26" rx="2" class="load" />
  <text x="90" y="136" class="" text-anchor="middle">r2</text>
  <text x="90" y="165" class="" text-anchor="middle">64</text>
  <rect x="108" y="118" width="28" height="26" rx="2" class="load" />
  <text x="122" y="136" class="" text-anchor="middle">r3</text>
  <text x="122" y="165" class="" text-anchor="middle">96</text>
  <rect x="140" y="118" width="28" height="26" rx="2" class="load" />
  <text x="154" y="136" class="" text-anchor="middle">r4</text>
  <text x="154" y="165" class="" text-anchor="middle">128</text>
  <rect x="172" y="118" width="28" height="26" rx="2" class="load" />
  <text x="186" y="136" class="" text-anchor="middle">r5</text>
  <text x="186" y="165" class="" text-anchor="middle">160</text>
  <rect x="204" y="118" width="28" height="26" rx="2" class="load" />
  <text x="218" y="136" class="" text-anchor="middle">r6</text>
  <text x="218" y="165" class="" text-anchor="middle">192</text>
  <rect x="236" y="118" width="28" height="26" rx="2" class="load" />
  <text x="250" y="136" class="" text-anchor="middle">r7</text>
  <text x="250" y="165" class="" text-anchor="middle">224</text>
  <text x="12" y="212" class="sub type-subheading">After: adjacent values</text>
  <rect x="12" y="226" width="32" height="26" rx="2" class="ok" />
  <text x="26" y="244" class="" text-anchor="middle">r0</text>
  <text x="26" y="273" class="" text-anchor="middle">0</text>
  <rect x="44" y="226" width="32" height="26" rx="2" class="ok" />
  <text x="58" y="244" class="" text-anchor="middle">r1</text>
  <text x="58" y="273" class="" text-anchor="middle">1</text>
  <rect x="76" y="226" width="32" height="26" rx="2" class="ok" />
  <text x="90" y="244" class="" text-anchor="middle">r2</text>
  <text x="90" y="273" class="" text-anchor="middle">2</text>
  <rect x="108" y="226" width="32" height="26" rx="2" class="ok" />
  <text x="122" y="244" class="" text-anchor="middle">r3</text>
  <text x="122" y="273" class="" text-anchor="middle">3</text>
  <rect x="140" y="226" width="32" height="26" rx="2" class="ok" />
  <text x="154" y="244" class="" text-anchor="middle">r4</text>
  <text x="154" y="273" class="" text-anchor="middle">4</text>
  <rect x="172" y="226" width="32" height="26" rx="2" class="ok" />
  <text x="186" y="244" class="" text-anchor="middle">r5</text>
  <text x="186" y="273" class="" text-anchor="middle">5</text>
  <rect x="204" y="226" width="32" height="26" rx="2" class="ok" />
  <text x="218" y="244" class="" text-anchor="middle">r6</text>
  <text x="218" y="273" class="" text-anchor="middle">6</text>
  <rect x="236" y="226" width="32" height="26" rx="2" class="ok" />
  <text x="250" y="244" class="" text-anchor="middle">r7</text>
  <text x="250" y="273" class="" text-anchor="middle">7</text>
  <text x="12" y="301" class="note">Float offsets shown for k = 0.</text>
</svg>
