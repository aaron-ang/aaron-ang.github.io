<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated warp tiling on a 128 by 128 block tile of C shared by 8 warps. Before, warp 0's 2,048 outputs are 16 rows spread across all 128 columns, so each k step it reads 16 values of A and 128 of B, 144 in all. With warp tiling each warp owns a 32 by 64 region in a 4 by 2 grid, and warp 0 reads 32 values of A and 64 of B, 96 in all, a third less data. The shared-memory passes stay the same, because threads in a warp reading the same value share one pass, so warp tiling alone gives no speedup.">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --chip: #f4f4f4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --chip: #2a2a2a; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .b { font-weight: 600; }
    .sm { font-size: 12px; }
    .empty { fill: var(--empty); stroke: var(--edge); }
    .hot { fill: var(--probe); fill-opacity: 0.35; stroke: var(--probe); stroke-width: 1.5; }
    .new { fill: var(--ok); fill-opacity: 0.4; stroke: var(--ok); stroke-width: 1.5; }
    .wline { fill: none; stroke: var(--fg); stroke-width: 1.2; stroke-dasharray: 4 3; }
    .num { fill: var(--probe); font-weight: 600; font-size: 13px; }
    .oktext { fill: var(--ok); font-weight: 600; }
    .wl { fill: var(--muted); font-size: 11px; }
    /* 40.95s loop, 5 steps starting at 0.5, 6.5, 13.7, 21.9, 30.7 s; final frame holds 9.5s, then fades. */
    .a { opacity: 0; animation: 40.95s linear infinite; }
    .st1-2 { animation-name: st1_2; }  /* 0.5s to 6.5s */
    @keyframes st1_2 { 0.00%, 15.87% { opacity: 1 } 16.24%, 98.17% { opacity: 0 } 98.53%, 100.00% { opacity: 1 } }
    .st2 { animation-name: st2; }  /* 6.5s to end */
    @keyframes st2 { 0.00%, 15.87% { opacity: 0 } 16.24%, 98.17% { opacity: 1 } 98.53%, 100.00% { opacity: 0 } }
    .st2-3 { animation-name: st2_3; }  /* 6.5s to 13.7s */
    @keyframes st2_3 { 0.00%, 15.87% { opacity: 0 } 16.24%, 33.46% { opacity: 1 } 33.82%, 100.00% { opacity: 0 } }
    .st3 { animation-name: st3; }  /* 13.7s to end */
    @keyframes st3 { 0.00%, 33.46% { opacity: 0 } 33.82%, 98.17% { opacity: 1 } 98.53%, 100.00% { opacity: 0 } }
    .st3-4 { animation-name: st3_4; }  /* 13.7s to 21.9s */
    @keyframes st3_4 { 0.00%, 33.46% { opacity: 0 } 33.82%, 53.48% { opacity: 1 } 53.85%, 100.00% { opacity: 0 } }
    .st4 { animation-name: st4; }  /* 21.9s to end */
    @keyframes st4 { 0.00%, 53.48% { opacity: 0 } 53.85%, 98.17% { opacity: 1 } 98.53%, 100.00% { opacity: 0 } }
    .st4-5 { animation-name: st4_5; }  /* 21.9s to 30.7s */
    @keyframes st4_5 { 0.00%, 53.48% { opacity: 0 } 53.85%, 74.97% { opacity: 1 } 75.34%, 100.00% { opacity: 0 } }
    .st5 { animation-name: st5; }  /* 30.7s to end */
    @keyframes st5 { 0.00%, 74.97% { opacity: 0 } 75.34%, 98.17% { opacity: 1 } 98.53%, 100.00% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; opacity: 0; }
      .a.fin { opacity: 1; }
    }
    .mvar { font-family: 'Times New Roman', Times, 'STIX Two Text', serif; font-style: italic; font-size: 1.1em; }
  </style>
  <text x="20" y="26" class="title">Which outputs does warp 0 own, and what must it read per <tspan class="mvar">k</tspan> step?</text>
  <text x="20" y="44" class="muted">Every warp computes 2,048 of the tile's 16,384 outputs either way; only their shape changes.</text>
  <text x="60" y="70" class="b">before</text>
  <text x="60" y="86" class="muted">bank-fix layout</text>
  <rect x="80" y="98" width="192" height="8" class="empty"/>
  <text x="280" y="105" class="muted"><tspan class="mvar">B</tspan>, row <tspan class="mvar">k</tspan></text>
  <rect x="66" y="112" width="8" height="192" class="empty"/>
  <text x="58" y="208" text-anchor="middle" class="muted" transform="rotate(-90 58 208)"><tspan class="mvar">A</tspan>, column <tspan class="mvar">k</tspan></text>
  <rect x="80" y="112" width="192" height="192" class="empty"/>
  <text x="280" y="302" class="muted">128 × 128 tile of <tspan class="mvar">C</tspan></text>
  <text x="410" y="70" class="b">after</text>
  <text x="410" y="86" class="muted">warp tiles, 32 × 64 each</text>
  <rect x="430" y="98" width="192" height="8" class="empty"/>
  <text x="630" y="105" class="muted"><tspan class="mvar">B</tspan>, row <tspan class="mvar">k</tspan></text>
  <rect x="416" y="112" width="8" height="192" class="empty"/>
  <text x="408" y="208" text-anchor="middle" class="muted" transform="rotate(-90 408 208)"><tspan class="mvar">A</tspan>, column <tspan class="mvar">k</tspan></text>
  <rect x="430" y="112" width="192" height="192" class="empty"/>
  <text x="630" y="302" class="muted">128 × 128 tile of <tspan class="mvar">C</tspan></text>
  <rect x="80" y="112.0" width="192" height="12.0" class="hot a st2 fin"/>
  <rect x="80" y="208.0" width="192" height="12.0" class="hot a st2 fin"/>
  <text x="60" y="326" class="num a st2 fin">warp 0: 16 rows × 128 columns</text>
  <rect x="66" y="112.0" width="8" height="12.0" class="hot a st3 fin"/>
  <rect x="66" y="208.0" width="8" height="12.0" class="hot a st3 fin"/>
  <rect x="80.0" y="98" width="192.0" height="8" class="hot a st3 fin"/>
  <text x="60" y="348" class="a st3 fin">reads per <tspan class="mvar">k</tspan>: 16 of <tspan class="mvar">A</tspan> + 128 of <tspan class="mvar">B</tspan> = <tspan class="num" style="font-size:14px">144</tspan></text>
  <path d="M 526 112 v 192 M 430 160.0 h 192 M 430 208.0 h 192 M 430 256.0 h 192" class="wline a st4 fin"/>
  <text x="478" y="140" text-anchor="middle" class="wl a st4 fin">w0</text>
  <text x="574" y="140" text-anchor="middle" class="wl a st4 fin">w1</text>
  <text x="478" y="188" text-anchor="middle" class="wl a st4 fin">w2</text>
  <text x="574" y="188" text-anchor="middle" class="wl a st4 fin">w3</text>
  <text x="478" y="236" text-anchor="middle" class="wl a st4 fin">w4</text>
  <text x="574" y="236" text-anchor="middle" class="wl a st4 fin">w5</text>
  <text x="478" y="284" text-anchor="middle" class="wl a st4 fin">w6</text>
  <text x="574" y="284" text-anchor="middle" class="wl a st4 fin">w7</text>
  <rect x="430" y="112" width="96" height="48" class="new a st4 fin"/>
  <text x="410" y="326" class="oktext sm a st4 fin">warp 0: 32 rows × 64 columns</text>
  <rect x="416" y="112.0" width="8" height="48.0" class="new a st5 fin"/>
  <rect x="430.0" y="98" width="96.0" height="8" class="new a st5 fin"/>
  <text x="410" y="348" class="a st5 fin">reads per <tspan class="mvar">k</tspan>: 32 of <tspan class="mvar">A</tspan> + 64 of <tspan class="mvar">B</tspan> = <tspan class="oktext">96</tspan></text>
  <text x="410" y="370" class="muted a st5 fin">threads reading the same value share one pass</text>
  <text x="20" y="404" class="a st1-2">A block's 128×128 tile of <tspan class="mvar">C</tspan> is shared by 8 warps of 32 threads.</text>
  <text x="20" y="404" class="a st2-3">The bank fix put each warp's rows 64 apart and spread its columns across the whole tile.</text>
  <text x="20" y="404" class="a st3-4">A warp must read every value of <tspan class="mvar">A</tspan> and <tspan class="mvar">B</tspan> that touches one of its outputs.</text>
  <text x="20" y="404" class="a st4-5">A squarer region touches fewer rows plus columns for the same number of outputs.</text>
  <text x="20" y="404" class="b a st5 fin">A third less data, but the same shared-memory passes, so no speedup on its own.</text>
</svg>
