<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 447"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
  role="img"
  aria-label="Animated warp tiling on a 128 by 128 block tile of C shared by 8 warps. Before, warp 0's 2,048 outputs are 16 rows spread across all 128 columns, so each k step it reads 16 values of A and 128 of B, 144 in all. With warp tiling each warp owns a 32 by 64 region in a 4 by 2 grid, and warp 0 reads 32 values of A and 64 of B, 96 in all, a third less data. The shared-memory passes stay the same, because threads in a warp reading the same value share one pass, so warp tiling alone gives no speedup."
  width="640"
  height="447"
  data-diagram-width="640"
>
  <style>
    :root {
      --fg: #222;
      --muted: #707071;
      --empty: #ffffff;
      --edge: #999;
      --probe: #d9480f;
      --ok: #2b8a3e;
      --label-load: #8a2c0a;
      --label-compute: #237a36;
      --type-heading: 23.74999982px;
      --type-subheading: 18.99999986px;
      --type-label: 16.62499988px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --muted: #999;
        --empty: #1e1e1e;
        --edge: #777;
        --probe: #ff8a4c;
        --ok: #69db7c;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .muted {
      fill: var(--muted);
    }
    .empty {
      fill: var(--empty);
      stroke: var(--edge);
    }
    .hot {
      fill: var(--probe);
      fill-opacity: 0.35;
      stroke: var(--probe);
      stroke-width: 1.5;
    }
    .new {
      fill: var(--ok);
      fill-opacity: 0.4;
      stroke: var(--ok);
      stroke-width: 1.5;
    }
    .wline {
      fill: none;
      stroke: var(--fg);
      stroke-width: 1.2;
      stroke-dasharray: 4 3;
    }
    .num {
      font-weight: 600;
      fill: var(--label-load);
    }
    .oktext {
      font-weight: 600;
      fill: var(--label-compute);
    }
    .wl {
      fill: var(--muted);
    }
    /* 40.95s loop, 5 steps starting at 0.5, 6.5, 13.7, 21.9, 30.7 s; final frame holds 9.5s, then fades. */
    .a {
      opacity: 0;
      animation: 40.95s linear infinite;
    }
    .st1-2 {
      animation-name: st1_2;
    } /* 0.5s to 6.5s */
    @keyframes st1_2 {
      0.00%, 15.87% { opacity: 1; }
      16.24%, 98.17% { opacity: 0; }
      98.53%, 100.00% { opacity: 1; }
    }
    .st2 {
      animation-name: st2;
    } /* 6.5s to end */
    @keyframes st2 {
      0.00%, 15.87% { opacity: 0; }
      16.24%, 98.17% { opacity: 1; }
      98.53%, 100.00% { opacity: 0; }
    }
    .st2-3 {
      animation-name: st2_3;
    } /* 6.5s to 13.7s */
    @keyframes st2_3 {
      0.00%, 15.87% { opacity: 0; }
      16.24%, 33.46% { opacity: 1; }
      33.82%, 100.00% { opacity: 0; }
    }
    .st3 {
      animation-name: st3;
    } /* 13.7s to end */
    @keyframes st3 {
      0.00%, 33.46% { opacity: 0; }
      33.82%, 98.17% { opacity: 1; }
      98.53%, 100.00% { opacity: 0; }
    }
    .st3-4 {
      animation-name: st3_4;
    } /* 13.7s to 21.9s */
    @keyframes st3_4 {
      0.00%, 33.46% { opacity: 0; }
      33.82%, 53.48% { opacity: 1; }
      53.85%, 100.00% { opacity: 0; }
    }
    .st4 {
      animation-name: st4;
    } /* 21.9s to end */
    @keyframes st4 {
      0.00%, 53.48% { opacity: 0; }
      53.85%, 98.17% { opacity: 1; }
      98.53%, 100.00% { opacity: 0; }
    }
    .st4-5 {
      animation-name: st4_5;
    } /* 21.9s to 30.7s */
    @keyframes st4_5 {
      0.00%, 53.48% { opacity: 0; }
      53.85%, 74.97% { opacity: 1; }
      75.34%, 100.00% { opacity: 0; }
    }
    .st5 {
      animation-name: st5;
    } /* 30.7s to end */
    @keyframes st5 {
      0.00%, 74.97% { opacity: 0; }
      75.34%, 98.17% { opacity: 1; }
      98.53%, 100.00% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .a {
        animation: none;
        opacity: 0;
      }
      .a.fin {
        opacity: 1;
      }
    }
    .mvar {
      font-family: "Times New Roman", Times, "STIX Two Text", serif;
      font-style: italic;
    }
    .title {
      font-weight: 700;
    }
    .b {
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --label-load: #ff9a64;
        --label-compute: #82df92;
      }
    }
    /* Typography adapted from ONS chart guidance:
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography
    20px headings, 16px subheadings, 14px labels at native display width.
    Variables compensate for the original graphics coordinate scale. */
    .type-heading {
      font-size: var(--type-heading);
    }
    .type-subheading {
      font-size: var(--type-subheading);
    }

  </style>
  <g transform="scale(0.8421052631578947)">
    <text x="20" y="26" class="title type-heading">Warp tiling changes the outputs assigned to each warp</text>
    <text x="20" y="52" class="muted">Same 2,048 outputs per warp; a different shape.</text>
    <text x="60" y="82" class="b type-subheading">before</text>
    <text x="60" y="105" class="muted">bank-fix layout</text>
    <rect x="80" y="98" width="192" height="8" class="empty" transform="translate(0 22)" />
    <text x="280" y="105" class="muted" transform="translate(0 22) "><tspan class="mvar">B</tspan>, row <tspan class="mvar">k</tspan></text>
    <rect x="66" y="112" width="8" height="192" class="empty" transform="translate(0 22)" />
    <text x="58" y="208" text-anchor="middle" class="muted" transform="translate(0 22) rotate(-90 58 208)"><tspan class="mvar">A</tspan>, column <tspan class="mvar">k</tspan></text>
    <rect x="80" y="112" width="192" height="192" class="empty" transform="translate(0 22)" />
    <text x="176" y="354" class="muted" text-anchor="middle">128 × 128 tile of <tspan class="mvar">C</tspan></text>
    <text x="410" y="82" class="b type-subheading">after</text>
    <text x="410" y="105" class="muted">warp tiles, 32 × 64 each</text>
    <rect x="430" y="98" width="192" height="8" class="empty" transform="translate(0 22)" />
    <text x="630" y="105" class="muted" transform="translate(0 22) "><tspan class="mvar">B</tspan>, row <tspan class="mvar">k</tspan></text>
    <rect x="416" y="112" width="8" height="192" class="empty" transform="translate(0 22)" />
    <text x="408" y="208" text-anchor="middle" class="muted" transform="translate(0 22) rotate(-90 408 208)"><tspan class="mvar">A</tspan>, column <tspan class="mvar">k</tspan></text>
    <rect x="430" y="112" width="192" height="192" class="empty" transform="translate(0 22)" />
    <text x="526" y="354" class="muted" text-anchor="middle">128 × 128 tile of <tspan class="mvar">C</tspan></text>
    <rect x="80" y="112.0" width="192" height="12.0" class="hot a st2 fin" transform="translate(0 22)" />
    <rect x="80" y="208.0" width="192" height="12.0" class="hot a st2 fin" transform="translate(0 22)" />
    <text x="60" y="386" class="num a st2 fin">warp 0: 16 rows × 128 columns</text>
    <rect x="66" y="112.0" width="8" height="12.0" class="hot a st3 fin" transform="translate(0 22)" />
    <rect x="66" y="208.0" width="8" height="12.0" class="hot a st3 fin" transform="translate(0 22)" />
    <rect x="80.0" y="98" width="192.0" height="8" class="hot a st3 fin" transform="translate(0 22)" />
    <text x="60" y="414" class="a st3 fin">Per k: 16 A + 128 B = 144</text>
    <path d="M 526 112 v 192 M 430 160.0 h 192 M 430 208.0 h 192 M 430 256.0 h 192" class="wline a st4 fin" transform="translate(0 22)" />
    <text x="478" y="140" text-anchor="middle" class="wl a st4 fin" transform="translate(0 22) ">w0</text>
    <text x="574" y="140" text-anchor="middle" class="wl a st4 fin" transform="translate(0 22) ">w1</text>
    <text x="478" y="188" text-anchor="middle" class="wl a st4 fin" transform="translate(0 22) ">w2</text>
    <text x="574" y="188" text-anchor="middle" class="wl a st4 fin" transform="translate(0 22) ">w3</text>
    <text x="478" y="236" text-anchor="middle" class="wl a st4 fin" transform="translate(0 22) ">w4</text>
    <text x="574" y="236" text-anchor="middle" class="wl a st4 fin" transform="translate(0 22) ">w5</text>
    <text x="478" y="284" text-anchor="middle" class="wl a st4 fin" transform="translate(0 22) ">w6</text>
    <text x="574" y="284" text-anchor="middle" class="wl a st4 fin" transform="translate(0 22) ">w7</text>
    <rect x="430" y="112" width="96" height="48" class="new a st4 fin" transform="translate(0 22)" />
    <text x="410" y="386" class="oktext sm a st4 fin">warp 0: 32 rows × 64 columns</text>
    <rect x="416" y="112.0" width="8" height="48.0" class="new a st5 fin" transform="translate(0 22)" />
    <rect x="430.0" y="98" width="96.0" height="8" class="new a st5 fin" transform="translate(0 22)" />
    <text x="410" y="414" class="a st5 fin">Per k: 32 A + 64 B = 96</text>
    <text x="20" y="446" class="muted a st5 fin">Repeated requests for the same value share a pass.</text>
    <text x="20" y="478" class="a st1-2"><tspan x="20" dy="0">A block's 128×128 tile of C is shared by 8 warps of 32 threads.</tspan></text>
    <text x="20" y="478" class="a st2-3"><tspan x="20" dy="0">The bank fix put each warp's rows 64 apart and spread its columns across the</tspan><tspan x="20" dy="26">whole tile.</tspan></text>
    <text x="20" y="478" class="a st3-4"><tspan x="20" dy="0">A warp must read every value of A and B that touches one of its outputs.</tspan></text>
    <text x="20" y="478" class="a st4-5"><tspan x="20" dy="0">A squarer region touches fewer rows plus columns for the same number of</tspan><tspan x="20" dy="26">outputs.</tspan></text>
    <text x="20" y="478" class="b a st5 fin type-subheading"><tspan x="20" dy="0">A third less data, but the same shared-memory passes, so no speedup on</tspan><tspan x="20" dy="26">its own.</tspan></text>
  </g>
</svg>
