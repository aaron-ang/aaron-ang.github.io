  <rect x="470" y="246" width="40" height="18" class="hot a st1 fin"/>
  <text x="490.0" y="259" text-anchor="middle" class="lbl a st1 fin">L3</text>
  <line x1="512" y1="243" x2="512" y2="267" class="sync a st1 fin"/>
