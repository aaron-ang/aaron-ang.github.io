<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated double buffering. A one-buffer timeline alternates between loading a K slice and computing it, with a sync between each. Two shared-memory buffers then appear, and a second timeline row grows in step with the scene above it, with a shaded band on the bars just added: slice 1 is loaded into buffer 0 (bar L1); the threads compute slice 1 while slice 2's global loads are in flight into registers (C1 and L2 appear together, overlapping); after the compute, the registers are stored into buffer 1, then a sync and swap (sync mark); slice 2 is computed while slice 3 loads (C2 and L3); slice 3 goes through registers into buffer 0, then a sync and swap; slice 3 is computed with nothing left to load (C3). The two-buffer row finishes sooner, since every load after the first hides behind a compute. A last row shows two blocks per SM with one buffer each: one block's loads overlap the other block's math, hiding the same loads. That row ends last because it does two blocks' work, 6 slices in all; the blocks take turns computing, each at about half speed. Double buffering and a second block hide the same loads, so a second buffer adds little on top.">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --chip: #f4f4f4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --chip: #2a2a2a; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .b { font-weight: 600; }
    .sm { font-size: 12px; }
    .empty { fill: var(--empty); stroke: var(--edge); }
    .chip { fill: var(--chip); stroke: var(--edge); }
    .hot { fill: var(--probe); fill-opacity: 0.35; stroke: var(--probe); stroke-width: 1.5; }
    .new { fill: var(--ok); fill-opacity: 0.4; stroke: var(--ok); stroke-width: 1.5; }
    .num { fill: var(--probe); font-weight: 600; font-size: 13px; }
    .oktext { fill: var(--ok); font-weight: 600; }
    .lbl { font-size: 11px; font-weight: 600; }
    .arrow { fill: none; stroke: var(--probe); stroke-width: 2; }
    .arrowd { fill: none; stroke: var(--probe); stroke-width: 2; stroke-dasharray: 5 4; }
    .arrowhead { fill: var(--probe); }
    .okarrow { fill: none; stroke: var(--ok); stroke-width: 2; }
    .okhead { fill: var(--ok); }
    .sync { stroke: var(--fg); stroke-width: 2; }
    .mvar { font-family: 'Times New Roman', Times, 'STIX Two Text', serif; font-style: italic; font-size: 1.1em; }
    .now { fill: var(--fg); fill-opacity: 0.07; stroke: var(--fg); stroke-opacity: 0.45; stroke-dasharray: 3 3; }
    .flow { fill: none; stroke: var(--edge); stroke-width: 1.5; }
    .flowhead { fill: var(--edge); }
    .dash { fill: none; stroke: var(--edge); stroke-width: 1.5; stroke-dasharray: 5 4; }
    /* 60.85s loop, 10 steps starting at 0.5, 6.8, 12.8, 17.5, 23.9, 29.6, 36, 40.4, 45.2, 49.8 s; final frame holds 10.3s, then fades. */
    .a { opacity: 0; animation: 60.85s linear infinite; }
    .st1-2 { animation-name: st1_2; }  /* 0.5s to 6.8s */
    @keyframes st1_2 { 0.00%, 11.18% { opacity: 1 } 11.42%, 98.77% { opacity: 0 } 99.01%, 100.00% { opacity: 1 } }
    .st1 { animation-name: st1; }  /* 0.5s to end */
    @keyframes st1 { 0.00%, 100.00% { opacity: 1 } }
    .st2-3 { animation-name: st2_3; }  /* 6.8s to 12.8s */
    @keyframes st2_3 { 0.00%, 11.18% { opacity: 0 } 11.42%, 21.04% { opacity: 1 } 21.28%, 100.00% { opacity: 0 } }
    .st2 { animation-name: st2; }  /* 6.8s to end */
    @keyframes st2 { 0.00%, 11.18% { opacity: 0 } 11.42%, 98.77% { opacity: 1 } 99.01%, 100.00% { opacity: 0 } }
    .st3-4 { animation-name: st3_4; }  /* 12.8s to 17.5s */
    @keyframes st3_4 { 0.00%, 21.04% { opacity: 0 } 21.28%, 28.76% { opacity: 1 } 29.01%, 100.00% { opacity: 0 } }
    .st3-7 { animation-name: st3_7; }  /* 12.8s to 36s */
    @keyframes st3_7 { 0.00%, 21.04% { opacity: 0 } 21.28%, 59.16% { opacity: 1 } 59.41%, 100.00% { opacity: 0 } }
    .st3 { animation-name: st3; }  /* 12.8s to end */
    @keyframes st3 { 0.00%, 21.04% { opacity: 0 } 21.28%, 98.77% { opacity: 1 } 99.01%, 100.00% { opacity: 0 } }
    .st7-10 { animation-name: st7_10; }  /* 36s to 49.8s */
    @keyframes st7_10 { 0.00%, 59.16% { opacity: 0 } 59.41%, 81.84% { opacity: 1 } 82.09%, 100.00% { opacity: 0 } }
    .st4-5 { animation-name: st4_5; }  /* 17.5s to 23.9s */
    @keyframes st4_5 { 0.00%, 28.76% { opacity: 0 } 29.01%, 39.28% { opacity: 1 } 39.52%, 100.00% { opacity: 0 } }
    .st4 { animation-name: st4; }  /* 17.5s to end */
    @keyframes st4 { 0.00%, 28.76% { opacity: 0 } 29.01%, 98.77% { opacity: 1 } 99.01%, 100.00% { opacity: 0 } }
    .st5-6 { animation-name: st5_6; }  /* 23.9s to 29.6s */
    @keyframes st5_6 { 0.00%, 39.28% { opacity: 0 } 39.52%, 48.64% { opacity: 1 } 48.89%, 100.00% { opacity: 0 } }
    .st5 { animation-name: st5; }  /* 23.9s to end */
    @keyframes st5 { 0.00%, 39.28% { opacity: 0 } 39.52%, 98.77% { opacity: 1 } 99.01%, 100.00% { opacity: 0 } }
    .st6-7 { animation-name: st6_7; }  /* 29.6s to 36s */
    @keyframes st6_7 { 0.00%, 48.64% { opacity: 0 } 48.89%, 59.16% { opacity: 1 } 59.41%, 100.00% { opacity: 0 } }
    .st6 { animation-name: st6; }  /* 29.6s to end */
    @keyframes st6 { 0.00%, 48.64% { opacity: 0 } 48.89%, 98.77% { opacity: 1 } 99.01%, 100.00% { opacity: 0 } }
    .st7-8 { animation-name: st7_8; }  /* 36s to 40.4s */
    @keyframes st7_8 { 0.00%, 59.16% { opacity: 0 } 59.41%, 66.39% { opacity: 1 } 66.64%, 100.00% { opacity: 0 } }
    .st7 { animation-name: st7; }  /* 36s to end */
    @keyframes st7 { 0.00%, 59.16% { opacity: 0 } 59.41%, 98.77% { opacity: 1 } 99.01%, 100.00% { opacity: 0 } }
    .st8-9 { animation-name: st8_9; }  /* 40.4s to 45.2s */
    @keyframes st8_9 { 0.00%, 66.39% { opacity: 0 } 66.64%, 74.28% { opacity: 1 } 74.53%, 100.00% { opacity: 0 } }
    .st8 { animation-name: st8; }  /* 40.4s to end */
    @keyframes st8 { 0.00%, 66.39% { opacity: 0 } 66.64%, 98.77% { opacity: 1 } 99.01%, 100.00% { opacity: 0 } }
    .st9-10 { animation-name: st9_10; }  /* 45.2s to 49.8s */
    @keyframes st9_10 { 0.00%, 74.28% { opacity: 0 } 74.53%, 81.84% { opacity: 1 } 82.09%, 100.00% { opacity: 0 } }
    .st9 { animation-name: st9; }  /* 45.2s to end */
    @keyframes st9 { 0.00%, 74.28% { opacity: 0 } 74.53%, 98.77% { opacity: 1 } 99.01%, 100.00% { opacity: 0 } }
    .st10 { animation-name: st10; }  /* 49.8s to end */
    @keyframes st10 { 0.00%, 81.84% { opacity: 0 } 82.09%, 98.77% { opacity: 1 } 99.01%, 100.00% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; opacity: 0; }
      .a.fin { opacity: 1; }
    }
  </style>
