  <text x="224" y="369" text-anchor="end" class="muted a st10 fin">block 2</text>
  <rect x="230" y="334" width="40" height="18" class="hot a st10 fin"/>
  <text x="250.0" y="347" text-anchor="middle" class="lbl a st10 fin">L1</text>
  <line x1="272" y1="331" x2="272" y2="355" class="sync a st10 fin"/>
  <rect x="274" y="334" width="72" height="18" class="new a st10 fin"/>
  <text x="310.0" y="347" text-anchor="middle" class="lbl a st10 fin">C1</text>
  <line x1="348" y1="331" x2="348" y2="355" class="sync a st10 fin"/>
  <rect x="350" y="334" width="40" height="18" class="hot a st10 fin"/>
  <text x="370.0" y="347" text-anchor="middle" class="lbl a st10 fin">L2</text>
  <line x1="392" y1="331" x2="392" y2="355" class="sync a st10 fin"/>
  <rect x="424" y="334" width="72" height="18" class="new a st10 fin"/>
  <text x="460.0" y="347" text-anchor="middle" class="lbl a st10 fin">C2</text>
  <line x1="498" y1="331" x2="498" y2="355" class="sync a st10 fin"/>
  <rect x="500" y="334" width="40" height="18" class="hot a st10 fin"/>
  <text x="520.0" y="347" text-anchor="middle" class="lbl a st10 fin">L3</text>
  <line x1="542" y1="331" x2="542" y2="355" class="sync a st10 fin"/>
  <rect x="574" y="334" width="72" height="18" class="new a st10 fin"/>
  <text x="610.0" y="347" text-anchor="middle" class="lbl a st10 fin">C3</text>
  <line x1="648" y1="331" x2="648" y2="355" class="sync a st10 fin"/>
  <rect x="274" y="356" width="40" height="18" class="hot a st10 fin"/>
  <text x="294.0" y="369" text-anchor="middle" class="lbl a st10 fin">L1</text>
  <line x1="316" y1="353" x2="316" y2="377" class="sync a st10 fin"/>
  <rect x="350" y="356" width="72" height="18" class="new a st10 fin"/>
  <text x="386.0" y="369" text-anchor="middle" class="lbl a st10 fin">C1</text>
  <line x1="424" y1="353" x2="424" y2="377" class="sync a st10 fin"/>
  <rect x="426" y="356" width="40" height="18" class="hot a st10 fin"/>
  <text x="446.0" y="369" text-anchor="middle" class="lbl a st10 fin">L2</text>
  <line x1="468" y1="353" x2="468" y2="377" class="sync a st10 fin"/>
  <rect x="500" y="356" width="72" height="18" class="new a st10 fin"/>
  <text x="536.0" y="369" text-anchor="middle" class="lbl a st10 fin">C2</text>
  <line x1="574" y1="353" x2="574" y2="377" class="sync a st10 fin"/>
  <rect x="576" y="356" width="40" height="18" class="hot a st10 fin"/>
  <text x="596.0" y="369" text-anchor="middle" class="lbl a st10 fin">L3</text>
  <line x1="618" y1="353" x2="618" y2="377" class="sync a st10 fin"/>
  <rect x="650" y="356" width="72" height="18" class="new a st10 fin"/>
  <text x="686.0" y="369" text-anchor="middle" class="lbl a st10 fin">C3</text>
  <line x1="724" y1="353" x2="724" y2="377" class="sync a st10 fin"/>
  <text x="724" y="392" text-anchor="end" class="muted a st10 fin"><tspan class="b">2 blocks' work: 6 slices.</tspan> The blocks take turns computing, each at about half speed.</text>
  <text x="20" y="412" class="a st1-2">One buffer: the next load can't start until everyone is done reading this slice.</text>
  <text x="20" y="412" class="a st2-3">A second buffer lets the next slice land while this one is still being read.</text>
  <text x="20" y="412" class="a st3-4">Before the loop starts, slice 1 is loaded into buffer 0.</text>
  <text x="20" y="412" class="a st4-5">Slice 2's global loads go to registers first and overlap the math.</text>
  <text x="20" y="412" class="a st5-6">After the math, the registers are written to the free buffer; one sync publishes them.</text>
  <text x="20" y="412" class="a st6-7">Buffer 0 is no longer being read: slice 3 can go there next.</text>
  <text x="20" y="412" class="a st7-8">The same store, sync and swap, with the roles reversed.</text>
  <text x="20" y="412" class="a st8-9">The last slice computes with nothing left to fetch.</text>
  <text x="20" y="412" class="a st9-10">Each load now overlaps a compute. Only the first one is exposed.</text>
  <text x="20" y="412" class="b a st10 fin">Double buffering and a second block hide the same loads, so a second buffer adds little on top.</text>
</svg>
