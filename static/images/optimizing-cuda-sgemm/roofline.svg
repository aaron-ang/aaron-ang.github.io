<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated schematic roofline: a sloped memory roof meets a flat compute roof at the ridge, about 24 flops per byte. The 32 by 32 shared-memory kernel sits at 8 flop per byte, left of the ridge: its ceiling is the memory roof, and it falls short even of that. A 128 by 128 block tile with 8 by 8 per thread moves the kernel to 32 flop per byte, past the ridge, where only the compute roof caps it.">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --chip: #f4f4f4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --chip: #2a2a2a; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .b { font-weight: 600; }
    .num { fill: var(--probe); font-weight: 600; font-size: 13px; }
    .oktext { fill: var(--ok); font-weight: 600; }
    .arrow { fill: none; stroke: var(--probe); stroke-width: 2; }
    .arrowhead { fill: var(--probe); }
    .okarrow { fill: none; stroke: var(--ok); stroke-width: 2; }
    .okhead { fill: var(--ok); }
    .axis { fill: none; stroke: var(--fg); stroke-width: 1.5; }
    .roof { fill: none; stroke: var(--fg); stroke-width: 2.5; }
    .dash { fill: none; stroke: var(--edge); stroke-width: 1.5; stroke-dasharray: 5 4; }
    /* 40.0s loop, 7 steps starting at 0.5, 6.54, 10.97, 17.01, 21.34, 27.89, 32.92 s; final frame holds 6.33s, then fades. */
    .a { opacity: 0; animation: 40.0s linear infinite; }
    .w1 { animation-name: w1; }  /* 0.50s to end */
    @keyframes w1 { 0.00%, 100.00% { opacity: 1 } }
    .w2 { animation-name: w2; }  /* 6.54s to end */
    @keyframes w2 { 0.00%, 16.35% { opacity: 0 } 16.73%, 98.12% { opacity: 1 } 98.50%, 100.00% { opacity: 0 } }
    .w3 { animation-name: w3; }  /* 10.97s to end */
    @keyframes w3 { 0.00%, 27.43% { opacity: 0 } 27.80%, 98.12% { opacity: 1 } 98.50%, 100.00% { opacity: 0 } }
    .w4 { animation-name: w4; }  /* 17.01s to end */
    @keyframes w4 { 0.00%, 42.53% { opacity: 0 } 42.90%, 98.12% { opacity: 1 } 98.50%, 100.00% { opacity: 0 } }
    .w5 { animation-name: w5; }  /* 21.34s to end */
    @keyframes w5 { 0.00%, 53.35% { opacity: 0 } 53.73%, 98.12% { opacity: 1 } 98.50%, 100.00% { opacity: 0 } }
    .w6 { animation-name: w6; }  /* 27.89s to end */
    @keyframes w6 { 0.00%, 69.72% { opacity: 0 } 70.10%, 98.12% { opacity: 1 } 98.50%, 100.00% { opacity: 0 } }
    .w7 { animation-name: w7; }  /* 32.92s to end */
    @keyframes w7 { 0.00%, 82.30% { opacity: 0 } 82.67%, 98.12% { opacity: 1 } 98.50%, 100.00% { opacity: 0 } }
    .w8 { animation-name: w8; }  /* 0.50s to 6.54s */
    @keyframes w8 { 0.00%, 16.35% { opacity: 1 } 16.73%, 98.12% { opacity: 0 } 98.50%, 100.00% { opacity: 1 } }
    .w9 { animation-name: w9; }  /* 6.54s to 10.97s */
    @keyframes w9 { 0.00%, 16.35% { opacity: 0 } 16.73%, 27.43% { opacity: 1 } 27.80%, 100.00% { opacity: 0 } }
    .w10 { animation-name: w10; }  /* 10.97s to 17.01s */
    @keyframes w10 { 0.00%, 27.43% { opacity: 0 } 27.80%, 42.53% { opacity: 1 } 42.90%, 100.00% { opacity: 0 } }
    .w11 { animation-name: w11; }  /* 17.01s to 21.34s */
    @keyframes w11 { 0.00%, 42.53% { opacity: 0 } 42.90%, 53.35% { opacity: 1 } 53.73%, 100.00% { opacity: 0 } }
    .w12 { animation-name: w12; }  /* 21.34s to 27.89s */
    @keyframes w12 { 0.00%, 53.35% { opacity: 0 } 53.73%, 69.72% { opacity: 1 } 70.10%, 100.00% { opacity: 0 } }
    .w13 { animation-name: w13; }  /* 27.89s to 32.92s */
    @keyframes w13 { 0.00%, 69.72% { opacity: 0 } 70.10%, 82.30% { opacity: 1 } 82.67%, 100.00% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; opacity: 0; }
      .a.fin { opacity: 1; }
    }
    </style>
  <text x="20.0" y="28.0" class="title">Roofline model (single precision)</text>
  <path d="M 100 50 V 330 H 710" class="axis"/>
  <path d="M 357.1 330 v 5" class="axis"/>
  <path d="M 528.6 330 v 5" class="axis"/>
  <text x="400.0" y="360.0" text-anchor="middle" class="muted">arithmetic intensity (flops per byte of global-memory traffic, log scale)</text>
  <text x="80.0" y="190.0" text-anchor="middle" class="muted" transform="rotate(-90 80 190.0)">throughput (log scale)</text>
  <path d="M 100.0 262.0 L 493.0 75.5" class="roof a w1 fin"/>
  <text x="140.0" y="269.0" class="a w1 fin" transform="rotate(-25.4 140.0 269.0)">memory roof: bandwidth × intensity</text>
  <path d="M 493.0 75.5 H 700.0" class="roof a w2 fin"/>
  <text x="700.0" y="65.5" text-anchor="end" class="a w2 fin">compute roof</text>
  <path d="M 493.0 75.5 V 330" class="dash a w3 fin"/>
  <text x="485.0" y="300.0" text-anchor="end" class="muted a w3 fin">ridge ≈ 24</text>
  <text x="485.0" y="320.0" text-anchor="end" class="muted a w3 fin">memory-bound</text>
  <text x="696.0" y="290.0" text-anchor="end" class="muted a w3 fin">compute-bound</text>
  <circle cx="357.1" cy="202.0" r="7" class="arrowhead a w4 fin"/>
  <text x="357.1" y="229.0" text-anchor="middle" class="num a w4 fin">32×32 shared-memory tile</text>
  <text x="357.1" y="245.0" text-anchor="middle" class="muted a w4 fin">8 flops/byte</text>
  <path d="M 357.1 194.0 V 143.0" class="arrow a w5 fin" style="stroke-dasharray:3 3"/>
  <circle cx="357.1" cy="140.0" r="4" class="arrowhead a w5 fin"/>
  <text x="349.1" y="130.0" text-anchor="end" class="num a w5 fin">capped by the memory roof</text>
  <path d="M 367.1 196.0 L 507.9 128.6" class="okarrow a w6 fin"/>
  <polygon points="505.3,123.2 516.6,124.5 510.5,134.1" class="okhead a w6 fin"/>
  <text x="503.0" y="190.0" class="oktext a w6 fin" style="font-size:13px">bigger tiles: more flops per byte</text>
  <circle cx="528.6" cy="117.5" r="7" class="okhead a w7 fin"/>
  <text x="540.6" y="137.5" class="oktext a w7 fin" style="font-size:12px">128×128 block tile, 8×8 per thread</text>
  <text x="540.6" y="153.5" class="muted a w7 fin">32 flops/byte</text>
  <text x="20" y="404" class="a w8">With little reuse, memory bandwidth sets the ceiling: more flops per byte, higher ceiling.</text>
  <text x="20" y="404" class="a w9">No amount of reuse lifts throughput past the arithmetic units' peak.</text>
  <text x="20" y="404" class="a w10">The ridge is the intensity a kernel needs before memory stops being the limit.</text>
  <text x="20" y="404" class="a w11">A 32×32 tile uses each loaded value 32 times.</text>
  <text x="20" y="404" class="a w12">At 8 flops per byte its ceiling is the memory roof, and it falls short even of that.</text>
  <text x="20" y="404" class="a w13">A 128×128 tile uses each loaded value 128 times.</text>
  <text x="20" y="404" class="b a w7 fin">Past the ridge, more reuse no longer raises the ceiling.</text>
</svg>
