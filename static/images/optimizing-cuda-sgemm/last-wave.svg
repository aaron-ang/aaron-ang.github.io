  <text x="603" y="524" text-anchor="middle" class="oktext sm a st8 fin">time saved</text>
  <text x="20" y="548" class="a st1-2">Fourteen tiles of <tspan class="mvar">C</tspan>, six SMs: in the first wave, each SM takes one tile.</text>
  <text x="20" y="548" class="a st2-3">After a second wave of six more, twelve tiles are done.</text>
  <text x="20" y="548" class="a st3-4">Only two tiles remain for six SMs.</text>
  <text x="20" y="548" class="a st4-5">The multiply finishes only when the busiest SM does, one whole tile after the rest.</text>
  <text x="20" y="548" class="a st5-6">Three pieces per leftover tile make six, exactly one per SM.</text>
  <text x="20" y="548" class="a st6-7">Tile 13: SM 5, holding the last piece, adds SMs 1 and 3's sums and writes <tspan class="mvar">C</tspan>.</text>
  <text x="20" y="548" class="a st7-8">Every piece carries some overhead. The host estimates the busiest SM's time for 2–4 pieces.</text>
  <text x="20" y="548" class="b a st8 fin">Splitting only the last wave's tiles along <tspan class="mvar">K</tspan> keeps every SM busy until the end.</text>
