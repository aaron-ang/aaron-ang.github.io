<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 564" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated timeline of 14 tiles of C on 6 SMs, one lane per SM, time running right. Whole tiles go out in waves of six: two full waves, then a third wave where SMs 1 and 2 compute tiles 13 and 14 while the other four SMs sit idle, so the multiply ends one whole tile after they stop. Below, with stream-K, tiles 13 and 14 are each cut along K into three pieces, and the six pieces run one per SM, so all SMs finish together, earlier. For tile 13, SMs 1 and 3 store partial sums in a workspace; SM 5, which holds the last piece, adds them and writes the tile to C; tile 14 works the same way, with SM 6 adding. All of this happens before the new finish line. Each piece carries a little overhead, so the host estimates the busiest SM's time for two to four pieces per tile before choosing a split.">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --chip: #f4f4f4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --chip: #2a2a2a; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .b { font-weight: 600; }
    .sm { font-size: 12px; }
    .empty { fill: var(--empty); stroke: var(--edge); }
    .chip { fill: var(--chip); stroke: var(--edge); }
    .tile { fill: var(--full); stroke: var(--edge); }
    .hot { fill: var(--probe); fill-opacity: 0.35; stroke: var(--probe); stroke-width: 2; }
    .ovh { fill: var(--probe); fill-opacity: 0.85; }
    .ring { fill: none; stroke: var(--probe); stroke-width: 2; }
    .over { fill: none; stroke: var(--probe); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .done { stroke: var(--fg); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .ghost { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .axis { stroke: var(--edge); stroke-width: 1; fill: none; }
    .arr { stroke: var(--probe); stroke-width: 1.8; fill: none; }
    .ahead { fill: var(--probe); }
    .parr { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .phead { fill: var(--fg); }
    .ok { stroke: var(--ok); stroke-width: 2; fill: none; }
    .okhead { fill: var(--ok); }
    .add { fill: var(--ok); fill-opacity: 0.5; stroke: var(--ok); stroke-width: 1.2; }
    .num { fill: var(--probe); font-weight: 600; font-size: 13px; }
    .oktext { fill: var(--ok); font-weight: 600; }
    /* 59.75s loop, 8 steps starting at 0.5, 7.5, 13.7, 18.7, 24.2, 32.7, 43.5, 50 s; final frame holds 9s, then fades. */
    .a { opacity: 0; animation: 59.75s linear infinite; }
    .st1 { animation-name: st1; }  /* 0.5s to end */
    @keyframes st1 { 0.00%, 100.00% { opacity: 1 } }
    .st1-2 { animation-name: st1_2; }  /* 0.5s to 7.5s */
    @keyframes st1_2 { 0.00%, 12.55% { opacity: 1 } 12.80%, 98.74% { opacity: 0 } 99.00%, 100.00% { opacity: 1 } }
    .st2 { animation-name: st2; }  /* 7.5s to end */
    @keyframes st2 { 0.00%, 12.55% { opacity: 0 } 12.80%, 98.74% { opacity: 1 } 99.00%, 100.00% { opacity: 0 } }
    .st2-3 { animation-name: st2_3; }  /* 7.5s to 13.7s */
    @keyframes st2_3 { 0.00%, 12.55% { opacity: 0 } 12.80%, 22.93% { opacity: 1 } 23.18%, 100.00% { opacity: 0 } }
    .st3 { animation-name: st3; }  /* 13.7s to end */
    @keyframes st3 { 0.00%, 22.93% { opacity: 0 } 23.18%, 98.74% { opacity: 1 } 99.00%, 100.00% { opacity: 0 } }
    .st3-4 { animation-name: st3_4; }  /* 13.7s to 18.7s */
    @keyframes st3_4 { 0.00%, 22.93% { opacity: 0 } 23.18%, 31.30% { opacity: 1 } 31.55%, 100.00% { opacity: 0 } }
    .st4 { animation-name: st4; }  /* 18.7s to end */
    @keyframes st4 { 0.00%, 31.30% { opacity: 0 } 31.55%, 98.74% { opacity: 1 } 99.00%, 100.00% { opacity: 0 } }
    .st4-5 { animation-name: st4_5; }  /* 18.7s to 24.2s */
    @keyframes st4_5 { 0.00%, 31.30% { opacity: 0 } 31.55%, 40.50% { opacity: 1 } 40.75%, 100.00% { opacity: 0 } }
    .st5 { animation-name: st5; }  /* 24.2s to end */
    @keyframes st5 { 0.00%, 40.50% { opacity: 0 } 40.75%, 98.74% { opacity: 1 } 99.00%, 100.00% { opacity: 0 } }
    .st5-6 { animation-name: st5_6; }  /* 24.2s to 32.7s */
    @keyframes st5_6 { 0.00%, 40.50% { opacity: 0 } 40.75%, 54.73% { opacity: 1 } 54.98%, 100.00% { opacity: 0 } }
    .st6 { animation-name: st6; }  /* 32.7s to end */
    @keyframes st6 { 0.00%, 54.73% { opacity: 0 } 54.98%, 98.74% { opacity: 1 } 99.00%, 100.00% { opacity: 0 } }
    .st6-7 { animation-name: st6_7; }  /* 32.7s to 43.5s */
    @keyframes st6_7 { 0.00%, 54.73% { opacity: 0 } 54.98%, 72.80% { opacity: 1 } 73.05%, 100.00% { opacity: 0 } }
    .st7 { animation-name: st7; }  /* 43.5s to end */
    @keyframes st7 { 0.00%, 72.80% { opacity: 0 } 73.05%, 98.74% { opacity: 1 } 99.00%, 100.00% { opacity: 0 } }
    .st7-8 { animation-name: st7_8; }  /* 43.5s to 50s */
    @keyframes st7_8 { 0.00%, 72.80% { opacity: 0 } 73.05%, 83.68% { opacity: 1 } 83.93%, 100.00% { opacity: 0 } }
    .st8 { animation-name: st8; }  /* 50s to end */
    @keyframes st8 { 0.00%, 83.68% { opacity: 0 } 83.93%, 98.74% { opacity: 1 } 99.00%, 100.00% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; opacity: 0; }
      .a.fin { opacity: 1; }
    }
    .mvar { font-family: 'Times New Roman', Times, 'STIX Two Text', serif; font-style: italic; font-size: 1.1em; }
  </style>
