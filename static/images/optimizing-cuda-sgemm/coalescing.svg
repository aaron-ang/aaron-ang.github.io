<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated memory coalescing for 8 threads of one warp. Strided: each thread's address falls in a different memory segment, so the hardware issues 8 transactions. Coalesced: consecutive threads read consecutive addresses in one segment, served by 1 wide transaction.">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --chip: #f4f4f4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --chip: #2a2a2a; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .b { font-weight: 600; }
    .empty { fill: var(--empty); stroke: var(--edge); }
    .chip { fill: var(--chip); stroke: var(--edge); }
    .ring { fill: none; stroke: var(--probe); stroke-width: 3; }
    .okring { fill: none; stroke: var(--ok); stroke-width: 3; }
    .hot { fill: var(--probe); fill-opacity: 0.35; stroke: var(--probe); stroke-width: 2; }
    .num { fill: var(--probe); font-weight: 600; font-size: 13px; }
    .new { fill: var(--ok); }
    .oktext { fill: var(--ok); font-weight: 600; }
    .arrow { fill: none; stroke: var(--probe); stroke-width: 2; }
    .arrowhead { fill: var(--probe); }
    .okarrow { fill: none; stroke: var(--ok); stroke-width: 2; }
    .okhead { fill: var(--ok); }
    /* 27.61s loop, 6 steps starting at 0.5, 4.62, 8.04, 11.87, 15.99, 20.62 s; final frame holds 6.24s, then fades. */
    .a { opacity: 0; animation: 27.61s linear infinite; }
    .w1 { animation-name: w1; }  /* 4.62s to end */
    @keyframes w1 { 0.00%, 16.73% { opacity: 0 } 17.28%, 97.28% { opacity: 1 } 97.83%, 100.00% { opacity: 0 } }
    .w2 { animation-name: w2; }  /* 8.04s to end */
    @keyframes w2 { 0.00%, 29.12% { opacity: 0 } 29.66%, 97.28% { opacity: 1 } 97.83%, 100.00% { opacity: 0 } }
    .w3 { animation-name: w3; }  /* 8.04s to 11.87s */
    @keyframes w3 { 0.00%, 29.12% { opacity: 0 } 29.66%, 42.99% { opacity: 1 } 43.53%, 100.00% { opacity: 0 } }
    .w4 { animation-name: w4; }  /* 11.87s to end */
    @keyframes w4 { 0.00%, 42.99% { opacity: 0 } 43.53%, 97.28% { opacity: 1 } 97.83%, 100.00% { opacity: 0 } }
    .w5 { animation-name: w5; }  /* 15.99s to end */
    @keyframes w5 { 0.00%, 57.91% { opacity: 0 } 58.46%, 97.28% { opacity: 1 } 97.83%, 100.00% { opacity: 0 } }
    .w6 { animation-name: w6; }  /* 20.62s to end */
    @keyframes w6 { 0.00%, 74.68% { opacity: 0 } 75.23%, 97.28% { opacity: 1 } 97.83%, 100.00% { opacity: 0 } }
    .w7 { animation-name: w7; }  /* 0.50s to 4.62s */
    @keyframes w7 { 0.00%, 16.73% { opacity: 1 } 17.28%, 97.28% { opacity: 0 } 97.83%, 100.00% { opacity: 1 } }
    .w8 { animation-name: w8; }  /* 4.62s to 8.04s */
    @keyframes w8 { 0.00%, 16.73% { opacity: 0 } 17.28%, 29.12% { opacity: 1 } 29.66%, 100.00% { opacity: 0 } }
    .w9 { animation-name: w9; }  /* 11.87s to 15.99s */
    @keyframes w9 { 0.00%, 42.99% { opacity: 0 } 43.53%, 57.91% { opacity: 1 } 58.46%, 100.00% { opacity: 0 } }
    .w10 { animation-name: w10; }  /* 15.99s to 20.62s */
    @keyframes w10 { 0.00%, 57.91% { opacity: 0 } 58.46%, 74.68% { opacity: 1 } 75.23%, 100.00% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; opacity: 0; }
      .a.fin { opacity: 1; }
    }
    </style>
  <text x="20" y="24" class="muted">The threads of one warp issue a load together.</text>
