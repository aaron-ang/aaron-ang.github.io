    .w19 { animation-name: w19; }  /* 25.31s to 28.23s */
    @keyframes w19 { 0.00%, 50.52% { opacity: 0 } 50.82%, 56.35% { opacity: 1 } 56.65%, 100.00% { opacity: 0 } }
    .w20 { animation-name: w20; }  /* 32.55s to 34.86s */
