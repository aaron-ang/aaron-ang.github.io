  <text x="20" y="396" class="a w17">One block computes one tile of <tspan class="mvar">C</tspan> from a strip of <tspan class="mvar">A</tspan> and a strip of <tspan class="mvar">B</tspan>.</text>
  <text x="20" y="396" class="a w5">All threads copy the two tiles together, then wait at the barrier.</text>
  <text x="20" y="396" class="a w18">Past the barrier, threads read only shared memory.</text>
  <text x="20" y="396" class="a w22">Wait at a barrier until every thread is done with slice 1.</text>
  <text x="20" y="396" class="a w7">Then copy slice 2 into shared memory.</text>
  <text x="20" y="396" class="a w19">Threads add slice 2 to their sums.</text>
  <text x="20" y="396" class="a w10">Same copy and barrier for slice 3.</text>
  <text x="20" y="396" class="a w20">Threads add slice 3.</text>
  <text x="20" y="396" class="a w13">The last slice is copied.</text>
  <text x="20" y="396" class="a w21">Threads add slice 4: their sums are complete.</text>
  <text x="20" y="396" class="b a w16 fin">Each value of <tspan class="mvar">A</tspan> and <tspan class="mvar">B</tspan> now leaves global memory once per block, not once per thread.</text>
</svg>
