<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated shared-memory tiling: one thread block owns a tile of C. For each of 4 slices along K it copies a tile of A and a tile of B from global memory into shared memory once, and every thread reads them from there, after a barrier, to update its running sum; before each later copy, the threads wait at that same barrier until every thread is done with the previous slice, so the copy cannot overwrite tiles still being read. After the last slice, each thread writes its finished sum to C.">
