    .oktext { fill: var(--ok); font-weight: 600; }
    .arrow { fill: none; stroke: var(--probe); stroke-width: 2; }
    .arrowhead { fill: var(--probe); }
    .grey { fill: none; stroke: var(--edge); stroke-width: 1.5; }
    .greyhead { fill: var(--edge); }
    .dash { fill: none; stroke: var(--edge); stroke-width: 1.5; stroke-dasharray: 5 4; }
