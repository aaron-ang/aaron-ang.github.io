  </g>
  <text x="20" y="272" class="a w14">One output of <tspan class="mvar">C</tspan> is a dot product.</text>
  <text x="20" y="272" class="a w4">Multiply-add 1 of 4: <tspan class="mvar">C</tspan>[<tspan class="mvar">i</tspan>][<tspan class="mvar">j</tspan>] += <tspan class="mvar">A</tspan>[<tspan class="mvar">i</tspan>][0] × <tspan class="mvar">B</tspan>[0][<tspan class="mvar">j</tspan>]</text>
  <text x="20" y="272" class="a w7">Multiply-add 2 of 4: <tspan class="mvar">C</tspan>[<tspan class="mvar">i</tspan>][<tspan class="mvar">j</tspan>] += <tspan class="mvar">A</tspan>[<tspan class="mvar">i</tspan>][1] × <tspan class="mvar">B</tspan>[1][<tspan class="mvar">j</tspan>]</text>
  <text x="20" y="272" class="a w9">Multiply-add 3 of 4: <tspan class="mvar">C</tspan>[<tspan class="mvar">i</tspan>][<tspan class="mvar">j</tspan>] += <tspan class="mvar">A</tspan>[<tspan class="mvar">i</tspan>][2] × <tspan class="mvar">B</tspan>[2][<tspan class="mvar">j</tspan>]</text>
  <text x="20" y="272" class="a w11">Multiply-add 4 of 4: <tspan class="mvar">C</tspan>[<tspan class="mvar">i</tspan>][<tspan class="mvar">j</tspan>] += <tspan class="mvar">A</tspan>[<tspan class="mvar">i</tspan>][3] × <tspan class="mvar">B</tspan>[3][<tspan class="mvar">j</tspan>]</text>
  <text x="20" y="272" class="a w15"><tspan class="mvar">C</tspan>[<tspan class="mvar">i</tspan>][<tspan class="mvar">j</tspan>] is done after <tspan class="mvar">N</tspan> = 4 multiply-adds.</text>
  <text x="20" y="272" class="a w16"><tspan class="mvar">C</tspan>[<tspan class="mvar">i</tspan>][<tspan class="mvar">j</tspan>+1] fetches row <tspan class="mvar">i</tspan> of <tspan class="mvar">A</tspan> from memory a second time.</text>
  <text x="20" y="272" class="b a w13 fin"><tspan class="mvar">N</tspan><tspan baseline-shift="super" font-size="0.7em">2</tspan> outputs × 2<tspan class="mvar">N</tspan> reads each, yet <tspan class="mvar">A</tspan> and <tspan class="mvar">B</tspan> hold only 2<tspan class="mvar">N</tspan><tspan baseline-shift="super" font-size="0.7em">2</tspan> distinct values.</text>
