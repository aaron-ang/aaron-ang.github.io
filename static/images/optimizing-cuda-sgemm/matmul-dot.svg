  <text x="297" y="160" text-anchor="middle" style="font-size:22px">×</text>
  <text x="527" y="160" text-anchor="middle" style="font-size:22px">=</text>
  <rect x="108" y="114" width="148" height="40" rx="3" class="ring a w1 fin"/>
