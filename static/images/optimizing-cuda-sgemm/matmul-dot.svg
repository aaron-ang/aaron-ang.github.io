<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animated dot product: one output of C = A times B is computed by walking row i of A and column j of B, one multiply-add at a time. The next output, C[i][j+1], re-reads the same row of A. In all, N squared outputs times 2N reads each, yet A and B hold only 2N squared distinct values.">
  <style>
    :root { --fg: #222; --muted: #777; --full: #cfcfcf; --empty: #ffffff; --edge: #999; --probe: #d9480f; --ok: #2b8a3e; --chip: #f4f4f4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ddd; --muted: #999; --full: #555; --empty: #1e1e1e; --edge: #777; --probe: #ff8a4c; --ok: #69db7c; --chip: #2a2a2a; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 12px; }
    .title { font-weight: 600; font-size: 15px; }
    .b { font-weight: 600; }
    .empty { fill: var(--empty); stroke: var(--edge); }
    .ring { fill: none; stroke: var(--probe); stroke-width: 3; }
    .okring { fill: none; stroke: var(--ok); stroke-width: 3; }
    .hot { fill: var(--probe); fill-opacity: 0.35; stroke: var(--probe); stroke-width: 2; }
    .num { fill: var(--probe); font-weight: 600; font-size: 13px; }
    .new { fill: var(--ok); }
    .oktext { fill: var(--ok); font-weight: 600; }
    /* 34.47s loop, 8 steps starting at 0.5, 3.72, 7.85, 11.38, 14.91, 18.44, 22.16, 27.29 s; final frame holds 6.43s, then fades. */
    .a { opacity: 0; animation: 34.47s linear infinite; }
    .w1 { animation-name: w1; }  /* 0.50s to end */
    @keyframes w1 { 0.00%, 100.00% { opacity: 1 } }
    .w2 { animation-name: w2; }  /* 0.50s to 18.44s */
    @keyframes w2 { 0.00%, 53.50% { opacity: 1 } 53.93%, 97.82% { opacity: 0 } 98.26%, 100.00% { opacity: 1 } }
    .w3 { animation-name: w3; }  /* 18.44s to end */
    @keyframes w3 { 0.00%, 53.50% { opacity: 0 } 53.93%, 97.82% { opacity: 1 } 98.26%, 100.00% { opacity: 0 } }
    .w4 { animation-name: w4; }  /* 3.72s to 7.85s */
    @keyframes w4 { 0.00%, 10.79% { opacity: 0 } 11.23%, 22.77% { opacity: 1 } 23.21%, 100.00% { opacity: 0 } }
    .w5 { animation-name: w5; }  /* 7.85s to end */
    @keyframes w5 { 0.00%, 22.77% { opacity: 0 } 23.21%, 97.82% { opacity: 1 } 98.26%, 100.00% { opacity: 0 } }
    .w6 { animation-name: w6; }  /* 3.72s to end */
    @keyframes w6 { 0.00%, 10.79% { opacity: 0 } 11.23%, 97.82% { opacity: 1 } 98.26%, 100.00% { opacity: 0 } }
    .w7 { animation-name: w7; }  /* 7.85s to 11.38s */
    @keyframes w7 { 0.00%, 22.77% { opacity: 0 } 23.21%, 33.01% { opacity: 1 } 33.45%, 100.00% { opacity: 0 } }
    .w8 { animation-name: w8; }  /* 11.38s to end */
    @keyframes w8 { 0.00%, 33.01% { opacity: 0 } 33.45%, 97.82% { opacity: 1 } 98.26%, 100.00% { opacity: 0 } }
    .w9 { animation-name: w9; }  /* 11.38s to 14.91s */
    @keyframes w9 { 0.00%, 33.01% { opacity: 0 } 33.45%, 43.26% { opacity: 1 } 43.69%, 100.00% { opacity: 0 } }
    .w10 { animation-name: w10; }  /* 14.91s to end */
    @keyframes w10 { 0.00%, 43.26% { opacity: 0 } 43.69%, 97.82% { opacity: 1 } 98.26%, 100.00% { opacity: 0 } }
    .w11 { animation-name: w11; }  /* 14.91s to 18.44s */
    @keyframes w11 { 0.00%, 43.26% { opacity: 0 } 43.69%, 53.50% { opacity: 1 } 53.93%, 100.00% { opacity: 0 } }
    .w12 { animation-name: w12; }  /* 22.16s to end */
    @keyframes w12 { 0.00%, 64.29% { opacity: 0 } 64.72%, 97.82% { opacity: 1 } 98.26%, 100.00% { opacity: 0 } }
    .w13 { animation-name: w13; }  /* 27.29s to end */
    @keyframes w13 { 0.00%, 79.17% { opacity: 0 } 79.61%, 97.82% { opacity: 1 } 98.26%, 100.00% { opacity: 0 } }
    .w14 { animation-name: w14; }  /* 0.50s to 3.72s */
    @keyframes w14 { 0.00%, 10.79% { opacity: 1 } 11.23%, 97.82% { opacity: 0 } 98.26%, 100.00% { opacity: 1 } }
    .w15 { animation-name: w15; }  /* 18.44s to 22.16s */
    @keyframes w15 { 0.00%, 53.50% { opacity: 0 } 53.93%, 64.29% { opacity: 1 } 64.72%, 100.00% { opacity: 0 } }
    .w16 { animation-name: w16; }  /* 22.16s to 27.29s */
    @keyframes w16 { 0.00%, 64.29% { opacity: 0 } 64.72%, 79.17% { opacity: 1 } 79.61%, 100.00% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; opacity: 0; }
      .a.fin { opacity: 1; }
    }
    .mvar { font-family: 'Times New Roman', Times, 'STIX Two Text', serif; font-style: italic; font-size: 1.1em; }
  </style>
