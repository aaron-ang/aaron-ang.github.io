  <title id="title">Wider global loads</title>
  <desc id="desc">A 32-float row uses 32 scalar load instructions or eight float4 load instructions; both transfer 128 bytes.</desc>
  <style>
    /* ONS chart typography: 20px title, 16px subheading, 14px labels/annotations.
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography */
    :root {
      --fg: #222;
      --muted: #707071;
      --edge: #999;
      --load: #b83c0b;
      --ok: #237a36;
      --type-heading: 20px;
      --type-subheading: 16px;
      --type-label: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --muted: #aaa;
        --edge: #888;
        --load: #ff9a64;
        --ok: #82df92;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .title {
      font-weight: 700;
    }
    .sub {
      font-weight: 600;
    }
    .note {
      fill: var(--muted);
    }
    .outline {
      fill: none;
      stroke: var(--edge);
    }
    .load {
      fill: var(--load);
      fill-opacity: 0.15;
      stroke: var(--load);
    }
    .ok {
      fill: var(--ok);
      fill-opacity: 0.15;
      stroke: var(--ok);
    }
    /* Typography adapted from ONS chart guidance:
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography
    20px headings, 16px subheadings, 14px labels at native display width.
    Variables compensate for the original graphics coordinate scale. */
    .type-heading {
      font-size: var(--type-heading);
    }
    .type-subheading {
      font-size: var(--type-subheading);
    }

