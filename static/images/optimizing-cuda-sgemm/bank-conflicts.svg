<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 360"
  role="img"
  aria-labelledby="title desc"
  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
  width="640"
  height="360"
  data-diagram-width="640"
>
  <title id="title">Two threads: which banks serve their first read?</title>
  <desc id="desc">Only threads 0 and 4 and their first four-float reads are shown. Before regrouping, columns 0–3 and 32–35 both use banks 0–3, requiring separate passes. After regrouping, thread 4 reads columns 16–19, using different banks from thread 0.</desc>
  <style>
    :root {
      --fg: #222;
      --muted: #656565;
      --load: #b83c0b;
      --compute: #237a36;
      --type-heading: 20px;
      --type-subheading: 16px;
      --type-label: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ddd;
        --muted: #aaa;
        --load: #ff9a64;
        --compute: #82df92;
      }
    }
    text {
      fill: var(--fg);
      font-variant-numeric: lining-nums tabular-nums;
      font-size: var(--type-label);
    }
    .small {
      fill: var(--muted);
    }
    .load {
      fill: var(--load);
    }
    .loadbox {
      fill: var(--load);
      fill-opacity: 0.15;
      stroke: var(--load);
      stroke-width: 1.5;
    }
    .computebox {
      fill: var(--compute);
      fill-opacity: 0.16;
      stroke: var(--compute);
      stroke-width: 1.5;
    }
    .arrow {
      fill: none;
      stroke: var(--fg);
      stroke-width: 1.6;
    }
    .title {
      font-weight: 700;
    }
    .bold {
      font-weight: 600;
    }
    /* Typography adapted from ONS chart guidance:
    https://service-manual.ons.gov.uk/data-visualisation/build-specifications/typography
    20px headings, 16px subheadings, 14px labels at native display width.
    Variables compensate for the original graphics coordinate scale. */
    .type-heading {
      font-size: var(--type-heading);
    }
    .type-subheading {
      font-size: var(--type-subheading);
    }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--fg)" />
    </marker>
  </defs>
  <text x="20" y="30" class="title type-heading">Two threads: which banks serve their first read?</text>
  <text x="20" y="61" class="small">Each request below reads four neighboring floats.</text>
  <text x="20" y="96" class="bold type-subheading">Before: different values, same banks</text>
  <rect x="20" y="112" width="180" height="35" rx="4" class="loadbox" />
  <text x="110.0" y="135.5" text-anchor="middle">t0: columns 0–3</text>
  <rect x="20" y="159" width="180" height="35" rx="4" class="loadbox" />
  <text x="110.0" y="182.5" text-anchor="middle">t4: columns 32–35</text>
  <rect x="352" y="135" width="172" height="38" rx="4" class="loadbox" />
  <text x="438.0" y="160.0" text-anchor="middle">banks 0–3</text>
  <line x1="200" y1="130" x2="352" y2="148" class="arrow" marker-end="url(#arrow)" />
  <line x1="200" y1="177" x2="352" y2="160" class="arrow" marker-end="url(#arrow)" />
  <text x="352" y="198" class="load bold type-subheading">Two passes</text>
  <text x="20" y="237" class="bold type-subheading">After: different values, different banks</text>
  <rect x="20" y="253" width="180" height="35" rx="4" class="computebox" />
  <text x="110.0" y="276.5" text-anchor="middle">t0: columns 0–3</text>
  <rect x="20" y="300" width="180" height="35" rx="4" class="computebox" />
  <text x="110.0" y="323.5" text-anchor="middle">t4: columns 16–19</text>
  <rect x="352" y="253" width="172" height="35" rx="4" class="computebox" />
  <text x="438.0" y="276.5" text-anchor="middle">banks 0–3</text>
  <rect x="352" y="300" width="172" height="35" rx="4" class="computebox" />
  <text x="438.0" y="323.5" text-anchor="middle">banks 16–19</text>
  <line x1="200" y1="270" x2="352" y2="270" class="arrow" marker-end="url(#arrow)" />
  <line x1="200" y1="317" x2="352" y2="317" class="arrow" marker-end="url(#arrow)" />
</svg>
